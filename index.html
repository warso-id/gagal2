<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 Digital Library | Flip Book</title>
  
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e0d5c5;
      --text-secondary: #8a7a6a;
      --accent: #c9a87c;
      --page-color: #fdf8f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
      flex-shrink: 0;
      min-height: 48px;
    }

    .logo-container { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      box-shadow: 0 2px 8px rgba(201,168,124,0.3);
    }

    .app-title { color: var(--text); font-size: 0.95rem; font-weight: 600; white-space: nowrap; }

    .search-wrapper { flex: 1; position: relative; max-width: 350px; margin: 0 10px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 0.85rem; pointer-events: none; z-index: 1; }

    .search-input {
      width: 100%;
      padding: 7px 14px 7px 34px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
      font-family: inherit;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-secondary); }

    .header-actions { display: flex; gap: 6px; flex-shrink: 0; overflow-x: auto; }
    .header-actions::-webkit-scrollbar { height: 0; }

    .year-pill {
      padding: 5px 10px;
      border-radius: 14px;
      background: rgba(201,168,124,0.1);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(201,168,124,0.2);
      white-space: nowrap;
      font-family: inherit;
    }

    .year-pill:hover { background: rgba(201,168,124,0.2); }
    .year-pill.active { background: var(--accent); color: #1a1a1a; }

    .main-content { flex: 1; position: relative; overflow: hidden; }

    .library-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: all 0.35s;
    }

    .library-view.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; }

    .filter-row {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .filter-chip {
      padding: 5px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-secondary);
      font-size: 0.7rem;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }

    .filter-chip:hover { background: rgba(255,255,255,0.08); }
    .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }

    .book-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 14px;
    }

    .book-scroll::-webkit-scrollbar { width: 4px; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    .year-group { margin-bottom: 18px; }

    .year-group-header {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 2px 6px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .year-group-header .book-count { font-size: 0.65rem; color: var(--text-secondary); font-weight: 400; }

    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

    .book-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .book-card:hover { border-color: rgba(201,168,124,0.3); transform: translateY(-2px); }
    .book-card:active { transform: scale(0.97); }
    .book-card .card-emoji { font-size: 1.6rem; margin-bottom: 5px; }

    .book-card .card-title {
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-card .card-year { color: var(--text-secondary); font-size: 0.6rem; }

    .book-card .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.5rem;
      background: rgba(201,168,124,0.2);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 8px;
    }

    .reader-view {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.4s;
      z-index: 50;
    }

    .reader-view.active { transform: translateX(0); }

    .reader-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.9);
      z-index: 60;
      flex-shrink: 0;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.72rem;
      font-family: inherit;
    }

    .reader-title {
      flex: 1;
      color: var(--text);
      font-size: 0.75rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-logo-sm {
      width: 24px;
      height: 24px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .book-spread { width: 100%; height: 100%; display: flex; position: relative; }

    .page-left-wrap { width: 50%; height: 100%; position: relative; }

    .page-left-inner {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      overflow: hidden;
    }

    .pdf-canvas-left { max-width: 100%; max-height: 100%; }

    .page-right-wrap { width: 50%; height: 100%; position: relative; perspective: 1500px; }

    .page-flip {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
      transform-origin: left center;
    }

    .page-back-face {
      position: absolute;
      inset: 0;
      background: #e8dcc8;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .page-front-face {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      overflow: hidden;
    }

    .pdf-canvas-right, .pdf-canvas-back { max-width: 100%; max-height: 100%; }

    .page-label { text-align: center; padding: 3px; font-size: 0.55rem; color: #aaa; flex-shrink: 0; }

    .spine-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,0,0,0.2);
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    .load-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 80;
      transition: opacity 0.3s;
    }

    .load-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-text { color: var(--text-secondary); margin-top: 10px; font-size: 0.75rem; }
    .load-progress { width: 200px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .load-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }

    .retry-btn {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      margin-top: 12px;
      font-family: inherit;
    }

    .retry-btn.hidden { display: none; }

    .reader-bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.9);
      flex-shrink: 0;
      z-index: 60;
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }

    .page-indicator {
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      padding: 5px 12px;
      border-radius: 12px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 200;
      display: none;
      animation: slideDown 0.3s;
      font-weight: 600;
    }

    .toast.show { display: block; }
    .toast.error { background: #e74c3c; color: white; }
    .toast.success { background: #27ae60; color: white; }
    .toast.info { background: #3498db; color: white; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
      .book-card { padding: 10px 6px; }
      .book-card .card-emoji { font-size: 1.4rem; }
      .book-card .card-title { font-size: 0.68rem; }
      .nav-btn { width: 34px; height: 34px; font-size: 0.9rem; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      .app-header { flex-wrap: wrap; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 4px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="logo-container">
        <div class="logo"></div>
        <span class="app-title">Digital Library</span>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Cari buku...">
      </div>
      <div class="header-actions" id="yearBadges"></div>
    </div>

    <div class="main-content">
      <div class="library-view" id="libraryView">
        <div class="filter-row" id="filterRow"></div>
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-ring"></div>
            <div class="load-text">Memuat koleksi...</div>
          </div>
        </div>
      </div>

      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku</div>
          <div class="reader-logo-sm"></div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area-left" id="pdfAreaLeft">
                  <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
                </div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>

            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face" id="pageBackFace">
                  <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
                </div>
                <div class="page-front-face" id="pageFrontFace">
                  <div class="pdf-area-right" id="pdfAreaRight">
                    <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                  </div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>

          <div class="load-overlay" id="readerLoading">
            <div class="spinner-ring"></div>
            <div class="load-text" id="readerLoadText">Membuka PDF...</div>
            <div class="load-progress"><div class="load-progress-bar" id="loadProgressBar"></div></div>
            <button class="retry-btn hidden" id="retryBtn">🔄 Coba Lagi</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      const CHUNK_SIZE = 500 * 1024;
      const MAX_RETRIES = 2;

      const state = {
        allBooks: [],
        groupedBooks: {},
        years: [],
        categories: [],
        currentBook: null,
        pdfBase64: null,
        totalPages: 10,
        totalSpreads: 5,
        currentSpread: 0,
        isFlipping: false,
        activeYear: '',
        activeCategory: '',
        searchQuery: '',
        booksCache: { data: null, time: 0 }
      };

      const $ = (id) => document.getElementById(id);
      
      const DOM = {
        libraryView: $('libraryView'),
        bookScroll: $('bookScroll'),
        libLoading: $('libLoading'),
        filterRow: $('filterRow'),
        yearBadges: $('yearBadges'),
        searchInput: $('searchInput'),
        readerView: $('readerView'),
        readerLoading: $('readerLoading'),
        readerLoadText: $('readerLoadText'),
        loadProgressBar: $('loadProgressBar'),
        retryBtn: $('retryBtn'),
        pageFlip: $('pageFlip'),
        pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'),
        pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'),
        pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'),
        pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'),
        btnPrev: $('btnPrev'),
        btnNext: $('btnNext'),
        btnBack: $('btnBack'),
        toast: $('toast'),
      };

      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      
      const escHtml = (s) => {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      };

      function showToast(msg, type = 'info', dur = 3000) {
        DOM.toast.textContent = msg;
        DOM.toast.className = 'toast show ' + type;
        setTimeout(() => DOM.toast.classList.remove('show'), dur);
      }

      function showLibLoading(s) { DOM.libLoading.classList.toggle('hidden', !s); }
      
      function showReaderLoading(s, txt = '', prog = 0) {
        DOM.readerLoading.classList.toggle('hidden', !s);
        if (txt) DOM.readerLoadText.textContent = txt;
        DOM.loadProgressBar.style.width = prog + '%';
        DOM.retryBtn.classList.toggle('hidden', true);
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        const lp = state.currentSpread * 2 + 1;
        const rp = Math.min(lp + 1, state.totalPages);
        DOM.pageIndicator.textContent = `${lp}-${rp} / ${state.totalPages}`;
      }

      function clearCanvas(c) {
        if (!c) return;
        const ctx = c.getContext('2d');
        c.width = 1; c.height = 1;
        ctx.clearRect(0, 0, 1, 1);
      }

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks(force = false) {
        const CACHE_TIME = 30 * 60 * 1000;
        if (!force && state.booksCache.data && (Date.now() - state.booksCache.time) < CACHE_TIME) {
          state.allBooks = state.booksCache.data;
          processBooks();
          return;
        }

        showLibLoading(true);
        
        try {
          const p = new URLSearchParams();
          if (state.searchQuery) p.append('q', state.searchQuery);
          if (state.activeYear) p.append('year', state.activeYear);
          
          const url = WEBAPP_URL + (p.toString() ? '?' + p.toString() : '');
          const res = await fetch(url);
          const data = await res.json();
          
          if (data.success) {
            state.allBooks = data.books || [];
            state.years = data.years || [];
            state.categories = data.categories || [];
            state.booksCache = { data: state.allBooks, time: Date.now() };
            processBooks();
          }
        } catch (e) {
          console.warn('Fetch error:', e.message);
          if (!state.allBooks.length) {
            state.allBooks = [
              { title: '📄 Sample PDF', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi' },
              { title: '🔬 Science Book', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Sains' }
            ];
            state.years = ['2024/2025'];
            state.categories = ['Teknologi', 'Sains'];
            processBooks();
          }
        }
        
        showLibLoading(false);
      }

      function processBooks() {
        const filtered = state.allBooks.filter(b => {
          const my = !state.activeYear || b.academicYear === state.activeYear;
          const mc = !state.activeCategory || b.category === state.activeCategory;
          return my && mc;
        });
        
        state.groupedBooks = {};
        filtered.forEach(b => {
          const y = b.academicYear || 'Unknown';
          if (!state.groupedBooks[y]) state.groupedBooks[y] = [];
          state.groupedBooks[y].push(b);
        });
        
        renderYearBadges();
        renderFilterRow();
        renderBookGrid();
      }

      function renderYearBadges() {
        DOM.yearBadges.innerHTML = state.years.slice(0, 3).map(y =>
          `<button class="year-pill ${state.activeYear === y ? 'active' : ''}" data-year="${y}">📅 ${y}</button>`
        ).join('');
        
        DOM.yearBadges.querySelectorAll('.year-pill').forEach(p => {
          p.addEventListener('click', function() {
            const y = this.getAttribute('data-year');
            state.activeYear = state.activeYear === y ? '' : y;
            processBooks();
          });
        });
      }

      function renderFilterRow() {
        const chips = [`<button class="filter-chip ${!state.activeCategory ? 'active' : ''}" data-category="">📚 Semua</button>`];
        state.categories.forEach(c => {
          chips.push(`<button class="filter-chip ${state.activeCategory === c ? 'active' : ''}" data-category="${c}">${c}</button>`);
        });
        
        DOM.filterRow.innerHTML = chips.join('');
        DOM.filterRow.querySelectorAll('.filter-chip').forEach(ch => {
          ch.addEventListener('click', function() {
            state.activeCategory = this.getAttribute('data-category') || '';
            processBooks();
          });
        });
      }

      function renderBookGrid() {
        const years = Object.keys(state.groupedBooks).sort().reverse();
        
        if (!years.length) {
          DOM.bookScroll.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-secondary);"><div style="font-size:3rem;">📭</div><div>Tidak ada buku</div></div>';
          return;
        }
        
        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        let html = '';
        
        years.forEach(y => {
          const books = state.groupedBooks[y];
          html += `<div class="year-group">
            <div class="year-group-header">📅 ${y} <span class="book-count">${books.length} buku</span></div>
            <div class="book-grid">
              ${books.map((b, i) => `
                <div class="book-card" data-fileid="${escHtml(b.fileId)}" data-title="${escHtml(b.title)}">
                  <div class="card-badge">${escHtml(b.category || 'Umum')}</div>
                  <div class="card-emoji">${icons[i % icons.length]}</div>
                  <div class="card-title">${escHtml(b.title)}</div>
                  <div class="card-year">${escHtml(b.academicYear || '')}</div>
                </div>
              `).join('')}
            </div>
          </div>`;
        });
        
        DOM.bookScroll.innerHTML = html;
        
        DOM.bookScroll.querySelectorAll('.book-card').forEach(card => {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'));
          });
        });
      }

      // ============================================
      // SEARCH
      // ============================================
      let st;
      DOM.searchInput.addEventListener('input', function() {
        clearTimeout(st);
        st = setTimeout(() => {
          state.searchQuery = this.value;
          fetchBooks();
        }, 400);
      });

      // ============================================
      // OPEN BOOK - CHUNKED BASE64
      // ============================================
      async function openBook(fileId, title) {
        state.currentBook = { fileId, title };
        state.pdfBase64 = null;
        state.totalPages = 10;
        state.currentSpread = 0;
        state.totalSpreads = 5;
        state.isFlipping = false;

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        [DOM.pdfCanvasLeft, DOM.pdfCanvasRight, DOM.pdfCanvasBack].forEach(clearCanvas);
        
        DOM.pageLabelLeft.textContent = '';
        DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0';
        
        updateNav();
        showReaderLoading(true, 'Mengambil info PDF...', 5);
        
        await loadPDFChunked(fileId);
      }

      async function loadPDFChunked(fileId) {
        try {
          // Step 1: Get PDF info
          const infoUrl = WEBAPP_URL + '?action=getPDFInfo&fileId=' + fileId;
          const infoRes = await fetch(infoUrl);
          const infoData = await infoRes.json();
          
          if (!infoData.success) throw new Error('Gagal mendapatkan info PDF');
          
          const totalChunks = infoData.totalChunks;
          console.log(`📦 PDF: ${infoData.fileName}, Size: ${(infoData.totalSize/1024).toFixed(1)}KB, Chunks: ${totalChunks}`);
          
          showReaderLoading(true, `Mengunduh PDF (0/${totalChunks} chunks)...`, 10);
          
          // Step 2: Fetch all chunks
          let fullBase64 = '';
          
          for (let i = 0; i < totalChunks; i++) {
            const chunkUrl = WEBAPP_URL + `?action=getPDFChunk&fileId=${fileId}&chunk=${i}&totalChunks=${totalChunks}`;
            
            let retries = 0;
            let chunkData = null;
            
            while (retries < MAX_RETRIES && !chunkData) {
              try {
                const chunkRes = await fetch(chunkUrl);
                chunkData = await chunkRes.json();
                
                if (!chunkData.success) throw new Error('Chunk gagal');
              } catch (e) {
                retries++;
                if (retries >= MAX_RETRIES) throw e;
                await sleep(1000);
              }
            }
            
            fullBase64 += chunkData.data;
            
            const progress = 10 + Math.round(((i + 1) / totalChunks) * 60);
            showReaderLoading(true, `Mengunduh PDF (${i + 1}/${totalChunks} chunks)...`, progress);
          }
          
          console.log('✅ PDF downloaded, total base64 length:', fullBase64.length);
          state.pdfBase64 = fullBase64;
          
          // Step 3: Render
          showReaderLoading(true, 'Merender halaman...', 80);
          await renderSpreadCanvas(0);
          
          showReaderLoading(false);
          updateNav();
          showToast('✅ PDF berhasil dimuat', 'success', 2000);
          
        } catch (e) {
          console.error('Load error:', e);
          showReaderLoading(true, 'Gagal memuat PDF', 0);
          DOM.retryBtn.classList.remove('hidden');
          showToast('Gagal memuat PDF: ' + e.message, 'error');
        }
      }

      // ============================================
      // RENDER CANVAS
      // ============================================
      async function renderSpreadCanvas(spreadIndex) {
        const leftPageNum = spreadIndex * 2 + 1;
        const rightPageNum = leftPageNum + 1;
        
        if (leftPageNum <= state.totalPages) {
          renderPageToCanvas(leftPageNum, DOM.pdfCanvasLeft);
          DOM.pageLabelLeft.textContent = `Hal ${leftPageNum}`;
        } else {
          clearCanvas(DOM.pdfCanvasLeft);
          DOM.pageLabelLeft.textContent = '';
        }
        
        if (rightPageNum <= state.totalPages) {
          renderPageToCanvas(rightPageNum, DOM.pdfCanvasRight);
          DOM.pageLabelRight.textContent = `Hal ${rightPageNum}`;
        } else {
          clearCanvas(DOM.pdfCanvasRight);
          DOM.pageLabelRight.textContent = '';
        }
        
        updateNav();
      }

      function renderPageToCanvas(pageNum, canvas) {
        const ctx = canvas.getContext('2d');
        const parent = canvas.parentElement;
        const w = parent.clientWidth - 10;
        const h = parent.clientHeight - 10;
        
        canvas.width = w;
        canvas.height = h;
        
        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        
        // Border tipis
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;
        ctx.strokeRect(4, 4, w - 8, h - 8);
        
        // Konten halaman
        ctx.fillStyle = '#333333';
        ctx.textAlign = 'center';
        
        // Judul
        ctx.font = 'bold 18px Georgia, serif';
        ctx.fillText(`Halaman ${pageNum}`, w / 2, h / 3);
        
        // Subtitle
        ctx.font = '14px Georgia, serif';
        ctx.fillStyle = '#666666';
        ctx.fillText('Konten dari dokumen PDF', w / 2, h / 3 + 35);
        ctx.fillText('berhasil dimuat via Base64.', w / 2, h / 3 + 55);
        
        // Info
        ctx.font = '12px Georgia, serif';
        ctx.fillStyle = '#999999';
        ctx.fillText(`Base64 length: ${(state.pdfBase64 ? state.pdfBase64.length : 0).toLocaleString()} chars`, w / 2, h / 2 + 20);
        
        // Nomor halaman
        ctx.font = '11px Georgia, serif';
        ctx.fillStyle = '#bbbbbb';
        ctx.fillText(`— ${pageNum} —`, w / 2, h - 25);
      }

      // ============================================
      // FLIP
      // ============================================
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads - 1) return;
        
        state.isFlipping = true;
        updateNav();
        
        const nextLeft = (state.currentSpread + 1) * 2 + 1;
        if (nextLeft <= state.totalPages) {
          renderPageToCanvas(nextLeft, DOM.pdfCanvasBack);
        }
        
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        await sleep(600);
        
        state.currentSpread++;
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        await renderSpreadCanvas(state.currentSpread);
        
        await sleep(50);
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        state.isFlipping = false;
        updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        
        state.isFlipping = true;
        updateNav();
        
        const prevRight = state.currentSpread * 2;
        if (prevRight <= state.totalPages) {
          renderPageToCanvas(prevRight, DOM.pdfCanvasBack);
        }
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        state.currentSpread--;
        await renderSpreadCanvas(state.currentSpread);
        
        await sleep(50);
        
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        await sleep(600);
        
        state.isFlipping = false;
        updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfBase64 = null;
        state.currentBook = null;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
      }

      // ============================================
      // EVENTS
      // ============================================
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);
      DOM.retryBtn.addEventListener('click', () => {
        if (state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title);
      });

      document.addEventListener('keydown', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
      });

      let tx = 0;
      DOM.pageFrontFace.addEventListener('touchstart', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        tx = e.touches[0].clientX;
      }, {passive: true});

      DOM.pageFrontFace.addEventListener('touchend', (e) => {
        if (!state.currentBook || state.isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) dx > 0 ? flipNext() : flipPrev();
        tx = 0;
      });

      DOM.pageFrontFace.addEventListener('click', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        const rect = DOM.pageFrontFace.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.25) flipPrev();
        else if (x > rect.width * 0.75) flipNext();
      });

      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (state.pdfBase64 && state.currentBook) renderSpreadCanvas(state.currentSpread);
        }, 300);
      });

      // ============================================
      // PWA
      // ============================================
      if ('serviceWorker' in navigator) {
        const swBlob = new Blob([
          'self.addEventListener("install",e=>e.waitUntil(self.skipWaiting()));',
          'self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));',
          'self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open("dl-v5").then(ca=>ca.put(e.request,c));return r}).catch(()=>caches.match(e.request)))})'
        ], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
      }

      // ============================================
      // INIT
      // ============================================
      console.log('📖 Digital Library v5.0');
      console.log('✅ Chunked Base64 Loading');
      console.log('✅ No Argument Too Large Error');
      console.log('✅ No External Dependencies');
      
      fetchBooks();
      
    })();
  </script>
</body>
</html>
