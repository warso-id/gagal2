<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#5D3A1A">
  <title>📖 E-Book Digital Flip</title>
  
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkUtQm9vayBEaWdpdGFsIEZsaXAiLAogICJzaG9ydF9uYW1lIjogIkUtQm9vayIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZjVmMGU4IiwKICAidGhlbWVfY29sb3IiOiAiIzVkM2ExYSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5pbWd1ci5jb20vSmt4UllkNi5wbmciLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">

  <style>
    :root {
      --book-cover: #5D3A1A;
      --page-bg: #FFF8F0;
      --text-color: #3E2723;
      --accent: #8B5A2B;
      --shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
      background: linear-gradient(135deg, #e8d5c4 0%, #d4b896 50%, #c9a87c 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ============ LIBRARY VIEW ============ */
    .library-container {
      width: 90%;
      max-width: 1000px;
      padding: 30px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }

    .library-title {
      text-align: center;
      font-size: 2.5rem;
      color: #3E2723;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .library-subtitle {
      text-align: center;
      color: #8B5A2B;
      margin-bottom: 30px;
      font-style: italic;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
    }

    .book-item {
      background: linear-gradient(135deg, #fffdf7, #fef5e7);
      border: 3px solid #d2b48c;
      border-radius: 15px;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(139,90,43,0.15);
    }

    .book-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #8B5A2B, #d2b48c, #8B5A2B);
      transform: scaleX(0);
      transition: transform 0.4s;
    }

    .book-item:hover::before {
      transform: scaleX(1);
    }

    .book-item:hover {
      transform: translateY(-10px) rotate(-1deg);
      box-shadow: 0 20px 40px rgba(139,90,43,0.3);
      border-color: #8B5A2B;
    }

    .book-item:active {
      transform: scale(0.95);
    }

    .book-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .book-item-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #3E2723;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .book-item-link {
      font-size: 0.7rem;
      color: #a0845c;
      word-break: break-all;
      opacity: 0.7;
    }

    /* ============ READER VIEW ============ */
    .reader-container {
      display: none;
      width: 100%;
      max-width: 800px;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px;
    }

    .reader-container.active {
      display: flex;
    }

    .library-container.hidden {
      display: none;
    }

    .reader-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(255,255,255,0.7);
      border-radius: 50px;
      backdrop-filter: blur(10px);
    }

    .back-button {
      background: none;
      border: 2px solid #8B5A2B;
      color: #8B5A2B;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s;
      font-family: 'Georgia', serif;
    }

    .back-button:hover {
      background: #8B5A2B;
      color: white;
    }

    .book-title-display {
      font-weight: 700;
      color: #3E2723;
      font-size: 1.1rem;
      text-align: center;
      flex: 1;
      padding: 0 15px;
    }

    /* ============ FLIP BOOK ============ */
    .flip-book-wrapper {
      width: 100%;
      height: 70vh;
      max-height: 600px;
      perspective: 2500px;
      position: relative;
    }

    .flip-book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .book-page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, #fef9f0 0%, #fffdf7 50%, #fef9f0 100%);
      border-radius: 5px 20px 20px 5px;
      box-shadow: 
        0 5px 20px rgba(0,0,0,0.1),
        inset 0 0 30px rgba(139,90,43,0.03),
        3px 0 10px rgba(0,0,0,0.05);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      overflow: hidden;
    }

    .book-page.flipping {
      transform: rotateY(-180deg);
      z-index: 10;
      box-shadow: 
        -10px 10px 30px rgba(0,0,0,0.3),
        inset 0 0 30px rgba(139,90,43,0.05);
    }

    .book-page.flipped {
      transform: rotateY(-180deg);
      z-index: 1;
    }

    /* Halaman depan (face) */
    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      padding: 40px 35px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: #fffdf7;
    }

    /* Halaman belakang (back) - mirror */
    .page-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      transform: rotateY(180deg);
      padding: 40px 35px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: #fef9f0;
      border-left: 1px solid #e0d0b8;
    }

    /* Lipatan tengah buku */
    .page-crease {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to right, 
        rgba(139,90,43,0.1), 
        rgba(139,90,43,0.3), 
        rgba(139,90,43,0.1));
      z-index: 5;
      pointer-events: none;
    }

    .chapter-badge {
      display: inline-block;
      background: #8B5A2B;
      color: #fff;
      padding: 6px 18px;
      border-radius: 25px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
      width: fit-content;
      font-family: 'Segoe UI', sans-serif;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3E2723;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .page-content-text {
      font-size: 1rem;
      line-height: 1.9;
      color: #5D4037;
      text-align: justify;
      flex: 1;
    }

    .page-illustration-box {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #f5ebe0, #e8d9c8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 15px 0;
      box-shadow: inset 0 3px 10px rgba(139,90,43,0.1);
    }

    .page-number-indicator {
      text-align: center;
      color: #a0845c;
      font-size: 0.8rem;
      margin-top: 15px;
      font-style: italic;
    }

    .logo-watermark {
      position: absolute;
      bottom: 12px;
      right: 15px;
      width: 35px;
      height: 35px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      opacity: 0.4;
      z-index: 2;
    }

    /* Navigasi */
    .navigation-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 25px;
      background: rgba(255,255,255,0.8);
      border-radius: 50px;
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }

    .nav-arrow {
      background: linear-gradient(145deg, #8B5A2B, #6b4320);
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(139,90,43,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-arrow:active {
      transform: scale(0.85);
    }

    .nav-arrow:disabled {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(50%);
    }

    .page-counter-display {
      font-weight: 700;
      color: #3E2723;
      background: rgba(139,90,43,0.08);
      padding: 8px 22px;
      border-radius: 25px;
      font-size: 0.95rem;
      min-width: 90px;
      text-align: center;
    }

    /* Loading */
    .loading-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8B5A2B;
      font-family: 'Georgia', serif;
    }

    .spinner-circle {
      width: 50px;
      height: 50px;
      border: 4px solid #e8d5c0;
      border-top: 4px solid #8B5A2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .book-page {
        border-radius: 3px 12px 12px 3px;
      }
      .page-face, .page-back {
        padding: 25px 18px;
      }
      .page-title {
        font-size: 1.3rem;
      }
      .page-content-text {
        font-size: 0.9rem;
        line-height: 1.7;
      }
      .page-illustration-box {
        height: 90px;
        font-size: 2.2rem;
      }
      .flip-book-wrapper {
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <!-- LIBRARY VIEW -->
  <div class="library-container" id="libraryView">
    <div class="library-title">📚 Perpustakaan Digital</div>
    <div class="library-subtitle">Pilih buku untuk mulai membaca</div>
    <div class="bookshelf" id="bookshelf">
      <div class="loading-view">
        <div class="spinner-circle"></div>
        <span>Memuat koleksi...</span>
      </div>
    </div>
  </div>

  <!-- READER VIEW -->
  <div class="reader-container" id="readerView">
    <div class="reader-header">
      <button class="back-button" id="backToLibrary">← Kembali</button>
      <span class="book-title-display" id="currentBookTitle"></span>
      <div style="width:80px;"></div>
    </div>
    
    <div class="flip-book-wrapper">
      <div class="flip-book" id="flipBook">
        <!-- Halaman kiri (yang sudah dibaca) -->
        <div class="book-page flipped" id="leftPage" style="z-index:1;">
          <div class="page-back" id="leftPageContent">
            <div class="loading-view">
              <div class="spinner-circle"></div>
            </div>
          </div>
          <div class="page-crease"></div>
          <div class="logo-watermark"></div>
        </div>
        
        <!-- Halaman kanan (yang sedang dibaca) -->
        <div class="book-page" id="rightPage" style="z-index:2;">
          <div class="page-face" id="rightPageContent">
            <div class="loading-view">
              <div class="spinner-circle"></div>
              <span>Membuka buku...</span>
            </div>
          </div>
          <div class="page-crease"></div>
          <div class="logo-watermark"></div>
        </div>
      </div>
    </div>

    <div class="navigation-bar">
      <button class="nav-arrow" id="prevBtn">◀</button>
      <span class="page-counter-display" id="pageCounter">1 / 1</span>
      <button class="nav-arrow" id="nextBtn">▶</button>
    </div>
  </div>

  <script>
    (function() {
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      let books = [];
      let currentBook = null;
      let pagesData = [];
      let currentPageIndex = 0;
      let totalPages = 0;
      let isFlipping = false;

      // DOM
      const libraryView = document.getElementById('libraryView');
      const readerView = document.getElementById('readerView');
      const bookshelf = document.getElementById('bookshelf');
      const leftPage = document.getElementById('leftPage');
      const rightPage = document.getElementById('rightPage');
      const leftPageContent = document.getElementById('leftPageContent');
      const rightPageContent = document.getElementById('rightPageContent');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageCounter = document.getElementById('pageCounter');
      const backToLibrary = document.getElementById('backToLibrary');
      const currentBookTitle = document.getElementById('currentBookTitle');
      const flipBook = document.getElementById('flipBook');

      // Fetch daftar buku
      async function fetchBooks() {
        try {
          const response = await fetch(WEBAPP_URL);
          const data = await response.json();
          if (data.success && data.books) {
            books = data.books;
            renderBookshelf();
          } else {
            showError('Tidak ada buku ditemukan');
          }
        } catch (err) {
          showError('Gagal terhubung ke server');
          console.error(err);
        }
      }

      function showError(msg) {
        bookshelf.innerHTML = `<div style="text-align:center;padding:40px;color:#8B5A2B;">📭 ${msg}</div>`;
      }

      function renderBookshelf() {
        const icons = ['📖', '📚', '📕', '📗', '📘', '📙', '🌟', '💡', '🔬', '🌍'];
        bookshelf.innerHTML = books.map(function(book, i) {
          return `
            <div class="book-item" onclick="openBook(${i})">
              <div class="book-icon">${icons[i % icons.length]}</div>
              <div class="book-item-title">${escapeHTML(book.title)}</div>
              <div class="book-item-link">📎 ${escapeHTML(book.url.substring(0, 35))}...</div>
            </div>
          `;
        }).join('');
      }

      // Buka buku
      async function openBook(index) {
        currentBook = books[index];
        currentBookTitle.textContent = currentBook.title;
        pagesData = [];
        currentPageIndex = 0;
        
        libraryView.classList.add('hidden');
        readerView.classList.add('active');
        
        rightPageContent.innerHTML = '<div class="loading-view"><div class="spinner-circle"></div><span>Memuat halaman...</span></div>';
        
        try {
          const response = await fetch(WEBAPP_URL + '?book=' + index);
          const data = await response.json();
          
          if (data.success && data.pages && data.pages.length > 0) {
            pagesData = data.pages;
            totalPages = pagesData.length;
            renderSpread();
          } else {
            // Fallback
            generateFallbackPages();
            renderSpread();
          }
        } catch (err) {
          console.error('Error loading book:', err);
          generateFallbackPages();
          renderSpread();
        }
      }

      function generateFallbackPages() {
        const title = currentBook ? currentBook.title : 'E-Book';
        pagesData = [
          { chapter: 'Pendahuluan', title: title, content: 'Selamat datang di ' + title + '. E-book ini berisi konten edukatif yang menarik.', illustration: '📖', pageNumber: 1 },
          { chapter: 'Bab 1', title: 'Memulai Eksplorasi', content: 'Mari mulai perjalanan pengetahuan ini dengan semangat belajar yang tinggi.', illustration: '🌟', pageNumber: 2 },
          { chapter: 'Bab 2', title: 'Menggali Lebih Dalam', content: 'Semakin dalam kita belajar, semakin luas wawasan yang kita dapatkan.', illustration: '🔍', pageNumber: 3 },
          { chapter: 'Kesimpulan', title: 'Penutup', content: 'Terima kasih telah membaca. Sampai jumpa di buku berikutnya!', illustration: '📚', pageNumber: 4 }
        ];
        totalPages = pagesData.length;
      }

      function renderSpread() {
        // Halaman kiri (sebelumnya)
        if (currentPageIndex > 0) {
          const leftData = pagesData[currentPageIndex - 1];
          leftPageContent.innerHTML = createPageHTML(leftData, 'back');
          leftPage.classList.remove('flipping');
          leftPage.classList.add('flipped');
          leftPage.style.display = 'block';
        } else {
          leftPage.style.display = 'none';
        }

        // Halaman kanan (sedang dibaca)
        const rightData = pagesData[currentPageIndex];
        rightPageContent.innerHTML = createPageHTML(rightData, 'face');
        rightPage.classList.remove('flipping', 'flipped');
        
        updateNavigation();
      }

      function createPageHTML(page, side) {
        const bgColor = side === 'face' ? '#fffdf7' : '#fef9f0';
        return `
          <div style="background:${bgColor};">
            ${page.chapter ? `<div class="chapter-badge">📌 ${escapeHTML(page.chapter)}</div>` : ''}
            <div class="page-title">${escapeHTML(page.title)}</div>
            ${page.illustration ? `<div class="page-illustration-box">${escapeHTML(page.illustration)}</div>` : ''}
            <div class="page-content-text">${escapeHTML(page.content)}</div>
            <div class="page-number-indicator">📄 Halaman ${page.pageNumber || (currentPageIndex + 1)}</div>
          </div>
        `;
      }

      function updateNavigation() {
        pageCounter.textContent = `${currentPageIndex + 1} / ${totalPages}`;
        prevBtn.disabled = currentPageIndex === 0;
        nextBtn.disabled = currentPageIndex >= totalPages - 1;
      }

      // FLIP ANIMATION - Seperti membuka buku sungguhan
      function flipNext() {
        if (isFlipping || currentPageIndex >= totalPages - 1) return;
        isFlipping = true;
        
        // Animasi halaman kanan terlipat ke kiri
        rightPage.classList.add('flipping');
        
        setTimeout(function() {
          // Pindahkan konten kanan ke kiri
          leftPageContent.innerHTML = rightPageContent.innerHTML;
          leftPage.style.display = 'block';
          leftPage.classList.remove('flipping');
          leftPage.classList.add('flipped');
          
          // Reset halaman kanan
          rightPage.classList.remove('flipping');
          rightPage.classList.add('flipped');
          
          // Update index dan render halaman baru
          currentPageIndex++;
          
          if (currentPageIndex < totalPages) {
            const newData = pagesData[currentPageIndex];
            rightPageContent.innerHTML = createPageHTML(newData, 'face');
          }
          
          // Reset transform untuk halaman berikutnya
          setTimeout(function() {
            rightPage.classList.remove('flipped');
            updateNavigation();
            isFlipping = false;
          }, 100);
        }, 500);
      }

      function flipPrev() {
        if (isFlipping || currentPageIndex === 0) return;
        isFlipping = true;
        
        // Animasi balik
        rightPage.classList.add('flipping');
        
        setTimeout(function() {
          // Pindahkan konten kiri ke kanan
          rightPageContent.innerHTML = leftPageContent.innerHTML;
          rightPage.classList.remove('flipping', 'flipped');
          
          // Update index
          currentPageIndex--;
          
          if (currentPageIndex > 0) {
            const prevData = pagesData[currentPageIndex - 1];
            leftPageContent.innerHTML = createPageHTML(prevData, 'back');
            leftPage.classList.add('flipped');
            leftPage.style.display = 'block';
          } else {
            leftPage.style.display = 'none';
          }
          
          updateNavigation();
          isFlipping = false;
        }, 500);
      }

      function goBackToLibrary() {
        readerView.classList.remove('active');
        libraryView.classList.remove('hidden');
        currentBook = null;
        pagesData = [];
        currentPageIndex = 0;
      }

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Event Listeners
      prevBtn.addEventListener('click', flipPrev);
      nextBtn.addEventListener('click', flipNext);
      backToLibrary.addEventListener('click', goBackToLibrary);
      
      // Click pada halaman untuk flip
      rightPage.addEventListener('click', function(e) {
        const rect = rightPage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.3) {
          flipPrev();
        } else if (x > rect.width * 0.7) {
          flipNext();
        }
      });

      // Keyboard
      document.addEventListener('keydown', function(e) {
        if (!currentBook) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); flipNext(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); flipPrev(); }
        if (e.key === 'Escape') { goBackToLibrary(); }
      });

      // Touch swipe
      let touchX = 0;
      document.addEventListener('touchstart', function(e) {
        touchX = e.changedTouches[0].screenX;
      }, {passive: true});
      
      document.addEventListener('touchend', function(e) {
        if (!currentBook || !touchX) return;
        const diff = touchX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) flipNext();
          else flipPrev();
        }
        touchX = 0;
      });

      // Global
      window.openBook = openBook;
