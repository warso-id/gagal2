<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 Digital Library</title>
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --text: #e0d5c5;
      --text-secondary: #8a7a6a; --accent: #c9a87c; --page-color: #fdf8f2;
      --success: #27ae60; --warning: #f39c12; --danger: #e74c3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, system-ui, sans-serif; background: var(--bg);
      width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100; flex-shrink: 0; min-height: 48px;
    }
    .logo { width: 30px; height: 30px; border-radius: 6px; background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat; flex-shrink: 0; }
    .app-title { color: var(--text); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    
    .sync-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      background: var(--success); animation: pulse 2s infinite;
    }
    .sync-dot.syncing { background: var(--warning); animation: spin 0.8s linear infinite; }
    .sync-dot.offline { background: var(--danger); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .sync-text { font-size: 0.6rem; color: var(--text-secondary); white-space: nowrap; }
    .cache-indicator { font-size: 0.55rem; color: var(--success); margin-left: 4px; }
    
    .refresh-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: var(--text); padding: 6px 10px; border-radius: 12px; cursor: pointer; font-size: 0.72rem; margin-left: auto; }
    .refresh-btn:hover { background: rgba(255,255,255,0.12); }
    
    .main-content { flex: 1; position: relative; overflow: hidden; }
    
    .library-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .book-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .book-scroll::-webkit-scrollbar { width: 3px; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
    
    .book-card {
      background: var(--surface); border-radius: 10px; padding: 16px 12px;
      cursor: pointer; transition: all 0.25s; text-align: center; border: 1px solid transparent; position: relative;
    }
    .book-card:hover { border-color: rgba(201,168,124,0.4); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .book-card:active { transform: scale(0.97); }
    .book-card.cached::after {
      content: '💾'; position: absolute; top: 6px; left: 6px; font-size: 0.5rem;
    }
    .book-card .emoji { font-size: 2rem; margin-bottom: 8px; }
    .book-card .title { color: var(--text); font-size: 0.75rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-card .link { color: var(--text-secondary); font-size: 0.5rem; margin-top: 4px; word-break: break-all; font-family: monospace; }
    .book-card .badge { display: inline-block; margin-top: 6px; font-size: 0.5rem; background: rgba(201,168,124,0.2); color: var(--accent); padding: 2px 8px; border-radius: 8px; }
    
    .reader-view { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; transform: translateX(105%); transition: transform 0.4s; z-index: 50; }
    .reader-view.active { transform: translateX(0); }
    
    .reader-topbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(0,0,0,0.9); z-index: 60; flex-shrink: 0; }
    .btn-back { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 0.72rem; font-family: inherit; }
    .btn-back:hover { background: rgba(255,255,255,0.14); }
    .reader-title { flex: 1; color: var(--text); font-size: 0.74rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* SINGLE PAGE VIEW */
    .book-area { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; }
    
    .pdf-zoom-container {
      width: 100%;
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #1a1a1a;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      position: relative;
    }
    
    .pdf-zoom-container::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    .pdf-zoom-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
    }
    
    .pdf-zoom-container::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .pdf-viewport {
      transform-origin: top left;
      transition: transform 0.2s ease;
      padding: 16px;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #pdfCanvasSingle {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #fff;
      display: block;
    }
    
    /* ZOOM CONTROLS */
    .zoom-controls {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      padding: 6px 10px;
      border-radius: 20px;
      z-index: 70;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
    }
    
    .zoom-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: var(--accent);
      transform: scale(1.1);
    }
    
    .zoom-btn:active {
      transform: scale(0.95);
    }
    
    .zoom-level {
      color: var(--text);
      font-size: 0.7rem;
      min-width: 42px;
      text-align: center;
      font-weight: 600;
    }
    
    .download-btn {
      background: rgba(39, 174, 96, 0.2);
      border-color: rgba(39, 174, 96, 0.4);
    }
    
    .download-btn:hover {
      background: rgba(39, 174, 96, 0.3);
      border-color: var(--success);
    }
    
    /* FULLSCREEN */
    .book-area:fullscreen,
    .book-area:-webkit-full-screen,
    .book-area:-moz-full-screen,
    .book-area:-ms-fullscreen {
      background: #000;
    }
    
    .book-area:fullscreen .pdf-zoom-container,
    .book-area:-webkit-full-screen .pdf-zoom-container {
      background: #000;
    }
    
    .book-area:fullscreen .zoom-controls,
    .book-area:-webkit-full-screen .zoom-controls {
      bottom: 16px;
      right: 16px;
    }
    
    /* ============ LOADING OVERLAY - THE JOS ============ */
    .load-overlay { 
      position: absolute; 
      inset: 0; 
      background: rgba(10,10,10,0.98); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 80;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .load-overlay.hidden { display: none; }
    
    /* Spinner Ring Animation */
    .spinner-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    
    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: spinAnim 1.2s linear infinite;
    }
    
    .spinner-ring:nth-child(1) {
      border-top-color: var(--accent);
      animation-duration: 1s;
    }
    
    .spinner-ring:nth-child(2) {
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      border-right-color: var(--success);
      animation-duration: 1.5s;
      animation-direction: reverse;
    }
    
    .spinner-ring:nth-child(3) {
      width: 40%;
      height: 40%;
      top: 30%;
      left: 30%;
      border-bottom-color: var(--warning);
      animation-duration: 2s;
    }
    
    .spinner-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      animation: bounceIcon 1s ease-in-out infinite;
    }
    
    @keyframes spinAnim { 
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes bounceIcon {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
    }
    
    /* Progress Bar */
    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
      margin: 16px 0;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
      animation: progressPulse 2s ease-in-out infinite;
    }
    
    @keyframes progressPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    /* Loading Text */
    .load-title {
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }
    
    .load-text { 
      color: var(--text-secondary); 
      font-size: 0.72rem;
      text-align: center;
      max-width: 250px;
      line-height: 1.4;
    }
    
    .load-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      font-size: 0.65rem;
      color: var(--accent);
    }
    
    .load-status .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    
    /* Download Stats */
    .download-stats {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.6rem;
      color: var(--text-secondary);
    }
    
    .download-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .download-stat .icon {
      font-size: 0.7rem;
    }
    
    /* Retry Button */
    .retry-btn { 
      background: var(--accent); 
      color: #1a1a1a; 
      border: none; 
      padding: 8px 20px; 
      border-radius: 20px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.72rem; 
      margin-top: 16px; 
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .retry-btn:hover {
      background: #d4b88c;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(201,168,124,0.3);
    }
    .retry-btn.hidden { display: none; }
    
    .reader-bottombar { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 16px; background: rgba(0,0,0,0.9); flex-shrink: 0; z-index: 60; }
    .nav-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }
    .page-indicator { color: var(--text); font-size: 0.78rem; font-weight: 600; min-width: 80px; text-align: center; background: rgba(255,255,255,0.04); padding: 5px 12px; border-radius: 12px; }
    
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; font-size: 0.74rem; z-index: 200; display: none; animation: slideDown 0.3s; font-weight: 600; }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #fff; }
    @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    
    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
      .book-card { padding: 12px 8px; }
      .book-card .emoji { font-size: 1.5rem; }
      .book-card .title { font-size: 0.68rem; }
      .reader-topbar { padding: 4px 8px; }
      .reader-bottombar { padding: 6px 10px; gap: 10px; }
      .nav-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .pdf-viewport { padding: 8px; }
      .zoom-controls { bottom: 6px; right: 6px; padding: 4px 8px; gap: 4px; }
      .zoom-btn { width: 28px; height: 28px; font-size: 0.75rem; }
      .spinner-container { width: 60px; height: 60px; }
      .progress-container { width: 160px; }
    }
    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .book-card { padding: 10px 6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="logo"></div>
      <span class="app-title">📖 Digital Library</span>
      <span class="sync-dot" id="syncDot" title="Sync status"></span>
      <span class="sync-text" id="syncText">Live</span>
      <button class="refresh-btn" id="refreshBtn">🔄 Sync</button>
    </div>

    <div class="main-content">
      <div class="library-view" id="libraryView">
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-container">
              <div class="spinner-ring"></div>
              <div class="spinner-ring"></div>
              <div class="spinner-ring"></div>
              <div class="spinner-icon">📚</div>
            </div>
            <div class="load-title">Memuat Perpustakaan</div>
            <div class="load-text">Mengambil data dari Google Spreadsheet...</div>
          </div>
        </div>
      </div>

      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku</div>
        </div>
        
        <div class="book-area">
          <div class="pdf-zoom-container" id="pdfZoomContainer">
            <div class="pdf-viewport" id="pdfViewport">
              <canvas id="pdfCanvasSingle"></canvas>
            </div>
          </div>
          
          <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" id="btnZoomOut" title="Zoom Out">🔍−</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="btnZoomIn" title="Zoom In">🔍+</button>
            <button class="zoom-btn" id="btnZoomReset" title="Reset Zoom">↺</button>
            <button class="zoom-btn" id="btnFullscreen" title="Fullscreen">⛶</button>
            <button class="zoom-btn download-btn" id="btnDownload" title="Download PDF">💾</button>
          </div>
          
          <!-- LOADING OVERLAY - THE JOS -->
          <div class="load-overlay hidden" id="readerLoading">
            <div class="spinner-container">
              <div class="spinner-ring"></div>
              <div class="spinner-ring"></div>
              <div class="spinner-ring"></div>
              <div class="spinner-icon" id="loadingIcon">📖</div>
            </div>
            <div class="load-title" id="loadingTitle">Membuka PDF</div>
            <div class="progress-container">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="load-text" id="readerLoadText">Mempersiapkan dokumen...</div>
            <div class="load-status">
              <span class="dot"></span>
              <span id="loadingStatus">Menghubungi server...</span>
            </div>
            <div class="download-stats" id="downloadStats" style="display:none;">
              <div class="download-stat">
                <span class="icon">📦</span>
                <span id="statSize">0 KB</span>
              </div>
              <div class="download-stat">
                <span class="icon">⚡</span>
                <span id="statSpeed">0 KB/s</span>
              </div>
            </div>
            <button class="retry-btn hidden" id="retryBtn">
              <span>🔄</span> Coba Lagi
            </button>
          </div>
        </div>
        
        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      // ============ CONFIG ============
      var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      var SPREADSHEET_ID = '1HWxBGy3Q40euhy61csEocfbXXNc6bzM1cLjzz8u6Eyg';
      var SHEET_NAME = 'E-Book Library';
      
      // Cache configuration
      var PDF_CACHE_MAX = 5;
      var PDF_CACHE_TTL = 30 * 60 * 1000;
      
      var state = {
        books: [], currentBook: null, pdfDoc: null,
        totalPages: 10, currentPage: 1, isFlipping: false,
        syncTimer: null,
        pdfCache: {},
        zoomLevel: 1.0,
        zoomMin: 0.5,
        zoomMax: 3.0,
        zoomStep: 0.25,
        pdfBase64: null,
        downloadStartTime: 0,
        downloadBytes: 0
      };

      function $(id) { return document.getElementById(id); }
      
      var DOM = {};
      function initDOM() {
        DOM.syncDot = $('syncDot'); DOM.syncText = $('syncText');
        DOM.libLoading = $('libLoading'); DOM.bookScroll = $('bookScroll');
        DOM.refreshBtn = $('refreshBtn'); DOM.readerView = $('readerView');
        DOM.readerLoading = $('readerLoading'); DOM.readerLoadText = $('readerLoadText');
        DOM.loadingTitle = $('loadingTitle');
        DOM.loadingIcon = $('loadingIcon');
        DOM.loadingStatus = $('loadingStatus');
        DOM.progressBar = $('progressBar');
        DOM.downloadStats = $('downloadStats');
        DOM.statSize = $('statSize');
        DOM.statSpeed = $('statSpeed');
        DOM.retryBtn = $('retryBtn');
        DOM.pdfZoomContainer = $('pdfZoomContainer');
        DOM.pdfViewport = $('pdfViewport');
        DOM.pdfCanvasSingle = $('pdfCanvasSingle');
        DOM.zoomControls = $('zoomControls');
        DOM.zoomLevel = $('zoomLevel');
        DOM.btnZoomIn = $('btnZoomIn');
        DOM.btnZoomOut = $('btnZoomOut');
        DOM.btnZoomReset = $('btnZoomReset');
        DOM.btnFullscreen = $('btnFullscreen');
        DOM.btnDownload = $('btnDownload');
        DOM.pageIndicator = $('pageIndicator'); DOM.readerBookTitle = $('readerBookTitle');
        DOM.btnPrev = $('btnPrev'); DOM.btnNext = $('btnNext');
        DOM.btnBack = $('btnBack'); DOM.toast = $('toast');
      }

      function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
      function escHtml(s) { return s ? String(s).replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]; }) : ''; }
      
      function toast(msg, type, dur) {
        if (!DOM.toast) return;
        DOM.toast.textContent = msg; DOM.toast.className = 'toast show ' + (type || 'info');
        clearTimeout(state._tt); state._tt = setTimeout(function() { DOM.toast.classList.remove('show'); }, dur || 2500);
      }

      function setSyncStatus(status, text) {
        if (DOM.syncDot) DOM.syncDot.className = 'sync-dot ' + status;
        if (DOM.syncText) DOM.syncText.textContent = text || 'Live';
      }

      function showLibLoading(s) { if (DOM.libLoading) DOM.libLoading.classList.toggle('hidden', !s); }
      
      // ============ LOADING VIEW - THE JOS ============
      function updateLoadingState(stage, title, icon, text, status, progress) {
        if (DOM.loadingTitle) DOM.loadingTitle.textContent = title || 'Memproses';
        if (DOM.loadingIcon) DOM.loadingIcon.textContent = icon || '📖';
        if (DOM.readerLoadText) DOM.readerLoadText.textContent = text || '';
        if (DOM.loadingStatus) DOM.loadingStatus.textContent = status || '';
        if (DOM.progressBar) DOM.progressBar.style.width = (progress || 0) + '%';
      }

      function showReaderLoading(s, options) {
        if (!DOM.readerLoading) return;
        
        if (s) {
          DOM.readerLoading.classList.remove('hidden');
          DOM.retryBtn.classList.add('hidden');
          DOM.downloadStats.style.display = 'none';
          
          var opts = options || {};
          updateLoadingState(
            opts.stage || 'connecting',
            opts.title || 'Membuka PDF',
            opts.icon || '📖',
            opts.text || 'Mempersiapkan...',
            opts.status || 'Menghubungi server...',
            opts.progress || 0
          );
        } else {
          DOM.readerLoading.classList.add('hidden');
        }
      }

      function updateDownloadProgress(downloadedBytes, totalBytes) {
        if (!DOM.downloadStats) return;
        
        DOM.downloadStats.style.display = 'flex';
        
        var downloadedMB = (downloadedBytes / (1024 * 1024)).toFixed(2);
        var totalMB = totalBytes ? (totalBytes / (1024 * 1024)).toFixed(2) : '?';
        
        if (DOM.statSize) DOM.statSize.textContent = downloadedMB + ' / ' + totalMB + ' MB';
        
        if (state.downloadStartTime) {
          var elapsed = (Date.now() - state.downloadStartTime) / 1000;
          if (elapsed > 0) {
            var speed = (downloadedBytes / (1024 * elapsed)).toFixed(1);
            if (DOM.statSpeed) DOM.statSpeed.textContent = speed + ' KB/s';
          }
        }
        
        if (totalBytes && DOM.progressBar) {
          var pct = Math.round((downloadedBytes / totalBytes) * 100);
          DOM.progressBar.style.width = pct + '%';
        }
      }

      function updateNav() {
        if (DOM.btnPrev) DOM.btnPrev.disabled = state.currentPage <= 1 || state.isFlipping;
        if (DOM.btnNext) DOM.btnNext.disabled = state.currentPage >= state.totalPages || state.isFlipping;
        if (DOM.pageIndicator) {
          DOM.pageIndicator.textContent = state.currentPage + ' / ' + state.totalPages;
        }
      }

      function clearCanvas(c) { if (c) { c.width = 1; c.height = 1; c.getContext('2d').clearRect(0, 0, 1, 1); } }

      function extractFileId(url) {
        if (!url) return '';
        var patterns = [/\/d\/([a-zA-Z0-9_-]+)/, /[?&]id=([a-zA-Z0-9_-]+)/, /\/file\/d\/([a-zA-Z0-9_-]+)/];
        for (var i = 0; i < patterns.length; i++) {
          var match = String(url).match(patterns[i]);
          if (match && match[1]) return match[1];
        }
        return String(url);
      }

      // ============ PDF CACHE MANAGEMENT ============
      function getCachedPDF(fileId) {
        var cached = state.pdfCache[fileId];
        if (cached && (Date.now() - cached.timestamp) < PDF_CACHE_TTL) {
          console.log('💾 Cache hit for:', fileId);
          return cached;
        }
        return null;
      }

      function setCachedPDF(fileId, base64, pdfDoc) {
        var keys = Object.keys(state.pdfCache);
        if (keys.length >= PDF_CACHE_MAX) {
          var oldest = keys.reduce(function(a, b) {
            return state.pdfCache[a].timestamp < state.pdfCache[b].timestamp ? a : b;
          });
          delete state.pdfCache[oldest];
          console.log('🗑️ Cache evicted:', oldest);
        }
        
        state.pdfCache[fileId] = {
          base64: base64,
          pdfDoc: pdfDoc,
          timestamp: Date.now()
        };
        console.log('💾 Cached PDF:', fileId, 'Total cached:', Object.keys(state.pdfCache).length);
      }

      // ============ FETCH BOOKS ============
      async function fetchBooks(silent) {
        if (!silent) { showLibLoading(true); setSyncStatus('syncing', 'Syncing...'); }
        
        try {
          var res = await fetch(WEBAPP_URL + '?_=' + Date.now());
          var data = await res.json();
          
          if (data.success && data.books && data.books.length > 0) {
            state.books = data.books.map(function(b) {
              return {
                title: b.title || 'PDF Document',
                url: b.url || '',
                fileId: b.fileId || extractFileId(b.url),
                academicYear: b.academicYear || '2024/2025',
                category: b.category || 'PDF',
                author: b.author || '',
                rowNumber: b.rowNumber || 0
              };
            });
            renderBooks();
            setSyncStatus('', 'Live');
          } else {
            state.books = [];
            renderBooks();
            setSyncStatus('', 'Live');
          }
        } catch (e) {
          if (!silent) setSyncStatus('offline', 'Offline');
        }
        
        if (!silent) showLibLoading(false);
      }

      function renderBooks() {
        if (!DOM.bookScroll) return;
        if (!state.books.length) {
          DOM.bookScroll.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-secondary);"><div style="font-size:3rem;">📭</div><div>Belum ada buku di B2:B</div><div style="font-size:0.7rem;">Tambahkan link PDF di kolom B</div></div>';
          return;
        }
        
        var icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        var html = '<div class="book-grid">';
        state.books.forEach(function(b, i) {
          var fileId = b.fileId || extractFileId(b.url);
          var isCached = !!state.pdfCache[fileId];
          html += '<div class="book-card' + (isCached ? ' cached' : '') + '" data-fileid="' + escHtml(fileId) + '" data-title="' + escHtml(b.title) + '" data-url="' + escHtml(b.url) + '">';
          html += '<div class="emoji">' + icons[i % 10] + '</div>';
          html += '<div class="title">' + escHtml(b.title) + '</div>';
          if (b.author && b.author !== 'Unknown Author') {
            html += '<div style="font-size:0.55rem;color:var(--accent);">✍️ ' + escHtml(b.author) + '</div>';
          }
          html += '<div class="link">📎 B' + (b.rowNumber || (i+2)) + '</div>';
          html += '<div class="badge">' + escHtml(b.category || 'PDF') + '</div>';
          html += '</div>';
        });
        html += '</div>';
        DOM.bookScroll.innerHTML = html;
        
        DOM.bookScroll.querySelectorAll('.book-card').forEach(function(card) {
          card.addEventListener('click', function() {
            var fid = this.getAttribute('data-fileid');
            var title = this.getAttribute('data-title');
            var url = this.getAttribute('data-url');
            openBook(fid, title, url);
          });
        });
      }

      // ============ OPEN BOOK (WITH CACHE) ============
      async function openBook(fileId, title, url) {
        console.log('📖 Opening:', title, fileId);
        state.currentBook = { fileId: fileId, title: title, url: url };
        state.pdfDoc = null;
        state.totalPages = 10;
        state.currentPage = 1;
        state.isFlipping = false;
        state.pdfBase64 = null;
        state.downloadStartTime = 0;
        state.downloadBytes = 0;

        if (DOM.readerBookTitle) DOM.readerBookTitle.textContent = title;
        if (DOM.readerView) DOM.readerView.classList.add('active');
        clearCanvas(DOM.pdfCanvasSingle);
        updateNav();
        updateZoom(1.0, false);

        // CHECK CACHE FIRST
        var cached = getCachedPDF(fileId);
        if (cached) {
          console.log('⚡ Using cached PDF!');
          
          showReaderLoading(true, {
            stage: 'cache',
            title: 'Memuat dari Cache',
            icon: '💾',
            text: 'Mengambil PDF dari penyimpanan lokal...',
            status: 'Cache ditemukan!',
            progress: 80
          });
          
          await sleep(300);
          
          updateLoadingState('rendering', 'Merender Halaman', '🎨', 'Menyiapkan tampilan PDF...', 'Cache loaded', 90);
          
          if (cached.pdfDoc) {
            state.pdfDoc = cached.pdfDoc;
            state.totalPages = cached.pages || state.pdfDoc.numPages || 10;
            state.pdfBase64 = cached.base64;
            
            await sleep(200);
            updateLoadingState('done', 'Selesai!', '✅', 'PDF siap dibaca', 'Loaded from cache', 100);
            await sleep(300);
            
            await renderSinglePage(1);
            showReaderLoading(false);
            updateNav();
            toast('⚡ Loaded from cache!', 'success', 2000);
            return;
          }
        }

        // DOWNLOAD PDF WITH PROGRESS
        showReaderLoading(true, {
          stage: 'connecting',
          title: 'Menghubungi Server',
          icon: '🌐',
          text: 'Membuka koneksi ke Google Drive...',
          status: 'Connecting...',
          progress: 5
        });
        
        await sleep(400);
        
        try {
          var fullBase64 = '';
          var chunkIndex = 0;
          var totalChunks = 1;
          state.downloadStartTime = Date.now();
          
          updateLoadingState('downloading', 'Mengunduh PDF', '📥', 'Mengambil data dari server...', 'Download dimulai', 10);
          
          while (chunkIndex < 200) {
            var chunkUrl = WEBAPP_URL + '?action=getPDFChunk&fileId=' + fileId + '&chunk=' + chunkIndex;
            
            try {
              var chunkRes = await fetch(chunkUrl);
              var chunkData = await chunkRes.json();
              
              if (!chunkData.success) break;
              
              fullBase64 += chunkData.data;
              totalChunks = chunkData.totalChunks || 1;
              state.downloadBytes = fullBase64.length * 0.75;
              
              var progress = 10 + Math.round((chunkIndex + 1) / totalChunks * 60);
              var chunkStatus = 'Mengunduh bagian ' + (chunkIndex + 1) + ' dari ' + totalChunks;
              
              updateLoadingState('downloading', 'Mengunduh PDF', '📥', chunkStatus, 'Download berlangsung...', progress);
              updateDownloadProgress(state.downloadBytes, chunkData.totalSize);
              
              if (chunkIndex >= totalChunks - 1) break;
              chunkIndex++;
              
            } catch (e) { 
              console.error('Chunk error:', e);
              break; 
            }
          }

          if (!fullBase64) throw new Error('Gagal download PDF');
          console.log('✅ Downloaded:', fullBase64.length);
          
          state.pdfBase64 = fullBase64;
          
          // PROCESSING
          updateLoadingState('processing', 'Memproses PDF', '⚙️', 'Mengkonversi data...', 'Processing...', 75);
          await sleep(300);
          
          updateLoadingState('decoding', 'Mendekode PDF', '🔓', 'Membaca struktur dokumen...', 'Decoding...', 80);
          await sleep(200);
          
          // RENDER PDF
          updateLoadingState('rendering', 'Merender PDF', '🎨', 'Menyiapkan halaman pertama...', 'Rendering...', 85);
          
          var binaryStr = atob(fullBase64);
          var bytes = new Uint8Array(binaryStr.length);
          for (var j = 0; j < binaryStr.length; j++) bytes[j] = binaryStr.charCodeAt(j);

          if (typeof pdfjsLib === 'undefined') {
            updateLoadingState('loading-lib', 'Memuat Library', '📚', 'Mengunduh PDF.js...', 'Loading library...', 88);
            await loadPDFJS();
          }

          if (typeof pdfjsLib !== 'undefined') {
            updateLoadingState('parsing', 'Menganalisa PDF', '🔍', 'Membaca jumlah halaman...', 'Parsing document...', 90);
            
            var loadingTask = pdfjsLib.getDocument({ data: bytes, disableAutoFetch: true, disableStream: true });
            state.pdfDoc = await loadingTask.promise;
            state.totalPages = state.pdfDoc.numPages;
            
            setCachedPDF(fileId, fullBase64, state.pdfDoc);
            state.pdfCache[fileId].pages = state.totalPages;
            
            updateLoadingState('finalizing', 'Menyelesaikan', '✨', 'Hampir siap...', 'Finalizing...', 95);
            await sleep(200);
            
            updateLoadingState('done', 'Selesai!', '✅', state.totalPages + ' halaman siap dibaca', 'Document ready', 100);
            await sleep(300);
            
            await renderSinglePage(1);
            showReaderLoading(false);
            updateNav();
            toast('✅ ' + state.totalPages + ' halaman', 'success', 2000);
          } else {
            updateLoadingState('fallback', 'Mode Preview', '⚠️', 'PDF.js tidak tersedia', 'Fallback mode', 100);
            await sleep(500);
            renderFallbackPage(1);
            showReaderLoading(false);
            updateNav();
            toast('⚠️ Preview mode', 'error', 3000);
          }

        } catch (e) {
          console.error('Error:', e);
          updateLoadingState('error', 'Gagal Memuat', '❌', e.message, 'Terjadi kesalahan', 0);
          
          if (DOM.retryBtn) DOM.retryBtn.classList.remove('hidden');
          if (DOM.progressBar) DOM.progressBar.style.width = '0%';
          
          toast('❌ ' + e.message, 'error', 5000);
          renderFallbackPage(1);
          updateNav();
        }
      }

      // ============ PDF.JS LOADER (SILENT) ============
      function loadPDFJS() {
        return new Promise(function(resolve) {
          if (typeof pdfjsLib !== 'undefined') {
            try {
              pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            } catch(e) {}
            resolve(); return;
          }
          
          var script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          script.async = true;
          script.onload = function() {
            if (typeof pdfjsLib !== 'undefined') {
              try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch(e) {}
              console.log('✅ PDF.js ready');
            }
            resolve();
          };
          script.onerror = function() {
            console.warn('⚠️ PDF.js unavailable');
            resolve();
          };
          document.head.appendChild(script);
        });
      }

      // ============ RENDER FUNCTIONS ============
      async function renderSinglePage(pageNum) {
        if (!state.currentBook || !pageNum) return;
        
        if (state.pdfDoc && pageNum <= state.totalPages) {
          await renderPDFPage(pageNum, DOM.pdfCanvasSingle);
        } else if (pageNum <= state.totalPages) {
          renderFallbackPage(pageNum);
        } else {
          clearCanvas(DOM.pdfCanvasSingle);
        }
        
        updateNav();
        
        setTimeout(function() {
          if (state.zoomLevel === 1.0) {
            zoomFitToWidth();
          }
        }, 100);
      }

      async function renderPDFPage(num, canvas) {
        if (!state.pdfDoc || !canvas || num > state.totalPages) return;
        
        try {
          var page = await state.pdfDoc.getPage(num);
          
          var baseScale = 1.5;
          var zoomScale = state.zoomLevel || 1.0;
          var scale = baseScale * zoomScale;
          
          var vp = page.getViewport({ scale: scale });
          
          canvas.height = vp.height;
          canvas.width = vp.width;
          canvas.style.width = vp.width + 'px';
          canvas.style.height = vp.height + 'px';
          
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          await page.render({
            canvasContext: ctx,
            viewport: vp,
            background: '#fff'
          }).promise;
          
        } catch (e) {
          console.error('Render error:', e);
          renderFallbackPage(num);
        }
      }

      function renderFallbackPage(num) {
        if (!DOM.pdfCanvasSingle) return;
        var canvas = DOM.pdfCanvasSingle;
        var ctx = canvas.getContext('2d');
        var w = canvas.parentElement.clientWidth - 10 || 600;
        var h = canvas.parentElement.clientHeight - 10 || 800;
        canvas.width = w; canvas.height = h;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#333'; ctx.textAlign = 'center';
        ctx.font = 'bold 16px Georgia'; ctx.fillText('Halaman ' + num, w/2, h/3);
        ctx.font = '12px Georgia'; ctx.fillStyle = '#666';
        ctx.fillText(state.currentBook ? state.currentBook.title : 'PDF B2:B', w/2, h/3+28);
        ctx.font = 'italic 9px Georgia'; ctx.fillText('— ' + num + ' —', w/2, h-18);
      }

      // ============ ZOOM FUNCTIONS ============
      function updateZoom(newZoom, animate) {
        if (animate === undefined) animate = true;
        
        state.zoomLevel = Math.max(state.zoomMin, Math.min(state.zoomMax, newZoom));
        
        if (DOM.pdfViewport) {
          DOM.pdfViewport.style.transform = 'scale(' + state.zoomLevel + ')';
        }
        
        if (DOM.zoomLevel) {
          DOM.zoomLevel.textContent = Math.round(state.zoomLevel * 100) + '%';
        }
        
        if (state.currentBook && state.pdfDoc) {
          renderSinglePage(state.currentPage);
        }
        
        try {
          localStorage.setItem('pdf-zoom-level', state.zoomLevel);
        } catch(e) {}
      }

      function zoomIn() {
        updateZoom(state.zoomLevel + state.zoomStep);
        toast('🔍 ' + Math.round(state.zoomLevel * 100) + '%', 'info', 1500);
      }

      function zoomOut() {
        updateZoom(state.zoomLevel - state.zoomStep);
        toast('🔍 ' + Math.round(state.zoomLevel * 100) + '%', 'info', 1500);
      }

      function zoomReset() {
        updateZoom(1.0);
        toast('↺ Zoom Reset', 'success', 1500);
      }

      function zoomFitToWidth() {
        if (!DOM.pdfZoomContainer || !DOM.pdfCanvasSingle) return;
        
        var containerWidth = DOM.pdfZoomContainer.clientWidth - 32;
        var canvasWidth = DOM.pdfCanvasSingle.width || 600;
        
        if (canvasWidth > 0) {
          var fitZoom = containerWidth / canvasWidth;
          updateZoom(Math.min(fitZoom, state.zoomMax));
        }
      }

      // ============ FULLSCREEN ============
      function toggleFullscreen() {
        var elem = document.querySelector('.book-area');
        
        if (!document.fullscreenElement && 
            !document.webkitFullscreenElement && 
            !document.mozFullScreenElement && 
            !document.msFullscreenElement) {
          if (elem.requestFullscreen) {
            elem.requestFullscreen();
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          } else if (elem.mozRequestFullScreen) {
            elem.mozRequestFullScreen();
          } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
          }
          toast('📺 Fullscreen', 'success', 1500);
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      }

      function updateFullscreenButton() {
        var isFullscreen = !!(document.fullscreenElement || 
                               document.webkitFullscreenElement || 
                               document.mozFullScreenElement || 
                               document.msFullscreenElement);
        
        if (DOM.btnFullscreen) {
          DOM.btnFullscreen.innerHTML = isFullscreen ? '⛶' : '⛶';
          DOM.btnFullscreen.title = isFullscreen ? 'Exit Fullscreen' : 'Fullscreen';
        }
      }

      // ============ DOWNLOAD PDF ============
      function downloadPDF() {
        if (!state.currentBook) {
          toast('❌ Tidak ada buku yang dibuka', 'error');
          return;
        }
        
        var fileId = state.currentBook.fileId;
        
        if (state.pdfBase64) {
          triggerDownload(state.pdfBase64, state.currentBook.title);
          toast('💾 Download PDF', 'success', 2000);
          return;
        }
        
        var cached = getCachedPDF(fileId);
        if (cached && cached.base64) {
          triggerDownload(cached.base64, state.currentBook.title);
          toast('💾 Download dari cache', 'success', 2000);
          return;
        }
        
        toast('📥 Mendownload PDF...', 'info', 3000);
        
        fetch(WEBAPP_URL + '?action=getFullPDF&fileId=' + fileId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.success && data.base64) {
              triggerDownload(data.base64, state.currentBook.title);
              toast('✅ Download selesai!', 'success', 2000);
            } else {
              throw new Error('Gagal download');
            }
          })
          .catch(function(err) {
            toast('❌ Gagal download PDF', 'error', 3000);
          });
      }

      function triggerDownload(base64, filename) {
        var byteChars = atob(base64);
        var byteNums = new Array(byteChars.length);
        for (var i = 0; i < byteChars.length; i++) {
          byteNums[i] = byteChars.charCodeAt(i);
        }
        var byteArr = new Uint8Array(byteNums);
        var blob = new Blob([byteArr], { type: 'application/pdf' });
        
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = (filename || 'document') + '.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        console.log('💾 Downloaded:', filename);
      }

      // ============ NAVIGATION ============
      async function flipNext() {
        if (state.isFlipping || state.currentPage >= state.totalPages) return;
        state.isFlipping = true;
        state.currentPage++;
        await renderSinglePage(state.currentPage);
        
        setTimeout(function() {
          if (state.zoomLevel === 1.0) zoomFitToWidth();
        }, 150);
        
        state.isFlipping = false;
        updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentPage <= 1) return;
        state.isFlipping = true;
        state.currentPage--;
        await renderSinglePage(state.currentPage);
        
        setTimeout(function() {
          if (state.zoomLevel === 1.0) zoomFitToWidth();
        }, 150);
        
        state.isFlipping = false;
        updateNav();
      }

      function goBack() {
        if (DOM.readerView) DOM.readerView.classList.remove('active');
        state.pdfDoc = null; state.currentBook = null;
        state.pdfBase64 = null;
      }

      function loadZoomPreference() {
        try {
          var saved = localStorage.getItem('pdf-zoom-level');
          if (saved) {
            state.zoomLevel = parseFloat(saved) || 1.0;
          }
        } catch(e) {}
      }

      // ============ EVENTS ============
      function safeOn(el, ev, fn) { if (el) el.addEventListener(ev, fn); }

      initDOM();
      loadZoomPreference();
      
      safeOn(DOM.btnPrev, 'click', flipPrev);
      safeOn(DOM.btnNext, 'click', flipNext);
      safeOn(DOM.btnBack, 'click', goBack);
      safeOn(DOM.btnZoomIn, 'click', zoomIn);
      safeOn(DOM.btnZoomOut, 'click', zoomOut);
      safeOn(DOM.btnZoomReset, 'click', zoomReset);
      safeOn(DOM.btnFullscreen, 'click', toggleFullscreen);
      safeOn(DOM.btnDownload, 'click', downloadPDF);
      
      safeOn(DOM.retryBtn, 'click', function() {
        if (state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title, state.currentBook.url);
      });
      
      safeOn(DOM.refreshBtn, 'click', function() { fetchBooks(false); });

      document.addEventListener('keydown', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { 
          e.preventDefault(); flipNext(); 
        }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { 
          e.preventDefault(); flipPrev(); 
        }
        else if (e.key === 'Escape') { 
          goBack(); 
        }
        else if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
          e.preventDefault(); zoomIn();
        }
        else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
          e.preventDefault(); zoomOut();
        }
        else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
          e.preventDefault(); zoomReset();
        }
        else if (e.key === 'f' && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault(); toggleFullscreen();
        }
      });

      if (DOM.pdfZoomContainer) {
        DOM.pdfZoomContainer.addEventListener('wheel', function(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            if (e.deltaY < 0) {
              zoomIn();
            } else {
              zoomOut();
            }
          }
        }, { passive: false });
      }

      if (DOM.pdfZoomContainer) {
        var initialDistance = 0;
        var initialZoom = 1;
        
        DOM.pdfZoomContainer.addEventListener('touchstart', function(e) {
          if (e.touches.length === 2) {
            initialDistance = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            initialZoom = state.zoomLevel;
          }
        });
        
        DOM.pdfZoomContainer.addEventListener('touchmove', function(e) {
          if (e.touches.length === 2) {
            e.preventDefault();
            var currentDistance = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            var scale = currentDistance / initialDistance;
            var newZoom = initialZoom * scale;
            updateZoom(newZoom, false);
          }
        }, { passive: false });
      }

      if (DOM.pdfZoomContainer) {
        DOM.pdfZoomContainer.addEventListener('dblclick', function(e) {
          if (state.zoomLevel !== 1.0) {
            zoomReset();
          } else {
            updateZoom(2.0);
          }
        });
      }

      if (DOM.pdfZoomContainer) {
        DOM.pdfZoomContainer.addEventListener('click', function(e) {
          if (!state.currentBook || state.isFlipping) return;
          var rect = DOM.pdfZoomContainer.getBoundingClientRect();
          var x = e.clientX - rect.left;
          if (x < rect.width * 0.25) flipPrev();
          else if (x > rect.width * 0.75) flipNext();
        });
      }

      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
      document.addEventListener('mozfullscreenchange', updateFullscreenButton);
      document.addEventListener('MSFullscreenChange', updateFullscreenButton);

      window.addEventListener('resize', function() {
        clearTimeout(state._rt);
        state._rt = setTimeout(function() {
          if (state.currentBook && state.pdfDoc) renderSinglePage(state.currentPage);
        }, 300);
      });

      window.addEventListener('online', function() { setSyncStatus('', 'Live'); fetchBooks(true); });
      window.addEventListener('offline', function() { setSyncStatus('offline', 'Offline'); });

      if ('serviceWorker' in navigator) {
        var swCode = 'self.addEventListener("install",function(e){e.waitUntil(self.skipWaiting())});self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).then(function(r){var c=r.clone();caches.open("dl-v20").then(function(ca){ca.put(e.request,c)});return r}).catch(function(){return caches.match(e.request)}))});';
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))).catch(function(){});
      }

      console.log('📖 Digital Library - The Jos Edition');
      console.log('✅ Beautiful loading animation');
      console.log('✅ Download progress tracking');
      console.log('✅ Multi-stage loading status');
      console.log('✅ Cache enabled (max ' + PDF_CACHE_MAX + ' PDFs)');
      
      fetchBooks(false);
      state.syncTimer = setInterval(function() { if (!state.currentBook) fetchBooks(true); }, 10000);

    })();
  </script>
</body>
</html>
