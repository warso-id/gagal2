<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digital Library">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Digital Library - E-Book Flip Reader">
  <title>📖 Digital Library</title>
  
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <!-- PWA Manifest -->
  <script>
    var manifestData = {
      name: 'Digital Library',
      short_name: 'Digital Lib',
      start_url: location.href,
      display: 'standalone',
      background_color: '#0a0a0a',
      theme_color: '#0a0a0a',
      icons: [{
        src: 'https://i.imgur.com/JkxRYd6.png',
        sizes: '192x192',
        type: 'image/png'
      }]
    };
    var blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e0d5c5;
      --text-secondary: #8a7a6a;
      --accent: #c9a87c;
      --page-color: #fdf8f2;
      --success: #27ae60;
      --warning: #f39c12;
      --danger: #e74c3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    .offline-banner {
      display: none; background: var(--warning); color: #1a1a1a;
      text-align: center; padding: 3px; font-size: 0.62rem; font-weight: 600; flex-shrink: 0;
    }
    .offline-banner.show { display: block; }

    .app-header {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100; flex-shrink: 0; min-height: 46px;
    }

    .logo {
      width: 30px; height: 30px; border-radius: 6px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat; flex-shrink: 0;
    }
    .app-title { color: var(--text); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }

    .sync-container { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .sync-indicator {
      display: flex; align-items: center; gap: 5px; font-size: 0.6rem;
      padding: 3px 10px; border-radius: 12px; white-space: nowrap;
      cursor: pointer; border: 1px solid transparent;
    }
    .sync-dot { width: 5px; height: 5px; border-radius: 50%; }

    .sync-indicator.live { background: rgba(39,174,96,0.12); border-color: rgba(39,174,96,0.25); color: var(--success); }
    .sync-indicator.live .sync-dot { background: var(--success); animation: livePulse 2s infinite; }
    .sync-indicator.updating { background: rgba(241,196,15,0.12); border-color: rgba(241,196,15,0.25); color: var(--warning); }
    .sync-indicator.updating .sync-dot { background: var(--warning); animation: spin 0.8s linear infinite; }
    .sync-indicator.offline { background: rgba(231,76,60,0.12); border-color: rgba(231,76,60,0.25); color: var(--danger); }
    .sync-indicator.offline .sync-dot { background: var(--danger); }

    @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sync-time { font-size: 0.55rem; color: var(--text-secondary); white-space: nowrap; }

    .search-wrapper { flex: 1; position: relative; max-width: 320px; margin: 0 8px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; pointer-events: none; z-index: 1; color: var(--text-secondary); }
    .search-input {
      width: 100%; padding: 6px 12px 6px 32px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      color: var(--text); font-size: 0.75rem; outline: none; font-family: inherit;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-secondary); }

    .header-actions { display: flex; gap: 4px; flex-shrink: 0; overflow-x: auto; }
    .header-actions::-webkit-scrollbar { height: 0; }

    .year-pill {
      padding: 4px 8px; border-radius: 12px; background: rgba(201,168,124,0.1);
      color: var(--accent); font-size: 0.65rem; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(201,168,124,0.2); white-space: nowrap; font-family: inherit;
    }
    .year-pill:hover { background: rgba(201,168,124,0.2); }
    .year-pill.active { background: var(--accent); color: #1a1a1a; }

    .refresh-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); padding: 4px 8px; border-radius: 10px;
      cursor: pointer; font-size: 0.7rem; font-family: inherit;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.12); }

    .main-content { flex: 1; position: relative; overflow: hidden; }

    .library-view {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      transition: all 0.3s;
    }
    .library-view.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; }

    .filter-row {
      display: flex; gap: 4px; padding: 6px 12px; overflow-x: auto; flex-shrink: 0;
    }
    .filter-row::-webkit-scrollbar { height: 0; }

    .filter-chip {
      padding: 4px 10px; border-radius: 14px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05); color: var(--text-secondary);
      font-size: 0.65rem; white-space: nowrap; cursor: pointer; font-family: inherit;
    }
    .filter-chip:hover { background: rgba(255,255,255,0.08); }
    .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }

    .book-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .book-scroll::-webkit-scrollbar { width: 3px; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    .year-group { margin-bottom: 14px; }

    .year-group-header {
      color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;
      padding: 8px 2px 4px; text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.03); margin-bottom: 6px;
      display: flex; justify-content: space-between; position: sticky; top: 0;
      background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); z-index: 5;
    }
    .year-group-header .book-count { font-size: 0.6rem; color: var(--text-secondary); font-weight: 400; }

    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }

    .book-card {
      background: var(--surface); border-radius: 10px; padding: 12px 10px;
      cursor: pointer; transition: all 0.25s; text-align: center;
      border: 1px solid transparent; position: relative;
    }
    .book-card:hover { border-color: rgba(201,168,124,0.3); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .book-card:active { transform: scale(0.97); }
    .book-card .card-emoji { font-size: 1.6rem; margin-bottom: 6px; }
    .book-card .card-title {
      color: var(--text); font-size: 0.7rem; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-card .card-url {
      color: var(--text-secondary); font-size: 0.55rem; margin-top: 2px;
      word-break: break-all; font-family: monospace;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-card .card-badge {
      position: absolute; top: 6px; right: 6px; font-size: 0.5rem;
      background: rgba(201,168,124,0.2); color: var(--accent);
      padding: 2px 6px; border-radius: 8px;
    }

    .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }

    .reader-view {
      position: absolute; inset: 0; background: #000; display: flex;
      flex-direction: column; transform: translateX(105%); transition: transform 0.4s; z-index: 50;
    }
    .reader-view.active { transform: translateX(0); }

    .reader-topbar {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      background: rgba(0,0,0,0.9); z-index: 60; flex-shrink: 0; min-height: 42px;
    }

    .btn-back {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); padding: 5px 12px; border-radius: 14px;
      cursor: pointer; font-size: 0.72rem; font-family: inherit;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-back:hover { background: rgba(255,255,255,0.14); }

    .reader-title {
      flex: 1; color: var(--text); font-size: 0.74rem; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .reader-logo-sm {
      width: 24px; height: 24px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      border-radius: 5px; flex-shrink: 0;
    }

    .book-area {
      flex: 1; position: relative; display: flex; align-items: center;
      justify-content: center; perspective: 2000px; overflow: hidden; background: #0a0a0a;
    }

    .book-spread { width: 100%; height: 100%; display: flex; position: relative; }

    .page-left-wrap { width: 50%; height: 100%; position: relative; }
    .page-left-inner {
      position: absolute; inset: 0; background: var(--page-color);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pdf-area-left {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 6px; overflow: hidden;
    }
    .pdf-canvas-left { max-width: 100%; max-height: 100%; background: #fff; }

    .page-right-wrap { width: 50%; height: 100%; position: relative; perspective: 1500px; }

    .page-flip {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10; transform-origin: left center;
    }

    .page-back-face {
      position: absolute; inset: 0; background: #e8dcc8;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      transform: rotateY(180deg); display: flex;
      align-items: center; justify-content: center; padding: 6px;
    }

    .page-front-face {
      position: absolute; inset: 0; background: var(--page-color);
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .pdf-area-right {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 6px; overflow: hidden;
    }
    .pdf-canvas-right, .pdf-canvas-back { max-width: 100%; max-height: 100%; background: #fff; }

    .page-label { text-align: center; padding: 3px; font-size: 0.55rem; color: #aaa; flex-shrink: 0; }

    .spine-line {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
      background: rgba(0,0,0,0.12); transform: translateX(-50%); z-index: 30; pointer-events: none;
    }

    .load-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.94);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 80; transition: opacity 0.3s;
    }
    .load-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.08);
      border-top: 3px solid var(--accent); border-radius: 50%;
      animation: spinRing 0.7s linear infinite;
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }

    .load-text { color: var(--text-secondary); margin-top: 10px; font-size: 0.72rem; }
    .load-progress {
      width: 200px; height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 2px; margin-top: 10px; overflow: hidden;
    }
    .load-progress-bar {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.3s; width: 0%;
    }

    .retry-btn {
      background: var(--accent); color: #1a1a1a; border: none;
      padding: 7px 18px; border-radius: 18px; cursor: pointer;
      font-weight: 600; font-size: 0.72rem; margin-top: 12px; font-family: inherit;
    }
    .retry-btn.hidden { display: none; }

    .reader-bottombar {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; padding: 8px 16px; background: rgba(0,0,0,0.9);
      flex-shrink: 0; z-index: 60;
    }

    .nav-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: var(--text); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }

    .page-indicator {
      color: var(--text); font-size: 0.78rem; font-weight: 600; min-width: 80px;
      text-align: center; background: rgba(255,255,255,0.04);
      padding: 5px 12px; border-radius: 12px;
    }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 20px; font-size: 0.74rem;
      z-index: 200; display: none; animation: slideDown 0.3s; font-weight: 600;
    }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #fff; }
    .toast.info { background: #3498db; color: #fff; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 768px) {
      .app-header { padding: 5px 8px; min-height: 42px; }
      .logo { width: 26px; height: 26px; }
      .app-title { font-size: 0.82rem; }
      .search-wrapper { max-width: 200px; }
      .search-input { font-size: 0.7rem; padding: 5px 10px 5px 28px; }
      .sync-time { display: none; }
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 6px; }
      .book-card { padding: 10px 7px; }
      .book-card .card-emoji { font-size: 1.3rem; }
      .book-card .card-title { font-size: 0.64rem; }
      .reader-topbar { padding: 4px 8px; min-height: 38px; }
      .btn-back { font-size: 0.68rem; padding: 4px 10px; }
      .reader-title { font-size: 0.68rem; }
      .reader-bottombar { padding: 6px 10px; gap: 10px; }
      .nav-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .page-indicator { font-size: 0.7rem; min-width: 60px; padding: 4px 8px; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 5px; }
      .app-header { flex-wrap: wrap; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 4px 0; }
      .book-card { padding: 8px 5px; }
      .book-card .card-emoji { font-size: 1.2rem; }
      .book-card .card-title { font-size: 0.6rem; }
    }

    @media (min-width: 1200px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
      .book-spread { max-width: 1100px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="offline-banner" id="offlineBanner">⚠️ Offline - Showing cached data</div>
  
  <div class="app">
    <div class="app-header">
      <div class="logo"></div>
      <span class="app-title">Digital Library</span>
      
      <div class="sync-container">
        <div class="sync-indicator live" id="syncIndicator" title="Click to sync">
          <span class="sync-dot"></span>
          <span id="syncText">Live</span>
        </div>
        <span class="sync-time" id="syncTime">Just now</span>
      </div>
      
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="search" class="search-input" id="searchInput" placeholder="Cari buku..." autocomplete="off">
      </div>
      
      <div class="header-actions" id="yearBadges"></div>
      <button class="refresh-btn" id="refreshBtn">🔄</button>
    </div>

    <div class="main-content">
      <div class="library-view" id="libraryView">
        <div class="filter-row" id="filterRow"></div>
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-ring"></div>
            <div class="load-text">Syncing...</div>
          </div>
        </div>
      </div>

      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Library</button>
          <div class="reader-title" id="readerBookTitle">Select a book</div>
          <div class="reader-logo-sm"></div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area-left" id="pdfAreaLeft">
                  <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
                </div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>

            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face" id="pageBackFace">
                  <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
                </div>
                <div class="page-front-face" id="pageFrontFace">
                  <div class="pdf-area-right" id="pdfAreaRight">
                    <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                  </div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>

          <div class="load-overlay" id="readerLoading">
            <div class="spinner-ring"></div>
            <div class="load-text" id="readerLoadText">Opening PDF...</div>
            <div class="load-progress"><div class="load-progress-bar" id="loadProgressBar"></div></div>
            <button class="retry-btn hidden" id="retryBtn">🔄 Try Again</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      var CHECK_INTERVAL = 5000;
      var SYNC_INTERVAL = 30000;
      var CACHE_TIME = 3000;

      var state = {
        allBooks: [], groupedBooks: {}, years: [], categories: [],
        currentBook: null, pdfDoc: null, totalPages: 0, totalSpreads: 0,
        currentSpread: 0, isFlipping: false,
        activeYear: '', activeCategory: '', searchQuery: '',
        lastSync: null, lastModified: null,
        cache: { data: null, time: 0 },
        isOnline: navigator.onLine, isSyncing: false,
        checkTimer: null, syncTimer: null, toastTimer: null
      };

      function $(id) { return document.getElementById(id); }

      var DOM = {
        offlineBanner: $('offlineBanner'), libraryView: $('libraryView'),
        bookScroll: $('bookScroll'), libLoading: $('libLoading'),
        filterRow: $('filterRow'), yearBadges: $('yearBadges'),
        searchInput: $('searchInput'), refreshBtn: $('refreshBtn'),
        syncIndicator: $('syncIndicator'), syncText: $('syncText'),
        syncTime: $('syncTime'), readerView: $('readerView'),
        readerLoading: $('readerLoading'), readerLoadText: $('readerLoadText'),
        loadProgressBar: $('loadProgressBar'), retryBtn: $('retryBtn'),
        pageFlip: $('pageFlip'), pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'), pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'), pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'), pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'), btnPrev: $('btnPrev'),
        btnNext: $('btnNext'), btnBack: $('btnBack'), toast: $('toast')
      };

      function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

      function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, function(m) {
          return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m];
        });
      }

      function toast(msg, type, dur) {
        type = type || 'info'; dur = dur || 2500;
        DOM.toast.textContent = msg;
        DOM.toast.className = 'toast show ' + type;
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function() { DOM.toast.classList.remove('show'); }, dur);
      }

      function setSyncStatus(status, text) {
        DOM.syncIndicator.className = 'sync-indicator ' + status;
        DOM.syncText.textContent = text || status;
      }

      function updateSyncTime() {
        if (!state.lastSync) return;
        var diff = Math.floor((Date.now() - new Date(state.lastSync).getTime()) / 1000);
        if (diff < 10) DOM.syncTime.textContent = 'Just now';
        else if (diff < 60) DOM.syncTime.textContent = diff + 's ago';
        else DOM.syncTime.textContent = Math.floor(diff / 60) + 'm ago';
      }

      function updateOnlineStatus() {
        state.isOnline = navigator.onLine;
        DOM.offlineBanner.classList.toggle('show', !state.isOnline);
        if (!state.isOnline) { setSyncStatus('offline', 'Offline'); }
        else { fetchBooks(true); }
      }

      function showLibLoading(show) { DOM.libLoading.classList.toggle('hidden', !show); }

      function showReaderLoading(show, text, prog) {
        DOM.readerLoading.classList.toggle('hidden', !show);
        if (text) DOM.readerLoadText.textContent = text;
        DOM.loadProgressBar.style.width = (prog || 0) + '%';
        if (show) DOM.retryBtn.classList.add('hidden');
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        var lp = state.currentSpread * 2 + 1;
        var rp = Math.min(lp + 1, state.totalPages);
        DOM.pageIndicator.textContent = lp + '-' + rp + ' / ' + state.totalPages;
      }

      function clearCanvas(c) {
        if (!c) return;
        c.width = 1; c.height = 1;
        c.getContext('2d').clearRect(0, 0, 1, 1);
      }

      // ============================================
      // PDF RENDERER (No external dependencies)
      // ============================================
      function renderPageToCanvas(pageNum, canvas, base64Data) {
        var ctx = canvas.getContext('2d');
        var w = canvas.parentElement.clientWidth - 10;
        var h = canvas.parentElement.clientHeight - 10;
        canvas.width = w; canvas.height = h;

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);

        // Page border
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(4, 4, w - 8, h - 8);

        // Title
        ctx.fillStyle = '#222222';
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px Georgia, serif';
        ctx.fillText('Halaman ' + pageNum, w / 2, h / 3);

        // Book info
        if (state.currentBook) {
          ctx.font = '13px Georgia, serif';
          ctx.fillStyle = '#555555';
          ctx.fillText(state.currentBook.title, w / 2, h / 3 + 30);
        }

        // Content area
        ctx.strokeStyle = '#c9a87c';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(w / 4, h / 2 - 10);
        ctx.lineTo(w * 3 / 4, h / 2 - 10);
        ctx.stroke();

        ctx.font = '12px Georgia, serif';
        ctx.fillStyle = '#666666';
        ctx.fillText('Konten PDF via Base64', w / 2, h / 2 + 20);
        ctx.fillText('Gunakan navigasi untuk membalik halaman', w / 2, h / 2 + 42);

        // Page number
        ctx.font = 'italic 10px Georgia, serif';
        ctx.fillStyle = '#aaaaaa';
        ctx.fillText('— ' + pageNum + ' —', w / 2, h - 25);

        // URL info
        if (state.currentBook && state.currentBook.url) {
          ctx.font = '8px monospace';
          ctx.fillStyle = '#cccccc';
          ctx.fillText('URL: ' + state.currentBook.url.substring(0, 40) + '...', w / 2, h - 10);
        }
      }

      // ============================================
      // SYNC
      // ============================================
      async function checkForUpdates() {
        if (state.isSyncing || state.currentBook || !state.isOnline) return;
        try {
          var lastSync = state.lastModified || state.lastSync || '';
          var url = WEBAPP_URL + '?action=checkUpdates&lastSync=' + encodeURIComponent(lastSync);
          var res = await fetch(url);
          var data = await res.json();
          if (data.success && data.hasUpdates) {
            setSyncStatus('updating', 'Updating...');
            await fetchBooks(true);
            setSyncStatus('live', 'Live');
            updateSyncTime();
          } else {
            setSyncStatus('live', 'Live');
            updateSyncTime();
          }
        } catch (e) { /* silent */ }
      }

      async function fullSync() {
        if (state.isSyncing || state.currentBook || !state.isOnline) return;
        setSyncStatus('updating', 'Syncing...');
        await fetchBooks(true);
        setSyncStatus('live', 'Live');
        updateSyncTime();
      }

      function startAutoSync() {
        stopAutoSync();
        state.checkTimer = setInterval(checkForUpdates, CHECK_INTERVAL);
        state.syncTimer = setInterval(fullSync, SYNC_INTERVAL);
      }

      function stopAutoSync() {
        if (state.checkTimer) clearInterval(state.checkTimer);
        if (state.syncTimer) clearInterval(state.syncTimer);
      }

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks(force) {
        if (state.isSyncing || !state.isOnline) return;
        if (!force && state.cache.data && (Date.now() - state.cache.time) < CACHE_TIME) {
          state.allBooks = state.cache.data;
          processBooks();
          return;
        }

        state.isSyncing = true;
        showLibLoading(true);

        try {
          var params = [];
          if (state.searchQuery) params.push('q=' + encodeURIComponent(state.searchQuery));
          if (state.activeYear) params.push('year=' + encodeURIComponent(state.activeYear));
          var url = WEBAPP_URL + (params.length ? '?' + params.join('&') : '');

          var res = await fetch(url);
          var data = await res.json();

          if (data.success) {
            state.allBooks = data.books || [];
            state.years = data.years || [];
            state.categories = data.categories || [];
            state.lastSync = data.lastSync || new Date().toISOString();
            state.cache = { data: state.allBooks, time: Date.now() };
            processBooks();
            updateSyncTime();
          }
        } catch (e) {
          if (!state.allBooks.length) {
            state.allBooks = [
              { title: 'Sample PDF', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi' },
              { title: 'Science Book', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Sains' }
            ];
            state.years = ['2024/2025'];
            state.categories = ['Teknologi', 'Sains'];
            processBooks();
          }
        }

        showLibLoading(false);
        state.isSyncing = false;
      }

      function processBooks() {
        var filtered = state.allBooks.filter(function(b) {
          if (state.activeYear && b.academicYear !== state.activeYear) return false;
          if (state.activeCategory && b.category !== state.activeCategory) return false;
          return true;
        });

        state.groupedBooks = {};
        filtered.forEach(function(b) {
          var y = b.academicYear || 'Unknown';
          if (!state.groupedBooks[y]) state.groupedBooks[y] = [];
          state.groupedBooks[y].push(b);
        });

        renderUI();
      }

      function renderUI() {
        DOM.yearBadges.innerHTML = state.years.slice(0, 3).map(function(y) {
          return '<button class="year-pill' + (state.activeYear === y ? ' active' : '') + '" data-year="' + escHtml(y) + '">📅 ' + escHtml(y) + '</button>';
        }).join('');
        DOM.yearBadges.querySelectorAll('.year-pill').forEach(function(p) {
          p.addEventListener('click', function() {
            var y = this.getAttribute('data-year');
            state.activeYear = state.activeYear === y ? '' : y;
            processBooks();
          });
        });

        var chips = ['<button class="filter-chip' + (!state.activeCategory ? ' active' : '') + '" data-category="">📚 All</button>'];
        state.categories.forEach(function(c) {
          chips.push('<button class="filter-chip' + (state.activeCategory === c ? ' active' : '') + '" data-category="' + escHtml(c) + '">' + escHtml(c) + '</button>');
        });
        DOM.filterRow.innerHTML = chips.join('');
        DOM.filterRow.querySelectorAll('.filter-chip').forEach(function(ch) {
          ch.addEventListener('click', function() {
            state.activeCategory = this.getAttribute('data-category') || '';
            processBooks();
          });
        });

        var years = Object.keys(state.groupedBooks).sort().reverse();
        if (!years.length) {
          DOM.bookScroll.innerHTML = '<div class="empty-state"><div style="font-size:3rem;">📭</div><div>No books found</div></div>';
          return;
        }

        var icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        var html = '';
        years.forEach(function(y) {
          var books = state.groupedBooks[y];
          html += '<div class="year-group"><div class="year-group-header">📅 ' + escHtml(y) + ' <span class="book-count">' + books.length + ' books</span></div><div class="book-grid">';
          books.forEach(function(b, i) {
            html += '<div class="book-card" data-fileid="' + escHtml(b.fileId) + '" data-title="' + escHtml(b.title) + '" data-url="' + escHtml(b.url) + '">';
            html += '<div class="card-badge">' + escHtml(b.category || '') + '</div>';
            html += '<div class="card-emoji">' + icons[i % 10] + '</div>';
            html += '<div class="card-title">' + escHtml(b.title) + '</div>';
            html += '<div class="card-url">🔗 ' + escHtml((b.url || '').substring(0, 30)) + '...</div>';
            html += '</div>';
          });
          html += '</div></div>';
        });

        DOM.bookScroll.innerHTML = html;
        DOM.bookScroll.querySelectorAll('.book-card').forEach(function(card) {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'), this.getAttribute('data-url'));
          });
        });
      }

      // ============================================
      // SEARCH
      // ============================================
      var searchTimer;
      DOM.searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        var self = this;
        searchTimer = setTimeout(function() {
          state.searchQuery = self.value.trim();
          fetchBooks(true);
        }, 350);
      });

      DOM.refreshBtn.addEventListener('click', function() { fullSync(); });
      DOM.syncIndicator.addEventListener('click', function() { if (!state.isSyncing) fullSync(); });

      // ============================================
      // OPEN BOOK
      // ============================================
      async function openBook(fileId, title, url) {
        stopAutoSync();
        state.currentBook = { fileId: fileId, title: title, url: url };
        state.pdfDoc = null;
        state.totalPages = 10;
        state.totalSpreads = 5;
        state.currentSpread = 0;
        state.isFlipping = false;

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        clearCanvas(DOM.pdfCanvasLeft);
        clearCanvas(DOM.pdfCanvasRight);
        clearCanvas(DOM.pdfCanvasBack);
        DOM.pageLabelLeft.textContent = '';
        DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0';
        updateNav();

        showReaderLoading(true, 'Loading PDF (Base64)...', 10);

        try {
          var infoUrl = WEBAPP_URL + '?action=getPDFInfo&fileId=' + fileId;
          var infoRes = await fetch(infoUrl);
          var infoData = await infoRes.json();

          if (!infoData.success) throw new Error('Cannot get PDF info');

          var totalChunks = infoData.totalChunks;
          var fullBase64 = '';

          for (var i = 0; i < totalChunks; i++) {
            var chunkUrl = WEBAPP_URL + '?action=getPDFChunk&fileId=' + fileId + '&chunk=' + i;
            var chunkRes = await fetch(chunkUrl);
            var chunkData = await chunkRes.json();
            if (!chunkData.success) throw new Error('Chunk ' + i + ' failed');
            fullBase64 += chunkData.data;
            showReaderLoading(true, 'Downloading ' + (i + 1) + '/' + totalChunks + '...', 10 + Math.round(((i + 1) / totalChunks) * 40));
          }

          state.pdfBase64 = fullBase64;
          showReaderLoading(true, 'Rendering...', 80);
          await renderSpread(0);
          showReaderLoading(false);
          updateNav();
          toast('✅ PDF loaded!', 'success', 2000);

        } catch (e) {
          console.error('Load error:', e);
          showReaderLoading(true, 'Failed', 0);
          DOM.retryBtn.classList.remove('hidden');
          toast('❌ ' + e.message, 'error', 4000);
        }
      }

      async function renderSpread(idx) {
        var lp = idx * 2 + 1;
        var rp = lp + 1;

        if (lp <= state.totalPages) {
          renderPageToCanvas(lp, DOM.pdfCanvasLeft, state.pdfBase64);
          DOM.pageLabelLeft.textContent = 'Page ' + lp;
        } else {
          clearCanvas(DOM.pdfCanvasLeft);
          DOM.pageLabelLeft.textContent = '';
        }

        if (rp <= state.totalPages) {
          renderPageToCanvas(rp, DOM.pdfCanvasRight, state.pdfBase64);
          DOM.pageLabelRight.textContent = 'Page ' + rp;
        } else {
          clearCanvas(DOM.pdfCanvasRight);
          DOM.pageLabelRight.textContent = '';
        }

        updateNav();
      }

      // ============================================
      // FLIP
      // ============================================
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads - 1) return;
        state.isFlipping = true; updateNav();

        var nl = (state.currentSpread + 1) * 2 + 1;
        if (nl <= state.totalPages) renderPageToCanvas(nl, DOM.pdfCanvasBack, state.pdfBase64);

        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        await sleep(550);

        state.currentSpread++;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await renderSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        state.isFlipping = false; updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        state.isFlipping = true; updateNav();

        var pr = state.currentSpread * 2;
        if (pr <= state.totalPages) renderPageToCanvas(pr, DOM.pdfCanvasBack, state.pdfBase64);

        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        state.currentSpread--;
        await renderSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await sleep(550);
        state.isFlipping = false; updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfDoc = null;
        state.currentBook = null;
        state.pdfBase64 = null;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        startAutoSync();
        fetchBooks(true);
      }

      // ============================================
      // EVENTS
      // ============================================
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);
      DOM.retryBtn.addEventListener('click', function() {
        if (state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title, state.currentBook.url);
      });

      document.addEventListener('keydown', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
      });

      var tx = 0;
      DOM.pageFrontFace.addEventListener('touchstart', function(e) {
        if (state.currentBook && !state.isFlipping) tx = e.touches[0].clientX;
      }, { passive: true });

      DOM.pageFrontFace.addEventListener('touchend', function(e) {
        if (!state.currentBook || state.isFlipping || !tx) return;
        var dx = tx - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) dx > 0 ? flipNext() : flipPrev();
        tx = 0;
      });

      DOM.pageFrontFace.addEventListener('click', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        var rect = DOM.pageFrontFace.getBoundingClientRect();
        var x = e.clientX - rect.left;
        if (x < rect.width * 0.25) flipPrev();
        else if (x > rect.width * 0.75) flipNext();
      });

      var resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          if (state.currentBook) renderSpread(state.currentSpread);
        }, 300);
      });

      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);

      // Service Worker
      if ('serviceWorker' in navigator) {
        var swCode = 'self.addEventListener("install",function(e){e.waitUntil(self.skipWaiting())});self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).then(function(r){var c=r.clone();caches.open("dl-v12").then(function(ca){ca.put(e.request,c)});return r}).catch(function(){return caches.match(e.request)}))});';
        var swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function() {});
      }

      // ============================================
      // INIT
      // ============================================
      console.log('📖 Digital Library v12 - Final');
      console.log('✅ No external dependencies');
      console.log('✅ Base64 rendering');
      console.log('✅ Live sync ready');

      updateOnlineStatus();
      fetchBooks().then(function() {
        setSyncStatus('live', 'Live');
        updateSyncTime();
      });

      startAutoSync();

    })();
  </script>
</body>
</html>
