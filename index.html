<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#8B5A2B">
  <title>📖 E-Book Edukasi Interaktif</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkUtQm9vayBFZHVrYXNpIEludGVyYWt0aWYiLAogICJzaG9ydF9uYW1lIjogIkUtQm9vayIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmFmM2UwIiwKICAidGhlbWVfY29sb3IiOiAiIzhiNWEyYiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5pbWd1ci5jb20vSmt4UllkNi5wbmciLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      background: #faf3e0;
      background-image: radial-gradient(circle at 20% 30%, rgba(139, 90, 43, 0.08) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(210, 180, 140, 0.1) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Container utama buku */
    .ebook-container {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      max-height: 800px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
    }

    /* Area buku yang bisa dibalik */
    .book {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Kartu halaman (dua halaman terbuka) */
    .page-spread {
      position: relative;
      width: 95%;
      height: 90%;
      background: #fff8ee;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M20 20 L80 20 L80 80 L20 80 Z" fill="none" stroke="%23d2b48c" stroke-width="0.5" opacity="0.2"/></svg>');
      border-radius: 8px 20px 20px 8px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), inset 0 0 30px rgba(139,90,43,0.1);
      display: flex;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      border: 1px solid #d2b48c;
    }

    /* Efek lipatan tengah */
    .page-spread::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to right, rgba(139,90,43,0.2), rgba(139,90,43,0.4), rgba(139,90,43,0.2));
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      z-index: 10;
      transform: translateX(-50%);
    }

    /* Halaman kiri dan kanan */
    .page-left, .page-right {
      width: 50%;
      height: 100%;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      background: #fffcf5;
      transition: background 0.3s;
    }

    .page-left {
      border-right: none;
      background: #fffaf2;
    }

    .page-right {
      background: #fffcf7;
    }

    /* Konten halaman */
    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chapter-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #8B5A2B;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #5c3a1e;
      margin-bottom: 1.2rem;
      line-height: 1.3;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #4a3a2a;
      margin-bottom: 1rem;
      text-align: justify;
    }

    .illustration {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #f3e5d8, #e6d2b5);
      border-radius: 12px;
      margin: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #8B5A2B;
      box-shadow: inset 0 2px 10px rgba(139,90,43,0.2);
      transition: all 0.4s;
    }

    .illustration:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(139,90,43,0.3);
    }

    /* Logo di pojok */
    .logo-corner {
      position: absolute;
      bottom: 15px;
      right: 25px;
      width: 50px;
      height: 50px;
      background-image: url('https://i.imgur.com/JkxRYd6.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.7;
      z-index: 20;
    }

    .logo-corner-left {
      left: 25px;
      right: auto;
    }

    /* Navigasi */
    .navigation {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #8B5A2B;
      border: none;
      color: white;
      font-size: 1.8rem;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(139,90,43,0.3);
      transition: all 0.25s ease;
      background: linear-gradient(145deg, #9b6b3d, #7a4e26);
      border: 1px solid #b8864b;
    }

    .nav-btn:active {
      transform: scale(0.9);
      box-shadow: 0 4px 8px rgba(139,90,43,0.4);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      transform: none;
      pointer-events: none;
      filter: grayscale(40%);
    }

    .page-indicator {
      font-weight: 700;
      font-size: 1.2rem;
      background: rgba(139,90,43,0.1);
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      color: #5c3a1e;
      letter-spacing: 1px;
      backdrop-filter: blur(5px);
    }

    /* Animasi flip */
    .flip-left {
      animation: flipLeftPage 0.6s ease-out;
    }

    .flip-right {
      animation: flipRightPage 0.6s ease-out;
    }

    @keyframes flipLeftPage {
      0% { transform: rotateY(0); }
      40% { transform: rotateY(-12deg); }
      100% { transform: rotateY(0); }
    }

    @keyframes flipRightPage {
      0% { transform: rotateY(0); }
      40% { transform: rotateY(12deg); }
      100% { transform: rotateY(0); }
    }

    /* Loading & status */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8B5A2B;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3e5d8;
      border-top: 5px solid #8B5A2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #b33a3a;
      background: #ffe6e6;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    /* Responsif */
    @media (max-width: 700px) {
      .page-spread {
        flex-direction: column;
        border-radius: 12px;
      }
      .page-spread::before {
        display: none;
      }
      .page-left, .page-right {
        width: 100%;
        height: 50%;
        padding: 1.5rem;
      }
      h2 {
        font-size: 1.5rem;
      }
      .illustration {
        height: 120px;
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="ebook-container">
    <div class="book" id="book">
      <div class="page-spread" id="pageSpread">
        <!-- Halaman kiri -->
        <div class="page-left" id="leftPage">
          <div class="page-content" id="leftContent">
            <div class="loading-spinner">
              <div class="spinner"></div>
              <span>Memuat E-Book...</span>
            </div>
          </div>
          <div class="logo-corner logo-corner-left"></div>
        </div>
        <!-- Halaman kanan -->
        <div class="page-right" id="rightPage">
          <div class="page-content" id="rightContent">
            <div class="loading-spinner">
              <div class="spinner"></div>
            </div>
          </div>
          <div class="logo-corner"></div>
        </div>
      </div>
    </div>

    <div class="navigation">
      <button class="nav-btn" id="prevBtn" title="Halaman Sebelumnya">←</button>
      <span class="page-indicator" id="pageIndicator">1 / 1</span>
      <button class="nav-btn" id="nextBtn" title="Halaman Berikutnya">→</button>
    </div>
  </div>

  <script>
    (function() {
      // Konfigurasi
      
      const WEBAPP_URL = `https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec`; // Ganti dengan URL Web App Google Apps Script Anda setelah deploy
      
      // State
      let pagesData = [];
      let currentSpreadIndex = 0; // indeks spread (dua halaman sekaligus)
      let totalSpreads = 0;

      // DOM Elements
      const leftContentDiv = document.getElementById('leftContent');
      const rightContentDiv = document.getElementById('rightContent');
      const pageSpread = document.getElementById('pageSpread');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageIndicator = document.getElementById('pageIndicator');

      // Fungsi untuk mengambil data dari Google Spreadsheet melalui Web App
      async function fetchSpreadsheetData() {
        try {
          // Gunakan URL Web App yang sudah di-deploy (pastikan deploy dengan akses "Anyone")
          const response = await fetch(WEBAPP_URL);
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          const data = await response.json();
          
          if (data && data.pages && Array.isArray(data.pages)) {
            pagesData = data.pages;
            // Pastikan jumlah halaman genap dengan menambah halaman kosong jika ganjil
            if (pagesData.length % 2 !== 0) {
              pagesData.push({ 
                title: "", 
                content: "", 
                chapter: "", 
                illustration: "" 
              });
            }
            totalSpreads = Math.ceil(pagesData.length / 2);
            currentSpreadIndex = 0;
            renderCurrentSpread();
          } else {
            throw new Error("Format data tidak valid");
          }
        } catch (error) {
          console.error("Gagal memuat data:", error);
          leftContentDiv.innerHTML = `<div class="error-message">⚠️ Gagal memuat konten. Pastikan Web App sudah dideploy.<br><small>${error.message}</small></div>`;
          rightContentDiv.innerHTML = `<div class="error-message">🔗 Periksa koneksi dan URL Web App.</div>`;
        }
      }

      // Render halaman kiri dan kanan berdasarkan spread index
      function renderCurrentSpread() {
        if (!pagesData.length || totalSpreads === 0) return;

        const leftPageIndex = currentSpreadIndex * 2;
        const rightPageIndex = leftPageIndex + 1;
        
        const leftPage = pagesData[leftPageIndex] || { title: "Halaman Kosong", content: "", chapter: "", illustration: "" };
        const rightPage = pagesData[rightPageIndex] || { title: "Halaman Kosong", content: "", chapter: "", illustration: "" };

        // Render kiri
        leftContentDiv.innerHTML = createPageHTML(leftPage);
        // Render kanan
        rightContentDiv.innerHTML = createPageHTML(rightPage);

        // Update indikator halaman
        const displayLeft = leftPageIndex + 1;
        const displayRight = Math.min(rightPageIndex + 1, pagesData.length);
        pageIndicator.textContent = `${displayLeft} - ${displayRight} / ${pagesData.length}`;

        // Update tombol navigasi
        prevBtn.disabled = currentSpreadIndex === 0;
        nextBtn.disabled = currentSpreadIndex >= totalSpreads - 1;

        // Animasi subtle masuk
        pageSpread.classList.add('flip-right');
        setTimeout(() => pageSpread.classList.remove('flip-right'), 600);
      }

      // Membuat HTML untuk satu halaman
      function createPageHTML(page) {
        const chapterHTML = page.chapter ? `<div class="chapter-badge">📌 ${escapeHTML(page.chapter)}</div>` : '';
        const titleHTML = page.title ? `<h2>${escapeHTML(page.title)}</h2>` : '';
        const contentHTML = page.content ? `<p>${escapeHTML(page.content)}</p>` : '';
        const illustrationHTML = page.illustration ? 
          `<div class="illustration">${escapeHTML(page.illustration.substring(0, 8))}${page.illustration.length > 8 ? '...' : ''}</div>` : 
          '';

        return `
          ${chapterHTML}
          ${titleHTML}
          ${illustrationHTML}
          ${contentHTML}
        `;
      }

      // Escape HTML sederhana
      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Navigasi
      function goToPrevSpread() {
        if (currentSpreadIndex > 0) {
          currentSpreadIndex--;
          pageSpread.classList.add('flip-left');
          renderCurrentSpread();
          setTimeout(() => pageSpread.classList.remove('flip-left'), 600);
        }
      }

      function goToNextSpread() {
        if (currentSpreadIndex < totalSpreads - 1) {
          currentSpreadIndex++;
          pageSpread.classList.add('flip-right');
          renderCurrentSpread();
          setTimeout(() => pageSpread.classList.remove('flip-right'), 600);
        }
      }

      // Event listeners
      prevBtn.addEventListener('click', goToPrevSpread);
      nextBtn.addEventListener('click', goToNextSpread);

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          goToPrevSpread();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          goToNextSpread();
        }
      });

      // Touch swipe support
      let touchStartX = 0;
      document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!touchStartX) return;
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) goToNextSpread();
          else goToPrevSpread();
        }
        touchStartX = 0;
      });

      // Dummy data fallback jika Web App belum siap (untuk demo)
      function loadDummyData() {
        pagesData = [
          { chapter: "Bab 1", title: "Pengenalan Alam Semesta", content: "Alam semesta sangat luas dan penuh misteri. Dari planet hingga galaksi, semuanya bergerak dalam harmoni yang menakjubkan.", illustration: "🌌🌟" },
          { chapter: "Bab 1", title: "Planet Bumi Kita", content: "Bumi adalah planet ketiga dari Matahari dan satu-satunya yang diketahui memiliki kehidupan. Dilindungi atmosfer yang sempurna.", illustration: "🌍🌿" },
          { chapter: "Bab 2", title: "Ekosistem Hutan Hujan", content: "Hutan hujan tropis adalah rumah bagi jutaan spesies. Mereka menghasilkan oksigen dan menyerap karbon dioksida.", illustration: "🌳🐒" },
          { chapter: "Bab 2", title: "Keanekaragaman Hayati", content: "Indonesia memiliki keanekaragaman hayati tertinggi di dunia. Dari orangutan Kalimantan hingga komodo di Nusa Tenggara.", illustration: "🐘🦜" },
          { chapter: "Bab 3", title: "Teknologi Masa Depan", content: "AI dan robotika mengubah cara kita hidup. Mulai dari kendaraan otonom hingga asisten virtual pintar.", illustration: "🤖🚀" },
          { chapter: "Bab 3", title: "Energi Terbarukan", content: "Panel surya dan turbin angin menjadi solusi energi bersih. Mengurangi ketergantungan pada bahan bakar fosil.", illustration: "☀️💨" }
        ];
        totalSpreads = Math.ceil(pagesData.length / 2);
        currentSpreadIndex = 0;
        renderCurrentSpread();
      }

      // Inisialisasi: coba fetch dari Google Sheets, fallback ke dummy jika gagal
      async function initialize() {
        try {
          await fetchSpreadsheetData();
          // Jika fetch berhasil tapi data kosong, gunakan dummy
          if (!pagesData.length) {
            console.warn("Data spreadsheet kosong, menggunakan data demo.");
            loadDummyData();
          }
        } catch (err) {
          console.log("Menggunakan data demo karena Web App belum terhubung.");
          loadDummyData();
        }
      }

      // Service Worker Registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('data:application/javascript;base64,DQovLyBTaW1wbGUgU0VydmljZSBXb3JrZXIgZm9yIFBXQQ0KY29uc3QgQ0FDSEVfTkFNRSA9ICdlYm9vay1wd2EtdjEnOw0KY29uc3QgVVJMU19UT19DQUNIRSA9IFsnLyddOw0KDQpzZWxmLmFkZEV2ZW50TGlzdGVuZXIoJ2luc3RhbGwnLCBldmVudCA9PiB7DQogIGV2ZW50LndhaXRVbnRpbChzZWxmLnNraXBXYWl0aW5nKCkpOw0KfSk7DQoNCnNlbGYuYWRkRXZlbnRMaXN0ZW5lcignYWN0aXZhdGUnLCBldmVudCA9PiB7DQogIGV2ZW50LndhaXRVbnRpbChzZWxmLmNsaWVudHMuY2xhaW0oKSk7DQp9KTsNCg0Kc2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGV2ZW50ID0+IHsNCiAgZXZlbnQucmVzcG9uZFdpdGgoDQogICAgY2FjaGVzLm1hdGNoKGV2ZW50LnJlcXVlc3QpDQogICAgICAudGhlbihyZXNwb25zZSA9PiByZXNwb25zZSB8fCBmZXRjaChldmVudC5yZXF1ZXN0KSkNCiAgKTsNCn0pOw==')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW not registered', err));
        });
      }

      // Start
      initialize();
    })();
  </script>
</body>
</html>
