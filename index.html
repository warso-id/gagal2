                track.style.transform = `translate3d(-${offset}px, 0, 0)`;
                updateDotsAndCounter(totalSlides);
                updateButtons(totalSlides);
            }

            function updateDotsAndCounter(totalSlides) {
                if (state.viewMode === 'grid') return;
                const cardsPerView = getCardsPerView();
                const maxIndex = Math.max(0, totalSlides - cardsPerView);
                const totalDots = Math.min(totalSlides, maxIndex + 1);
                let dotsHtml = '';
                for (let i = 0; i < totalDots; i++) {
                    const active = i === state.currentIndex ? 'active' : '';
                    dotsHtml += `<button class="dot ${active}" data-index="${i}" role="tab" aria-selected="${i === state.currentIndex}" aria-label="Slide ${i + 1} dari ${totalDots}"></button>`;
                }
                dotsContainer.innerHTML = dotsHtml;
                dotsContainer.querySelectorAll('.dot').forEach(dot => {
                    dot.addEventListener('click', function() { 
                        goToSlide(parseInt(this.dataset.index)); 
                    });
                });
                counter.textContent = `${totalSlides > 0 ? state.currentIndex + 1 : 0} / ${totalSlides}`;
            }

            function updateButtons(totalSlides) {
                if (state.viewMode === 'grid') return;
                const cardsPerView = getCardsPerView();
                const maxIndex = Math.max(0, totalSlides - cardsPerView);
                prevBtn.disabled = state.currentIndex === 0 || totalSlides === 0;
                nextBtn.disabled = state.currentIndex >= maxIndex || totalSlides === 0;
                prevBtn.style.opacity = prevBtn.disabled ? '0.2' : '1';
                nextBtn.style.opacity = nextBtn.disabled ? '0.2' : '1';
            }

            function goToSlide(index, animate = true) {
                if (state.viewMode === 'grid') return;
                const cards = track.querySelectorAll('.card');
                const totalSlides = cards.length;
                if (totalSlides === 0) return;
                const cardsPerView = getCardsPerView();
                const maxIndex = Math.max(0, totalSlides - cardsPerView);
                const target = Math.min(Math.max(index, 0), maxIndex);
                if (target !== state.currentIndex) {
                    state.currentIndex = target;
                    updateCarousel(animate);
                } else { 
                    updateCarousel(animate); 
                }
                if (state.viewMode === 'carousel') resetProgress();
            }

            function nextSlide() {
                if (state.viewMode === 'grid' || isAutoPlayPaused) return;
                const cards = track.querySelectorAll('.card');
                const totalSlides = cards.length;
                const cardsPerView = getCardsPerView();
                const maxIndex = Math.max(0, totalSlides - cardsPerView);
                if (state.currentIndex < maxIndex) goToSlide(state.currentIndex + 1);
                else goToSlide(0);
            }

            function prevSlide() {
                if (state.viewMode === 'grid') return;
                if (state.currentIndex > 0) goToSlide(state.currentIndex - 1);
                else {
                    const cards = track.querySelectorAll('.card');
                    const totalSlides = cards.length;
                    const cardsPerView = getCardsPerView();
                    const maxIndex = Math.max(0, totalSlides - cardsPerView);
                    goToSlide(maxIndex);
                }
            }

            function updateViewMode() {
                wrapper.classList.toggle('grid-mode', state.viewMode === 'grid');
                const icon = viewToggle.querySelector('i');
                icon.className = state.viewMode === 'grid' ? 'fas fa-th-list' : 'fas fa-th';
                viewToggle.classList.toggle('active-mode', state.viewMode === 'grid');
                viewToggle.setAttribute('aria-label', state.viewMode === 'grid' ? 'Ganti ke mode carousel' : 'Ganti ke mode grid');
                
                if (state.viewMode === 'carousel') {
                    progressBar.classList.remove('hidden');
                    pauseBtn.style.display = 'flex';
                    setTimeout(() => { 
                        updateCarousel(false);
                        if (!isAutoPlayPaused) startAutoPlay();
                    }, 50);
                } else {
                    progressBar.classList.add('hidden');
                    pauseBtn.style.display = 'none';
                    stopAutoPlay();
                    track.style.transform = 'none';
                }
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // AUTO PLAY & PROGRESS
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            function startAutoPlay() {
                if (state.viewMode === 'grid' || isAutoPlayPaused) return;
                stopAutoPlay();
                startProgress();
                autoPlayInterval = setInterval(() => {
                    nextSlide();
                    stopProgress();
                    progressValue = 100;
                    progressBar.style.width = '100%';
                    startProgress();
                }, AUTO_PLAY_DELAY);
            }

            function stopAutoPlay() { 
                if (autoPlayInterval) { 
                    clearInterval(autoPlayInterval);
                    autoPlayInterval = null; 
                } 
                stopProgress(); 
            }

            function toggleAutoPlay() {
                isAutoPlayPaused = !isAutoPlayPaused;
                state.autoplayPaused = isAutoPlayPaused;
                
                if (isAutoPlayPaused) {
                    stopAutoPlay();
                    pauseBtn.classList.add('paused');
                    pauseBtn.querySelector('i').className = 'fas fa-play';
                    pauseBtn.setAttribute('aria-label', 'Lanjutkan putar otomatis');
                    showToast('Putar otomatis dijeda ⏸️', 'info');
                } else {
                    pauseBtn.classList.remove('paused');
                    pauseBtn.querySelector('i').className = 'fas fa-pause';
                    pauseBtn.setAttribute('aria-label', 'Jeda putar otomatis');
                    startAutoPlay();
                    showToast('Putar otomatis dilanjutkan ▶️', 'info');
                }
                saveState();
            }

            function startProgress() {
                if (state.viewMode === 'grid' || isAutoPlayPaused) return;
                stopProgress();
                progressValue = 100;
                progressBar.style.width = '100%';
                progressInterval = setInterval(() => {
                    progressValue -= (PROGRESS_STEP / AUTO_PLAY_DELAY) * 100;
                    if (progressValue <= 0) { 
                        progressValue = 0;
                        progressBar.style.width = '0%'; 
                    } else { 
                        progressBar.style.width = progressValue + '%'; 
                    }
                }, PROGRESS_STEP);
            }

            function stopProgress() { 
                if (progressInterval) { 
                    clearInterval(progressInterval);
                    progressInterval = null; 
                } 
            }

            function resetProgress() { 
                if (state.viewMode === 'grid' || isAutoPlayPaused) return;
                stopProgress();
                progressValue = 100;
                progressBar.style.width = '100%';
                startProgress(); 
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // THEME
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            function toggleTheme() {
                if (state.theme === 'dark') {
                    state.theme = 'light';
                } else if (state.theme === 'light') {
                    state.theme = 'ultra-dark';
                } else {
                    state.theme = 'dark';
                }
                applyTheme();
                setStorage(STORAGE_KEYS.THEME, state.theme);
                showToast(`Tema: ${state.theme === 'dark' ? 'Gelap 🌙' : state.theme === 'light' ? 'Terang ☀️' : 'Ultra Gelap 🌑'}`, 'info');
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', state.theme);
                const icon = themeToggle.querySelector('i');
                if (state.theme === 'dark') icon.className = 'fas fa-moon';
                else if (state.theme === 'light') icon.className = 'fas fa-sun';
                else icon.className = 'fas fa-moon';
                themeToggle.setAttribute('aria-label', `Tema saat ini: ${state.theme}. Klik untuk ganti.`);
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // TOAST, RESET & SYNC
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            let toastTimeout = null;

            function showToast(msg, type = 'info') {
                const icons = {
                    'success': 'fa-check-circle',
                    'error': 'fa-exclamation-circle',
                    'info': 'fa-info-circle'
                };
                toastMsg.textContent = msg;
                toastIcon.className = 'fas ' + (icons[type] || icons.info);
                toastEl.className = 'toast ' + type;
                toastEl.classList.add('show');
                
                if (toastTimeout) clearTimeout(toastTimeout);
                const duration = type === 'error' ? 4000 : 2500;
                toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
            }

            function showSyncBadge() {
                syncBadge.classList.add('show');
                if (syncBadgeTimeout) clearTimeout(syncBadgeTimeout);
                syncBadgeTimeout = setTimeout(() => {
                    syncBadge.classList.remove('show');
                }, 3000);
            }

            async function resetAll() {
                const confirmed = await showConfirm(
                    'Reset Semua Filter',
                    'Ini akan menghapus filter, pencarian, dan mengembalikan tampilan ke awal. Lanjutkan?'
                );
                if (!confirmed) return;
                
                state.filterTag = 'Semua';
                state.searchQuery = '';
                searchInput.value = '';
                clearSearchBtn.classList.remove('visible');
                state.currentIndex = 0;
                render();
                if (state.viewMode === 'carousel') {
                    setTimeout(() => { 
                        updateCarousel(false);
                        if (!isAutoPlayPaused) startAutoPlay(); 
                    }, 50);
                }
                showToast('Filter & pencarian direset ✅', 'success');
            }

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // EASTER EGG
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            let titleClickCount = 0;
            let titleClickTimeout = null;
            $('#mainTitle').addEventListener('click', () => {
                titleClickCount++;
                if (titleClickTimeout) clearTimeout(titleClickTimeout);
                titleClickTimeout = setTimeout(() => { titleClickCount = 0; }, 2000);
                
                if (titleClickCount >= 5) {
                    titleClickCount = 0;
                    // Confetti sederhana
                    showToast('🎉 Easter egg ditemukan! 🎉', 'success');
                    createConfetti();
                }
            });

            function createConfetti() {
                const colors = ['#ffd700', '#ff6b6b', '#00c6ff', '#00ff88', '#f7971e', '#6a11cb'];
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.style.cssText = `
                            position: fixed;
                            top: -10px;
                            left: ${Math.random() * 100}%;
                            width: 10px;
                            height: 10px;
                            background: ${colors[Math.floor(Math.random() * colors.length)]};
                            z-index: 9999;
                            pointer-events: none;
                            border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                            animation: confettiFall ${1 + Math.random() * 2}s ease-in forwards;
                        `;
                        document.body.appendChild(confetti);
                        setTimeout(() => confetti.remove(), 3000);
                    }, i * 30);
                }
            }

            // Add confetti animation style
            const confettiStyle = document.createElement('style');
            confettiStyle.textContent = `
                @keyframes confettiFall {
                    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                    100% { transform: translateY(100vh) rotate(${360 + Math.random() * 720}deg); opacity: 0; }
                }
            `;
            document.head.appendChild(confettiStyle);

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // EVENT BINDING
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            prevBtn.addEventListener('click', () => { 
                prevSlide(); 
                if (state.viewMode === 'carousel') resetProgress(); 
            });
            nextBtn.addEventListener('click', () => { 
                nextSlide(); 
                if (state.viewMode === 'carousel') resetProgress(); 
            });
            
            searchInput.addEventListener('input', function() {
                state.searchQuery = this.value;
                state.currentIndex = 0;
                clearSearchBtn.classList.toggle('visible', this.value.length > 0);
                render();
                if (state.viewMode === 'carousel') resetProgress();
            });
            
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                state.searchQuery = '';
                state.currentIndex = 0;
                clearSearchBtn.classList.remove('visible');
                render();
                if (state.viewMode === 'carousel') resetProgress();
                searchInput.focus();
            });
            
            themeToggle.addEventListener('click', toggleTheme);
            
            viewToggle.addEventListener('click', function() {
                state.viewMode = state.viewMode === 'carousel' ? 'grid' : 'carousel';
                updateViewMode();
                render();
                if (state.viewMode === 'carousel') {
                    setTimeout(() => { 
                        updateCarousel(false);
                        if (!isAutoPlayPaused) startAutoPlay(); 
                    }, 100);
                }
                showToast(state.viewMode === 'grid' ? 'Mode Grid aktif 📱' : 'Mode Carousel aktif 🎠', 'info');
            });
            
            pauseBtn.addEventListener('click', toggleAutoPlay);
            resetBtn.addEventListener('click', resetAll);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Don't trigger shortcuts when typing in input
                if (e.target.tagName === 'INPUT' && e.key !== 'Escape') return;
                
                if (e.key === 'ArrowRight' && state.viewMode === 'carousel') { 
                    e.preventDefault();
                    nextSlide(); 
                    resetProgress(); 
                }
                if (e.key === 'ArrowLeft' && state.viewMode === 'carousel') { 
                    e.preventDefault();
                    prevSlide(); 
                    resetProgress(); 
                }
                if (e.key === 'f' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'g' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    viewToggle.click();
                }
                if (e.key === 't' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    toggleTheme();
                }
                if (e.key === ' ' && state.viewMode === 'carousel') {
                    e.preventDefault();
                    toggleAutoPlay();
                }
                if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    showToast('Shortcut: ← → navigasi, F=cari, G=mode, T=tema, Spasi=pause, Ctrl+R=reset, ?=bantuan', 'info');
                }
                if (e.key === 'r' && e.ctrlKey) {
                    e.preventDefault();
                    resetAll();
                }
            });

            // Pause on hover
            wrapper.addEventListener('mouseenter', () => { 
                if (state.viewMode === 'carousel' && !isAutoPlayPaused) { 
                    stopAutoPlay(); 
                    stopProgress(); 
                } 
            });
            wrapper.addEventListener('mouseleave', () => { 
                if (state.viewMode === 'carousel' && !isAutoPlayPaused) { 
                    startAutoPlay(); 
                } 
            });

            // Touch swipe dengan momentum
            let touchStart = 0,
                touchEnd = 0,
                touchStartTime = 0,
                isSwiping = false;
            wrapper.addEventListener('touchstart', (e) => { 
                touchStart = e.changedTouches[0].screenX; 
                touchStartTime = Date.now();
                isSwiping = true; 
            }, { passive: true });
            wrapper.addEventListener('touchmove', (e) => { 
                if (!isSwiping) return;
                touchEnd = e.changedTouches[0].screenX; 
            }, { passive: true });
            wrapper.addEventListener('touchend', (e) => {
                if (!isSwiping || state.viewMode === 'grid') return;
                isSwiping = false;
                const diff = touchStart - touchEnd;
                const duration = Date.now() - touchStartTime;
                const velocity = Math.abs(diff) / duration;
                
                // Swipe dengan kecepatan > 0.3 atau jarak > 50px
                if (Math.abs(diff) > 50 || velocity > 0.3) {
                    if (diff > 0) { 
                        nextSlide(); 
                        resetProgress(); 
                    } else { 
                        prevSlide(); 
                        resetProgress(); 
                    }
                }
                touchStart = 0;
                touchEnd = 0;
            }, { passive: true });

            // Reload data saat halaman difokuskan kembali
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    reloadData();
                }
            });

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // PARTIKEL CANVAS (OPTIMIZED)
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            let animationId = null;

            function resizeParticles() { 
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight; 
            }
            window.addEventListener('resize', resizeParticles);
            resizeParticles();

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.3;
                    this.speedY = (Math.random() - 0.5) * 0.3;
                    this.opacity = Math.random() * 0.4 + 0.05;
                }
                update() { 
                    this.x += this.speedX;
                    this.y += this.speedY; 
                    if (this.x < 0 || this.x > w) this.speedX *= -1; 
                    if (this.y < 0 || this.y > h) this.speedY *= -1; 
                }
                draw() { 
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${this.opacity})`;
                    ctx.fill(); 
                }
            }

            function initParticles(count = 60) { 
                particles = []; 
                for (let i = 0; i < count; i++) particles.push(new Particle()); 
            }
            initParticles();

            function animateParticles() { 
                if (document.hidden) {
                    animationId = requestAnimationFrame(animateParticles);
                    return;
                }
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                animationId = requestAnimationFrame(animateParticles); 
            }
            animateParticles();

            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            // INIT
            // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            async function init() {
                loadState();
                applyTheme();
                
                // Set initial autoplay state
                isAutoPlayPaused = state.autoplayPaused;

                // Load data from API
                await loadDataFromAPI();

                // Set view mode after data loaded
                render();

                if (state.viewMode === 'carousel') {
                    setTimeout(() => {
                        updateCarousel(false);
                        if (!isAutoPlayPaused) startAutoPlay();
                    }, 100);
                }

                // Show sync badge briefly
                setTimeout(() => {
                    syncBadge.classList.add('show');
                    setTimeout(() => syncBadge.classList.remove('show'), 2000);
                }, 500);

                // Update clear search button visibility
                clearSearchBtn.classList.toggle('visible', searchInput.value.length > 0);

                console.log('📱 SIM Upload v4.0 - Advanced Features');
                console.log('🔗 GAS URL:', GAS_URL);
                console.log('📊 Total layanan:', APP_DATA.length);
                console.log('⌨️ Tekan ? untuk melihat shortcut keyboard');
                console.log('🎨 Klik judul 5x untuk easter egg');
            }

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

            let resizeTimer;
            window.addEventListener('resize', () => {
                if (state.viewMode === 'carousel') {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => { 
                        updateCarousel(false);
                        resetProgress(); 
                    }, 200);
                }
            });

        })();
    </script>

</body>
</html>
