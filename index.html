<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 PDF Flip Book - Two Page Spread</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #d4c8b8;
      --accent: #c9a87c;
      --page-color: #faf6ef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    .app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ===== LIBRARY ===== */
    .library {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1a1410 0%, #0a0a0a 50%, #1a1410 100%);
      display: flex;
      flex-direction: column;
      padding: 0;
      transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }

    .library.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    .lib-header {
      text-align: center;
      padding: 25px 20px 15px;
      flex-shrink: 0;
    }

    .lib-header h1 {
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      color: var(--text);
      letter-spacing: 2px;
      font-weight: 400;
    }

    .lib-header p {
      color: #6b5e4e;
      font-size: 0.75rem;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      padding: 10px 18px 25px;
      align-content: start;
    }

    .book-list::-webkit-scrollbar { width: 4px; }
    .book-list::-webkit-scrollbar-track { background: transparent; }
    .book-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .book-item {
      background: linear-gradient(160deg, #1e1e1e 0%, #151515 100%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 18px 14px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .book-item:hover {
      border-color: rgba(201,168,124,0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .book-item:active { transform: scale(0.96); }

    .book-item .icon { font-size: 2.2rem; }

    .book-item .title {
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-item .fid {
      color: #4a3f35;
      font-size: 0.6rem;
      font-family: monospace;
    }

    /* ===== READER ===== */
    .reader {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }

    .reader.active { transform: translateX(0); }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      padding: 8px 15px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .book-title-top {
      flex: 1;
      color: var(--text);
      font-size: 0.82rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-info-top {
      color: #6b5e4e;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    /* ===== BOOK AREA - TWO PAGE SPREAD ===== */
    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2500px;
      overflow: hidden;
      padding: 20px;
    }

    .book-shadow {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Container untuk dua halaman */
    .book-spread {
      width: 100%;
      height: 100%;
      max-width: 1100px;
      max-height: 800px;
      display: flex;
      position: relative;
      z-index: 5;
    }

    /* Halaman Kiri */
    .page-left {
      width: 50%;
      height: 100%;
      position: relative;
      perspective: 2000px;
    }

    /* Halaman Kanan */
    .page-right {
      width: 50%;
      height: 100%;
      position: relative;
      perspective: 2000px;
    }

    /* Stack efek */
    .stack-left, .stack-right {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #252015;
      pointer-events: none;
    }

    .stack-left {
      border-radius: 8px 0 0 8px;
    }

    .stack-right {
      border-radius: 0 8px 8px 0;
    }

    .stack-left:nth-child(1) { transform: translateX(2px); z-index: 1; opacity: 0.7; }
    .stack-left:nth-child(2) { transform: translateX(5px); z-index: 0; opacity: 0.5; }
    .stack-left:nth-child(3) { transform: translateX(8px); z-index: -1; opacity: 0.3; }

    .stack-right:nth-child(1) { transform: translateX(-2px); z-index: 1; opacity: 0.7; }
    .stack-right:nth-child(2) { transform: translateX(-5px); z-index: 0; opacity: 0.5; }
    .stack-right:nth-child(3) { transform: translateX(-8px); z-index: -1; opacity: 0.3; }

    /* Page flip container */
    .page-flip {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
      transform-origin: right center;
      border-radius: 0 8px 8px 0;
    }

    .page-flip.flip-next {
      transform: rotateY(-180deg);
      z-index: 15;
    }

    /* Page back */
    .page-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, #e8dcc8, #d8ccb0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
      box-shadow: inset -2px 0 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .page-back-content {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Page front */
    .page-front {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-front-right {
      background: var(--page-color);
      border-radius: 0 8px 8px 0;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    .page-front-left {
      background: var(--page-color);
      border-radius: 8px 0 0 8px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    /* PDF Content */
    .pdf-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 15px;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(139,90,43,0.015) 29px, rgba(139,90,43,0.015) 30px);
    }

    .pdf-canvas-left, .pdf-canvas-right {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      border-radius: 2px;
      background: #fff;
      object-fit: contain;
    }

    /* Page number */
    .page-num {
      text-align: center;
      padding: 6px;
      font-size: 0.65rem;
      color: #999;
      border-top: 1px solid rgba(0,0,0,0.04);
      flex-shrink: 0;
      font-style: italic;
    }

    /* Spine */
    .spine {
      position: absolute;
      left: 50%;
      top: 1%;
      bottom: 1%;
      width: 4px;
      background: linear-gradient(to right, 
        rgba(0,0,0,0.4), 
        rgba(0,0,0,0.6) 30%,
        rgba(80,60,40,0.3) 50%,
        rgba(0,0,0,0.5) 70%,
        rgba(0,0,0,0.3)
      );
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
      border-radius: 2px;
      box-shadow: 
        1px 0 3px rgba(0,0,0,0.3),
        -1px 0 3px rgba(0,0,0,0.2);
    }

    /* Page curl */
    .page-curl-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 35px;
      height: 35px;
      pointer-events: none;
      z-index: 5;
    }

    .page-curl-right::before {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 25px 25px;
      border-color: transparent transparent #e5d5c0 transparent;
      filter: drop-shadow(-2px -2px 3px rgba(0,0,0,0.08));
    }

    .page-curl-left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 35px;
      height: 35px;
      pointer-events: none;
      z-index: 5;
    }

    .page-curl-left::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 25px 25px 0;
      border-color: transparent #e5d5c0 transparent transparent;
      filter: drop-shadow(2px -2px 3px rgba(0,0,0,0.08));
    }

    /* Loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spin-book {
      display: flex;
      gap: 3px;
    }

    .spin-book span {
      width: 7px;
      height: 28px;
      background: var(--accent);
      border-radius: 2px;
      animation: spinPg 1.2s infinite;
      transform-origin: left center;
    }
    .spin-book span:nth-child(2) { animation-delay: 0.2s; }
    .spin-book span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spinPg {
      0%, 100% { transform: rotateY(0); opacity: 1; }
      50% { transform: rotateY(-180deg); opacity: 0.25; }
    }

    .loading-text {
      color: #8a7a6a;
      margin-top: 12px;
      font-size: 0.78rem;
      letter-spacing: 2px;
    }

    /* Bottom bar */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(201,168,124,0.2);
    }

    .nav-btn:active:not(:disabled) { transform: scale(0.9); }

    .nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .page-indicator {
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      min-width: 100px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      padding: 6px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Error */
    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
      color: #c0392b;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .book-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 8px 12px 20px;
      }

      .book-item {
        padding: 14px 10px;
      }

      .book-item .icon { font-size: 1.8rem; }

      .book-item .title { font-size: 0.72rem; }

      .book-area { padding: 10px; }

      .pdf-content { padding: 8px; }

      .topbar { padding: 6px 10px; }

      .bottombar { padding: 8px 12px; gap: 10px; }

      .nav-btn { width: 36px; height: 36px; font-size: 0.9rem; }

      .page-indicator { font-size: 0.78rem; min-width: 80px; padding: 5px 10px; }

      .spine { width: 2px; }

      .book-spread {
        max-height: 600px;
      }
    }

    @media (max-width: 480px) {
      .book-list {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .book-area { padding: 5px; }

      .pdf-content { padding: 5px; }

      .page-num { font-size: 0.6rem; padding: 4px; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .topbar { padding: 4px 8px; }
      .bottombar { padding: 4px 8px; }
      .book-area { padding: 5px; }
      .pdf-content { padding: 5px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== LIBRARY ===== -->
    <div class="library" id="library">
      <div class="lib-header">
        <h1>📚 Digital Library</h1>
        <p>Two-Page Spread Flip Book</p>
      </div>
      <div class="book-list" id="bookList">
        <div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:50px;color:#6b5e4e;">
          <div class="spin-book"><span></span><span></span><span></span></div>
          <div class="loading-text">Loading books...</div>
        </div>
      </div>
    </div>

    <!-- ===== READER ===== -->
    <div class="reader" id="reader">
      <!-- Top Bar -->
      <div class="topbar">
        <button class="btn-back" id="btnBack">← Library</button>
        <div class="book-title-top" id="bookTitleTop">Select a book</div>
        <div class="page-info-top" id="pageInfoTop">Spread 1</div>
      </div>

      <!-- Book Area -->
      <div class="book-area">
        <div class="book-shadow"></div>
        
        <div class="book-spread" id="bookSpread">
          <!-- LEFT PAGE -->
          <div class="page-left" id="pageLeft">
            <div class="stack-left"></div>
            <div class="stack-left"></div>
            <div class="stack-left"></div>
            
            <div class="page-front page-front-left" style="position:absolute;inset:0;border-radius:8px 0 0 8px;">
              <div class="pdf-content" id="pdfContentLeft">
                <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
              </div>
              <div class="page-num" id="pageNumLeft">— Page 1 —</div>
              <div class="page-curl-left"></div>
            </div>
          </div>

          <!-- RIGHT PAGE (with flip) -->
          <div class="page-right" id="pageRight">
            <div class="stack-right"></div>
            <div class="stack-right"></div>
            <div class="stack-right"></div>
            
            <div class="page-flip" id="pageFlipRight">
              <!-- Back of flipping page -->
              <div class="page-back" id="pageBackRight">
                <div class="page-back-content">
                  <canvas class="pdf-canvas-right" id="pdfCanvasBack"></canvas>
                </div>
              </div>
              
              <!-- Front of right page -->
              <div class="page-front page-front-right" id="pageFrontRight">
                <div class="pdf-content" id="pdfContentRight">
                  <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                </div>
                <div class="page-num" id="pageNumRight">— Page 2 —</div>
                <div class="page-curl-right"></div>
              </div>
            </div>
          </div>

          <!-- Spine -->
          <div class="spine"></div>
        </div>

        <!-- Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spin-book"><span></span><span></span><span></span></div>
          <div class="loading-text">Opening PDF...</div>
        </div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottombar">
        <button class="nav-btn" id="btnPrev" disabled>◀</button>
        <span class="page-indicator" id="pageIndicator">1-2 / 0</span>
        <button class="nav-btn" id="btnNext" disabled>▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================
      // CONFIG
      // ============================================
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // ============================================
      // STATE
      // ============================================
      let books = [];
      let currentBook = null;
      let pdfDoc = null;
      let totalPages = 0;
      let currentSpread = 0;
      let totalSpreads = 0;
      let isFlipping = false;
      let isRendering = false;

      // ============================================
      // DOM
      // ============================================
      const $ = (id) => document.getElementById(id);
      
      const library = $('library');
      const bookList = $('bookList');
      const reader = $('reader');
      const pageFlipRight = $('pageFlipRight');
      const pageFrontRight = $('pageFrontRight');
      const pdfContentLeft = $('pdfContentLeft');
      const pdfContentRight = $('pdfContentRight');
      const pdfCanvasLeft = $('pdfCanvasLeft');
      const pdfCanvasRight = $('pdfCanvasRight');
      const pdfCanvasBack = $('pdfCanvasBack');
      const pageNumLeft = $('pageNumLeft');
      const pageNumRight = $('pageNumRight');
      const loadingOverlay = $('loadingOverlay');
      const pageIndicator = $('pageIndicator');
      const pageInfoTop = $('pageInfoTop');
      const bookTitleTop = $('bookTitleTop');
      const btnPrev = $('btnPrev');
      const btnNext = $('btnNext');
      const btnBack = $('btnBack');

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks() {
        try {
          const response = await fetch(WEBAPP_URL);
          const data = await response.json();
          
          if (data.success && data.books && data.books.length > 0) {
            books = data.books;
          } else {
            books = [{
              title: '📄 Sample PDF Document',
              fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
            }];
          }
        } catch (error) {
          console.warn('Using default book');
          books = [{
            title: '📄 Sample PDF Document',
            fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
          }];
        }
        renderLibrary();
      }

      function renderLibrary() {
        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        
        bookList.innerHTML = books.map((book, i) => `
          <div class="book-item" onclick="openBook(${i})">
            <div class="icon">${icons[i % icons.length]}</div>
            <div class="title">${escHtml(book.title)}</div>
            <div class="fid">${(book.fileId || '').substring(0, 10)}...</div>
          </div>
        `).join('');
      }

      // ============================================
      // OPEN BOOK
      // ============================================
      async function openBook(index) {
        currentBook = books[index];
        bookTitleTop.textContent = currentBook.title;
        
        pdfDoc = null;
        totalPages = 0;
        currentSpread = 0;
        totalSpreads = 0;
        isFlipping = false;
        
        reader.classList.add('active');
        
        // Reset flip
        pageFlipRight.style.transition = 'none';
        pageFlipRight.style.transform = 'rotateY(0deg)';
        pageFlipRight.classList.remove('flip-next');
        
        updateUI();
        showLoading(true);
        
        try {
          await loadPDF(currentBook.fileId);
        } catch (err) {
          console.error('PDF load error:', err);
          showFallback(currentBook.fileId);
        }
      }

      // ============================================
      // LOAD PDF
      // ============================================
      async function loadPDF(fileId) {
        const urls = [
          `https://drive.google.com/uc?export=download&id=${fileId}`,
          `https://drive.google.com/uc?id=${fileId}&export=download`,
        ];
        
        for (const url of urls) {
          try {
            const loadingTask = pdfjsLib.getDocument({
              url: url,
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              withCredentials: false,
            });
            
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            totalSpreads = Math.ceil(totalPages / 2);
            currentSpread = 0;
            
            await renderSpread(0);
            showLoading(false);
            updateUI();
            return;
          } catch (e) {
            console.warn('Failed URL:', url);
          }
        }
        
        throw new Error('All URLs failed');
      }

      // ============================================
      // RENDER SPREAD (Two Pages)
      // ============================================
      async function renderSpread(spreadIndex) {
        if (!pdfDoc) return;
        
        isRendering = true;
        
        const leftPageNum = spreadIndex * 2 + 1;
        const rightPageNum = leftPageNum + 1;
        
        // Render left page
        if (leftPageNum <= totalPages) {
          await renderPageToCanvas(leftPageNum, pdfCanvasLeft);
          pageNumLeft.textContent = `— Page ${leftPageNum} —`;
        } else {
          clearCanvas(pdfCanvasLeft);
          pageNumLeft.textContent = '';
        }
        
        // Render right page
        if (rightPageNum <= totalPages) {
          await renderPageToCanvas(rightPageNum, pdfCanvasRight);
          pageNumRight.textContent = `— Page ${rightPageNum} —`;
        } else {
          clearCanvas(pdfCanvasRight);
          pageNumRight.textContent = '';
        }
        
        // Update info
        const displayLeft = leftPageNum <= totalPages ? leftPageNum : totalPages;
        const displayRight = rightPageNum <= totalPages ? rightPageNum : totalPages;
        
        pageIndicator.textContent = `${displayLeft}-${displayRight} / ${totalPages}`;
        pageInfoTop.textContent = `Spread ${spreadIndex + 1} of ${totalSpreads}`;
        
        isRendering = false;
      }

      async function renderPageToCanvas(pageNum, canvas) {
        if (!canvas || pageNum > totalPages) return;
        
        try {
          const page = await pdfDoc.getPage(pageNum);
          
          const parent = canvas.parentElement;
          const containerW = parent.clientWidth - 20;
          const containerH = parent.clientHeight - 20;
          
          const vp = page.getViewport({ scale: 1 });
          const scale = Math.min(containerW / vp.width, containerH / vp.height, 2.5);
          const svp = page.getViewport({ scale });
          
          canvas.height = svp.height;
          canvas.width = svp.width;
          
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          await page.render({
            canvasContext: ctx,
            viewport: svp,
            background: '#ffffff',
          }).promise;
          
        } catch (err) {
          console.error('Render page error:', err);
          clearCanvas(canvas);
        }
      }

      function clearCanvas(canvas) {
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = 1;
        canvas.height = 1;
        ctx.clearRect(0, 0, 1, 1);
      }

      // ============================================
      // FLIP ANIMATION (Right page flips left)
      // ============================================
      async function flipNext() {
        if (isFlipping || isRendering || currentSpread >= totalSpreads - 1) return;
        
        isFlipping = true;
        disableNav();
        
        // Render next spread's back page on the back canvas
        const nextLeftPage = (currentSpread + 1) * 2 + 1;
        if (nextLeftPage <= totalPages) {
          await renderPageToCanvas(nextLeftPage, pdfCanvasBack);
        }
        
        // Animate: right page flips to left (rotateY -180deg)
        pageFlipRight.style.transition = 'transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageFlipRight.style.transform = 'rotateY(-180deg)';
        pageFlipRight.classList.add('flip-next');
        
        await sleep(700);
        
        // Update spread
        currentSpread++;
        
        // Reset flip instantly
        pageFlipRight.style.transition = 'none';
        pageFlipRight.style.transform = 'rotateY(0deg)';
        pageFlipRight.classList.remove('flip-next');
        
        // Render new spread
        await renderSpread(currentSpread);
        
        await sleep(50);
        pageFlipRight.style.transition = 'transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        updateUI();
        isFlipping = false;
      }

      async function flipPrev() {
        if (isFlipping || isRendering || currentSpread <= 0) return;
        
        isFlipping = true;
        disableNav();
        
        // Render previous spread's right page on back canvas
        const prevRightPage = currentSpread * 2;
        if (prevRightPage <= totalPages) {
          await renderPageToCanvas(prevRightPage, pdfCanvasBack);
        }
        
        // Set to flipped position
        pageFlipRight.style.transition = 'none';
        pageFlipRight.style.transform = 'rotateY(-180deg)';
        pageFlipRight.classList.add('flip-next');
        
        // Update spread
        currentSpread--;
        await renderSpread(currentSpread);
        
        await sleep(50);
        
        // Animate back to normal
        pageFlipRight.style.transition = 'transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageFlipRight.style.transform = 'rotateY(0deg)';
        
        await sleep(700);
        
        pageFlipRight.classList.remove('flip-next');
        updateUI();
        isFlipping = false;
      }

      function updateUI() {
        btnPrev.disabled = currentSpread <= 0 || isFlipping;
        btnNext.disabled = currentSpread >= totalSpreads - 1 || isFlipping;
        
        const leftP = currentSpread * 2 + 1;
        const rightP = Math.min(leftP + 1, totalPages);
        pageIndicator.textContent = `${leftP}-${rightP} / ${totalPages}`;
      }

      function disableNav() {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }

      function showFallback(fileId) {
        showLoading(false);
        pdfContentLeft.innerHTML = '';
        pdfContentRight.innerHTML = `
          <iframe 
            src="https://drive.google.com/file/d/${fileId}/preview"
            style="width:100%;height:100%;border:none;border-radius:4px;"
            allow="autoplay"
          ></iframe>`;
        totalPages = 1;
        totalSpreads = 1;
        currentSpread = 0;
        pageNumLeft.textContent = '';
        pageNumRight.textContent = '— PDF Viewer —';
        updateUI();
      }

      function showLoading(show) {
        loadingOverlay.classList.toggle('hidden', !show);
      }

      function goBack() {
        reader.classList.remove('active');
        pdfDoc = null;
        currentBook = null;
        pageFlipRight.style.transition = 'none';
        pageFlipRight.style.transform = 'rotateY(0deg)';
        pageFlipRight.classList.remove('flip-next');
      }

      function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
      }

      function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      }

      // ============================================
      // EVENTS
      // ============================================
      btnPrev.addEventListener('click', flipPrev);
      btnNext.addEventListener('click', flipNext);
      btnBack.addEventListener('click', goBack);

      document.addEventListener('keydown', (e) => {
        if (!currentBook || isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault(); flipNext();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault(); flipPrev();
        } else if (e.key === 'Escape') {
          goBack();
        }
      });

      // Touch
      let tx = 0, ty = 0;
      document.addEventListener('touchstart', (e) => {
        if (!currentBook || isFlipping) return;
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!currentBook || isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        const dy = ty - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
          dx > 0 ? flipNext() : flipPrev();
        }
        tx = 0;
      });

      // Click edges on right page
      pageFrontRight.addEventListener('click', (e) => {
        if (!currentBook || isFlipping) return;
        const rect = pageFrontRight.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.3) flipPrev();
        else if (x > rect.width * 0.7) flipNext();
      });

      // Resize
      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (pdfDoc && currentBook) renderSpread(currentSpread);
        }, 400);
      });

      // Expose
      window.openBook = openBook;

      // Service Worker
      if ('serviceWorker' in navigator) {
        const sw = new Blob([`
          self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));
        `], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(()=>{});
      }

      // Init
      fetchBooks();
      console.log('✅ Two-Page Spread Flip Book Ready');
    })();
  </script>
</body>
</html>
