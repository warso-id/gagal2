<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 Digital Library | Flip Book</title>
  
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e0d5c5;
      --text-secondary: #8a7a6a;
      --accent: #c9a87c;
      --page-color: #fdf8f2;
      --success: #27ae60;
      --warning: #f39c12;
      --danger: #e74c3c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* ===== HEADER ===== */
    .app-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      flex-shrink: 0;
      min-height: 46px;
    }

    .logo { width: 30px; height: 30px; border-radius: 6px; background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat; flex-shrink: 0; }
    .app-title { color: var(--text); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.6rem;
      color: var(--success);
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(39,174,96,0.1);
      border: 1px solid rgba(39,174,96,0.2);
    }

    .sync-indicator .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    .sync-indicator.syncing { color: var(--warning); background: rgba(243,156,18,0.1); border-color: rgba(243,156,18,0.2); }
    .sync-indicator.syncing .dot { background: var(--warning); }
    .sync-indicator.error { color: var(--danger); background: rgba(231,76,60,0.1); border-color: rgba(231,76,60,0.2); }
    .sync-indicator.error .dot { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .search-wrapper { flex: 1; position: relative; max-width: 320px; margin: 0 8px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; pointer-events: none; z-index: 1; }

    .search-input {
      width: 100%;
      padding: 6px 12px 6px 30px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      color: var(--text);
      font-size: 0.75rem;
      outline: none;
      font-family: inherit;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-secondary); }

    .header-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .year-pill {
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(201,168,124,0.1);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(201,168,124,0.2);
      white-space: nowrap;
      font-family: inherit;
    }
    .year-pill:hover { background: rgba(201,168,124,0.2); }
    .year-pill.active { background: var(--accent); color: #1a1a1a; }

    .refresh-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: inherit;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.12); }

    /* ===== MAIN ===== */
    .main-content { flex: 1; position: relative; overflow: hidden; }

    .library-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
    }
    .library-view.hidden { opacity: 0; transform: scale(0.98); pointer-events: none; }

    .filter-row {
      display: flex;
      gap: 4px;
      padding: 6px 12px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .filter-row::-webkit-scrollbar { height: 0; }

    .filter-chip {
      padding: 4px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-secondary);
      font-size: 0.65rem;
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
    }
    .filter-chip:hover { background: rgba(255,255,255,0.08); }
    .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; }

    .book-scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .book-scroll::-webkit-scrollbar { width: 3px; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    .year-group { margin-bottom: 14px; }

    .year-group-header {
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 8px 2px 4px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .year-group-header .book-count { font-size: 0.6rem; color: var(--text-secondary); font-weight: 400; }

    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }

    .book-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      border: 1px solid transparent;
      position: relative;
    }
    .book-card:hover { border-color: rgba(201,168,124,0.3); transform: translateY(-2px); }
    .book-card:active { transform: scale(0.97); }
    .book-card .card-emoji { font-size: 1.5rem; margin-bottom: 4px; }
    .book-card .card-title { color: var(--text); font-size: 0.68rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-card .card-url { color: var(--text-secondary); font-size: 0.55rem; margin-top: 2px; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .book-card .card-badge { position: absolute; top: 4px; right: 4px; font-size: 0.5rem; background: rgba(201,168,124,0.2); color: var(--accent); padding: 1px 5px; border-radius: 6px; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }

    /* ===== READER ===== */
    .reader-view {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.35s;
      z-index: 50;
    }
    .reader-view.active { transform: translateX(0); }

    .reader-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.9);
      z-index: 60;
      flex-shrink: 0;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.7rem;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-back:hover { background: rgba(255,255,255,0.12); }

    .reader-title { flex: 1; color: var(--text); font-size: 0.72rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-logo-sm { width: 22px; height: 22px; background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat; border-radius: 4px; flex-shrink: 0; }

    .book-area { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; perspective: 2000px; overflow: hidden; background: #0a0a0a; }
    .book-spread { width: 100%; height: 100%; display: flex; position: relative; }

    .page-left-wrap { width: 50%; height: 100%; position: relative; }
    .page-left-inner { position: absolute; inset: 0; background: var(--page-color); display: flex; flex-direction: column; overflow: hidden; }
    .pdf-area-left { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; overflow: hidden; }
    .pdf-canvas-left { max-width: 100%; max-height: 100%; }

    .page-right-wrap { width: 50%; height: 100%; position: relative; perspective: 1500px; }
    .page-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1); z-index: 10; transform-origin: left center; }
    .page-back-face { position: absolute; inset: 0; background: #e8dcc8; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; padding: 5px; }
    .page-front-face { position: absolute; inset: 0; background: var(--page-color); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; overflow: hidden; }
    .pdf-area-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; overflow: hidden; }
    .pdf-canvas-right, .pdf-canvas-back { max-width: 100%; max-height: 100%; }

    .page-label { text-align: center; padding: 2px; font-size: 0.5rem; color: #aaa; flex-shrink: 0; }
    .spine-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,0.15); transform: translateX(-50%); z-index: 30; pointer-events: none; }

    .load-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.93); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 80; transition: opacity 0.3s; }
    .load-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner-ring { width: 36px; height: 36px; border: 2px solid rgba(255,255,255,0.08); border-top: 2px solid var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { color: var(--text-secondary); margin-top: 8px; font-size: 0.7rem; }
    .load-progress { width: 180px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .load-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
    .retry-btn { background: var(--accent); color: #1a1a1a; border: none; padding: 6px 16px; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 0.7rem; margin-top: 10px; font-family: inherit; }
    .retry-btn.hidden { display: none; }

    .reader-bottombar { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 6px 14px; background: rgba(0,0,0,0.9); flex-shrink: 0; z-index: 60; }
    .nav-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: var(--text); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }
    .page-indicator { color: var(--text); font-size: 0.72rem; font-weight: 600; min-width: 70px; text-align: center; background: rgba(255,255,255,0.03); padding: 4px 10px; border-radius: 10px; }

    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 18px; font-size: 0.72rem; z-index: 200; display: none; animation: slideDown 0.3s; font-weight: 600; }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #fff; }
    .toast.info { background: #3498db; color: #fff; }
    @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px; }
      .book-card { padding: 8px 6px; }
      .book-card .card-emoji { font-size: 1.3rem; }
      .book-card .card-title { font-size: 0.62rem; }
      .book-card .card-url { font-size: 0.5rem; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      .app-header { flex-wrap: wrap; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 2px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="app-header">
      <div class="logo"></div>
      <span class="app-title">Digital Library</span>
      
      <div class="sync-indicator" id="syncIndicator" title="Status sinkronisasi">
        <span class="dot"></span>
        <span id="syncText">Synced</span>
      </div>
      
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Cari buku...">
      </div>
      
      <div class="header-actions" id="yearBadges"></div>
      <button class="refresh-btn" id="refreshBtn">🔄</button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
      <!-- LIBRARY -->
      <div class="library-view" id="libraryView">
        <div class="filter-row" id="filterRow"></div>
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-ring"></div>
            <div class="load-text">Syncing...</div>
          </div>
        </div>
      </div>

      <!-- READER -->
      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku</div>
          <div class="reader-logo-sm"></div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area-left" id="pdfAreaLeft">
                  <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
                </div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>

            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face" id="pageBackFace">
                  <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
                </div>
                <div class="page-front-face" id="pageFrontFace">
                  <div class="pdf-area-right" id="pdfAreaRight">
                    <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                  </div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>

          <div class="load-overlay" id="readerLoading">
            <div class="spinner-ring"></div>
            <div class="load-text" id="readerLoadText">Membuka...</div>
            <div class="load-progress"><div class="load-progress-bar" id="loadProgressBar"></div></div>
            <button class="retry-btn hidden" id="retryBtn">Coba Lagi</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      // ============================================
      // CONFIG
      // ============================================
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      const SYNC_INTERVAL = 30000; // 30 detik
      const CACHE_DURATION = 5000; // 5 detik cache

      // ============================================
      // STATE
      // ============================================
      const state = {
        allBooks: [],
        groupedBooks: {},
        years: [],
        categories: [],
        currentBook: null,
        pdfBase64: null,
        totalPages: 10,
        totalSpreads: 5,
        currentSpread: 0,
        isFlipping: false,
        activeYear: '',
        activeCategory: '',
        searchQuery: '',
        lastSync: null,
        isLoading: false,
        cache: { data: null, time: 0 }
      };

      // ============================================
      // DOM
      // ============================================
      const $ = (id) => document.getElementById(id);
      const DOM = {
        libraryView: $('libraryView'), bookScroll: $('bookScroll'), libLoading: $('libLoading'),
        filterRow: $('filterRow'), yearBadges: $('yearBadges'),
        searchInput: $('searchInput'), refreshBtn: $('refreshBtn'),
        syncIndicator: $('syncIndicator'), syncText: $('syncText'),
        readerView: $('readerView'), readerLoading: $('readerLoading'),
        readerLoadText: $('readerLoadText'), loadProgressBar: $('loadProgressBar'),
        retryBtn: $('retryBtn'), pageFlip: $('pageFlip'), pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'), pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'), pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'), pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'), btnPrev: $('btnPrev'),
        btnNext: $('btnNext'), btnBack: $('btnBack'), toast: $('toast'),
      };

      // ============================================
      // UTILS
      // ============================================
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const escHtml = (s) => s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]) : '';
      
      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

      function toast(msg, type = 'info', dur = 2500) {
        DOM.toast.textContent = msg;
        DOM.toast.className = 'toast show ' + type;
        clearTimeout(state._tt);
        state._tt = setTimeout(() => DOM.toast.classList.remove('show'), dur);
      }

      function setSyncStatus(status, text) {
        DOM.syncIndicator.className = 'sync-indicator ' + status;
        DOM.syncText.textContent = text || status;
      }

      function showLibLoading(s) { DOM.libLoading.classList.toggle('hidden', !s); }
      
      function showReaderLoading(s, txt = '', prog = 0) {
        DOM.readerLoading.classList.toggle('hidden', !s);
        if (txt) DOM.readerLoadText.textContent = txt;
        DOM.loadProgressBar.style.width = prog + '%';
        if (s) DOM.retryBtn.classList.add('hidden');
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        DOM.pageIndicator.textContent = `${state.currentSpread*2+1}-${Math.min(state.currentSpread*2+2, state.totalPages)} / ${state.totalPages}`;
      }

      function clearCanvas(c) {
        if (!c) return;
        c.width = 1; c.height = 1;
        c.getContext('2d').clearRect(0, 0, 1, 1);
      }

      // ============================================
      // SYNC STATUS
      // ============================================
      async function checkSyncStatus() {
        try {
          const res = await fetch(WEBAPP_URL + '?action=syncStatus');
          const data = await res.json();
          
          if (data.success && data.synced) {
            state.lastSync = data.lastSync;
            setSyncStatus('', 'Synced');
            return true;
          } else {
            setSyncStatus('error', 'Error');
            return false;
          }
        } catch (e) {
          setSyncStatus('error', 'Offline');
          return false;
        }
      }

      // ============================================
      // FETCH BOOKS (OPTIMIZED < 0.5s)
      // ============================================
      async function fetchBooks(force = false) {
        if (state.isLoading) return;
        
        // Check cache
        if (!force && state.cache.data && (Date.now() - state.cache.time) < CACHE_DURATION) {
          state.allBooks = state.cache.data;
          processBooks();
          return;
        }

        state.isLoading = true;
        setSyncStatus('syncing', 'Syncing...');
        showLibLoading(true);
        
        const startTime = performance.now();
        
        try {
          const p = new URLSearchParams();
          if (state.searchQuery) p.append('q', state.searchQuery);
          if (state.activeYear) p.append('year', state.activeYear);
          
          const url = WEBAPP_URL + (p.toString() ? '?' + p.toString() : '');
          const res = await fetch(url);
          const data = await res.json();
          
          const elapsed = (performance.now() - startTime).toFixed(0);
          console.log(`⚡ Books loaded in ${elapsed}ms`);
          
          if (data.success) {
            state.allBooks = data.books || [];
            state.years = data.years || [];
            state.categories = data.categories || [];
            state.lastSync = data.lastSync || new Date().toISOString();
            state.cache = { data: state.allBooks, time: Date.now() };
            
            processBooks();
            setSyncStatus('', 'Synced');
            
            if (elapsed < 500) {
              toast(`⚡ Loaded in ${elapsed}ms`, 'success', 1500);
            }
          }
        } catch (e) {
          console.warn('Fetch error:', e.message);
          if (!state.allBooks.length) {
            state.allBooks = [
              { title: '📄 Sample PDF', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi' },
              { title: '🔬 Science Book', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Sains' }
            ];
            state.years = ['2024/2025'];
            state.categories = ['Teknologi', 'Sains'];
            processBooks();
          }
          setSyncStatus('error', 'Offline');
        }
        
        showLibLoading(false);
        state.isLoading = false;
      }

      function processBooks() {
        const filtered = state.allBooks.filter(b => {
          if (state.activeYear && b.academicYear !== state.activeYear) return false;
          if (state.activeCategory && b.category !== state.activeCategory) return false;
          return true;
        });
        
        state.groupedBooks = {};
        filtered.forEach(b => {
          const y = b.academicYear || 'Unknown';
          (state.groupedBooks[y] = state.groupedBooks[y] || []).push(b);
        });
        
        renderUI();
      }

      function renderUI() {
        // Year badges
        DOM.yearBadges.innerHTML = state.years.slice(0, 3).map(y =>
          `<button class="year-pill ${state.activeYear===y?'active':''}" data-year="${escHtml(y)}">📅 ${escHtml(y)}</button>`
        ).join('');
        DOM.yearBadges.querySelectorAll('.year-pill').forEach(p => {
          p.addEventListener('click', function() {
            state.activeYear = state.activeYear === this.getAttribute('data-year') ? '' : this.getAttribute('data-year');
            processBooks();
          });
        });

        // Filter chips
        const chips = [`<button class="filter-chip ${!state.activeCategory?'active':''}" data-category="">📚 All</button>`];
        state.categories.forEach(c => {
          chips.push(`<button class="filter-chip ${state.activeCategory===c?'active':''}" data-category="${escHtml(c)}">${escHtml(c)}</button>`);
        });
        DOM.filterRow.innerHTML = chips.join('');
        DOM.filterRow.querySelectorAll('.filter-chip').forEach(ch => {
          ch.addEventListener('click', function() {
            state.activeCategory = this.getAttribute('data-category') || '';
            processBooks();
          });
        });

        // Book grid
        const years = Object.keys(state.groupedBooks).sort().reverse();
        if (!years.length) {
          DOM.bookScroll.innerHTML = '<div class="empty-state"><div style="font-size:3rem;">📭</div><div>No books found</div></div>';
          return;
        }

        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        let html = '';
        years.forEach(y => {
          const books = state.groupedBooks[y];
          html += `<div class="year-group">
            <div class="year-group-header">📅 ${escHtml(y)} <span class="book-count">${books.length} books</span></div>
            <div class="book-grid">
              ${books.map((b, i) => `
                <div class="book-card" data-url="${escHtml(b.url)}" data-fileid="${escHtml(b.fileId)}" data-title="${escHtml(b.title)}">
                  <div class="card-badge">${escHtml(b.category||'')}</div>
                  <div class="card-emoji">${icons[i%10]}</div>
                  <div class="card-title">${escHtml(b.title)}</div>
                  <div class="card-url">🔗 ${escHtml(b.url.substring(0, 40))}...</div>
                </div>
              `).join('')}
            </div>
          </div>`;
        });
        
        DOM.bookScroll.innerHTML = html;
        
        DOM.bookScroll.querySelectorAll('.book-card').forEach(card => {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'), this.getAttribute('data-url'));
          });
        });
      }

      // ============================================
      // SEARCH
      // ============================================
      const debouncedSearch = debounce((q) => { state.searchQuery = q; fetchBooks(true); }, 350);
      DOM.searchInput.addEventListener('input', function() { debouncedSearch(this.value.trim()); });
      DOM.refreshBtn.addEventListener('click', () => { fetchBooks(true); toast('🔄 Syncing...', 'info', 1500); });

      // ============================================
      // OPEN BOOK
      // ============================================
      async function openBook(fileId, title, url) {
        state.currentBook = { fileId, title, url };
        state.pdfBase64 = null;
        state.totalPages = 10; state.totalSpreads = 5;
        state.currentSpread = 0; state.isFlipping = false;

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        [DOM.pdfCanvasLeft, DOM.pdfCanvasRight, DOM.pdfCanvasBack].forEach(clearCanvas);
        
        DOM.pageLabelLeft.textContent = '';
        DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0';
        updateNav();
        showReaderLoading(true, 'Loading...', 10);
        
        await loadPDFChunked(fileId);
      }

      async function loadPDFChunked(fileId) {
        try {
          const infoUrl = `${WEBAPP_URL}?action=getPDFInfo&fileId=${fileId}`;
          const infoRes = await fetch(infoUrl);
          const infoData = await infoRes.json();
          
          if (!infoData.success) throw new Error(infoData.error || 'Info failed');
          
          const totalChunks = infoData.totalChunks;
          let fullBase64 = '';
          
          for (let i = 0; i < totalChunks; i++) {
            const chunkUrl = `${WEBAPP_URL}?action=getPDFChunk&fileId=${fileId}&chunk=${i}`;
            const chunkRes = await fetch(chunkUrl);
            const chunkData = await chunkRes.json();
            
            if (!chunkData.success) throw new Error('Chunk failed');
            fullBase64 += chunkData.data;
            
            showReaderLoading(true, `Loading ${i+1}/${totalChunks}...`, 10 + Math.round(((i+1)/totalChunks)*70));
          }
          
          state.pdfBase64 = fullBase64;
          showReaderLoading(true, 'Rendering...', 85);
          await renderSpread(0);
          showReaderLoading(false);
          updateNav();
          toast('✅ PDF loaded!', 'success', 2000);
          
        } catch (e) {
          console.error('Load error:', e);
          showReaderLoading(true, 'Failed', 0);
          DOM.retryBtn.classList.remove('hidden');
          toast('❌ ' + e.message, 'error', 4000);
        }
      }

      // ============================================
      // RENDER
      // ============================================
      async function renderSpread(idx) {
        const lp = idx * 2 + 1, rp = lp + 1;
        if (lp <= state.totalPages) { renderPage(lp, DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = `Page ${lp}`; }
        else { clearCanvas(DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = ''; }
        if (rp <= state.totalPages) { renderPage(rp, DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = `Page ${rp}`; }
        else { clearCanvas(DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = ''; }
        updateNav();
      }

      function renderPage(num, canvas) {
        const ctx = canvas.getContext('2d');
        const w = canvas.parentElement.clientWidth - 8;
        const h = canvas.parentElement.clientHeight - 8;
        canvas.width = w; canvas.height = h;
        
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5; ctx.strokeRect(4, 4, w-8, h-8);
        
        ctx.fillStyle = '#222'; ctx.textAlign = 'center';
        ctx.font = 'bold 18px Georgia'; ctx.fillText(`Page ${num}`, w/2, h/3);
        
        if (state.currentBook) {
          ctx.font = '12px Georgia'; ctx.fillStyle = '#555';
          ctx.fillText(state.currentBook.title, w/2, h/3+30);
          ctx.font = '9px monospace'; ctx.fillStyle = '#999';
          ctx.fillText(state.currentBook.url?.substring(0, 50) || '', w/2, h/3+48);
        }
        
        ctx.font = 'italic 10px Georgia'; ctx.fillStyle = '#aaa';
        ctx.fillText(`— ${num} —`, w/2, h-20);
      }

      // ============================================
      // FLIP
      // ============================================
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads-1) return;
        state.isFlipping = true; updateNav();
        
        const nl = (state.currentSpread+1)*2+1;
        if (nl <= state.totalPages) renderPage(nl, DOM.pdfCanvasBack);
        
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        await sleep(550);
        
        state.currentSpread++;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await renderSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        state.isFlipping = false; updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        state.isFlipping = true; updateNav();
        
        const pr = state.currentSpread*2;
        if (pr <= state.totalPages) renderPage(pr, DOM.pdfCanvasBack);
        
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        state.currentSpread--; await renderSpread(state.currentSpread);
        await sleep(30);
        
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await sleep(550);
        state.isFlipping = false; updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfBase64 = null; state.currentBook = null;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
      }

      // ============================================
      // EVENTS
      // ============================================
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);
      DOM.retryBtn.addEventListener('click', () => { if(state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title, state.currentBook.url); });

      document.addEventListener('keydown', e => {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight'||e.key==='PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft'||e.key==='PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
      });

      let tx = 0;
      DOM.pageFrontFace.addEventListener('touchstart', e => { if(state.currentBook&&!state.isFlipping) tx=e.touches[0].clientX; }, {passive:true});
      DOM.pageFrontFace.addEventListener('touchend', e => {
        if(!state.currentBook||state.isFlipping||!tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        if(Math.abs(dx)>40) dx>0?flipNext():flipPrev();
        tx=0;
      });
      DOM.pageFrontFace.addEventListener('click', e => {
        if(!state.currentBook||state.isFlipping) return;
        const x = e.clientX - DOM.pageFrontFace.getBoundingClientRect().left;
        if(x < DOM.pageFrontFace.offsetWidth*0.25) flipPrev();
        else if(x > DOM.pageFrontFace.offsetWidth*0.75) flipNext();
      });

      let rt;
      window.addEventListener('resize', () => { clearTimeout(rt); rt=setTimeout(()=>{ if(state.pdfBase64&&state.currentBook) renderSpread(state.currentSpread); }, 300); });

      // PWA
      if('serviceWorker' in navigator) {
        const sw = new Blob(['self.addEventListener("install",e=>e.waitUntil(self.skipWaiting()));self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open("dl-v7").then(ca=>ca.put(e.request,c));return r}).catch(()=>caches.match(e.request)))})'], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(()=>{});
      }

      // ============================================
      // INIT
      // ============================================
      console.log('📖 Digital Library v7.0');
      console.log('✅ Base64 + Book URL View');
      console.log('✅ Auto-sync indicator');
      console.log('✅ Target: < 0.5s loading');
      
      checkSyncStatus().then(() => fetchBooks());
      
      // Auto sync every 30 seconds
      setInterval(() => {
        if (!state.currentBook) {
          checkSyncStatus().then(synced => {
            if (synced) fetchBooks(true);
          });
        }
      }, SYNC_INTERVAL);
      
    })();
  </script>
</body>
</html>
