<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#8B5A2B">
  <title>📖 E-Book Digital Flip</title>
  
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkUtQm9vayBEaWdpdGFsIEZsaXAiLAogICJzaG9ydF9uYW1lIjogIkUtQm9vayIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmFmM2UwIiwKICAidGhlbWVfY29sb3IiOiAiIzhiNWEyYiIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5pbWd1ci5jb20vSmt4UllkNi5wbmciLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5e6d3 0%, #e8d5b7 50%, #f0e0c8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Library View */
    .library-view {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: rgba(255,255,255,0.5);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .library-title {
      text-align: center;
      font-size: 2rem;
      color: #5c3a1e;
      margin-bottom: 30px;
      font-family: 'Georgia', serif;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .book-card {
      background: linear-gradient(135deg, #fff8f0, #fff3e4);
      border-radius: 15px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid #d2b48c;
      box-shadow: 0 4px 15px rgba(139,90,43,0.1);
      text-align: center;
    }

    .book-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 30px rgba(139,90,43,0.2);
      border-color: #8B5A2B;
    }

    .book-emoji {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #5c3a1e;
      margin-bottom: 5px;
    }

    .book-url {
      font-size: 0.75rem;
      color: #8B5A2B;
      opacity: 0.7;
      word-break: break-all;
    }

    /* Reader View */
    .reader-view {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .reader-view.active {
      display: flex;
    }

    .library-view.hidden {
      display: none;
    }

    .book-container {
      width: 100%;
      flex: 1;
      perspective: 1500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flip-book {
      width: 95%;
      max-width: 750px;
      height: 85vh;
      max-height: 700px;
      position: relative;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fffef9 0%, #fef9f0 100%);
      border-radius: 10px 25px 25px 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 30px rgba(139,90,43,0.05);
      padding: 40px 35px;
      display: flex;
      flex-direction: column;
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
      backface-visibility: hidden;
      overflow-y: auto;
      border: 1px solid #d2b48c;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 1;
    }

    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .chapter-tag {
      display: inline-block;
      background: linear-gradient(135deg, #8B5A2B, #a0724d);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 20px;
      width: fit-content;
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #3d2b1a;
      margin-bottom: 15px;
      font-family: 'Georgia', serif;
      line-height: 1.3;
    }

    .page-text {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #4a3728;
      text-align: justify;
      margin-bottom: 20px;
      flex: 1;
    }

    .page-illustration {
      width: 100%;
      height: 150px;
      background: linear-gradient(135deg, #f3e5d8, #e8d5c0);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      margin: 15px 0;
      box-shadow: inset 0 2px 10px rgba(139,90,43,0.15);
    }

    .page-footer {
      text-align: center;
      color: #8B5A2B;
      font-size: 0.85rem;
      margin-top: 15px;
      font-weight: 500;
    }

    .logo-watermark {
      position: absolute;
      bottom: 15px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      opacity: 0.5;
      z-index: 5;
    }

    /* Navigation */
    .navigation {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.8);
      border-radius: 50px;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      background: linear-gradient(145deg, #8B5A2B, #6b4320);
      border: none;
      color: white;
      font-size: 1.3rem;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(139,90,43,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active {
      transform: scale(0.9);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .page-counter {
      font-weight: 700;
      color: #5c3a1e;
      background: rgba(139,90,43,0.1);
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      min-width: 100px;
      text-align: center;
    }

    .back-btn {
      background: transparent;
      border: 2px solid #8B5A2B;
      color: #8B5A2B;
      font-size: 0.9rem;
      padding: 8px 15px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back-btn:hover {
      background: #8B5A2B;
      color: white;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #8B5A2B;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3e5d8;
      border-top: 4px solid #8B5A2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 20px;
        border-radius: 10px 20px 20px 10px;
      }
      .page-title {
        font-size: 1.4rem;
      }
      .page-text {
        font-size: 0.95rem;
      }
      .page-illustration {
        height: 120px;
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Library View -->
    <div class="library-view" id="libraryView">
      <div class="library-title">📚 Perpustakaan Digital</div>
      <div class="book-grid" id="bookGrid">
        <div class="loading-screen">
          <div class="spinner"></div>
          <span>Memuat koleksi buku...</span>
        </div>
      </div>
    </div>

    <!-- Reader View -->
    <div class="reader-view" id="readerView">
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 20px;">
        <button class="back-btn" id="backBtn">← Perpustakaan</button>
        <span id="readerBookTitle" style="font-weight:600;color:#5c3a1e;"></span>
      </div>
      <div class="book-container">
        <div class="flip-book" id="flipBook">
          <div class="page" id="currentPage">
            <div class="page-content" id="pageContent">
              <div class="loading-screen">
                <div class="spinner"></div>
                <span>Membuka buku...</span>
              </div>
            </div>
            <div class="logo-watermark"></div>
          </div>
        </div>
      </div>
      <div class="navigation">
        <button class="nav-btn" id="prevPageBtn">◀</button>
        <span class="page-counter" id="pageCounter">0 / 0</span>
        <button class="nav-btn" id="nextPageBtn">▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      let books = [];
      let currentBook = null;
      let currentPageIndex = 0;
      let totalPages = 0;
      let pagesData = [];

      // DOM Elements
      const libraryView = document.getElementById('libraryView');
      const readerView = document.getElementById('readerView');
      const bookGrid = document.getElementById('bookGrid');
      const flipBook = document.getElementById('flipBook');
      const currentPage = document.getElementById('currentPage');
      const pageContent = document.getElementById('pageContent');
      const pageCounter = document.getElementById('pageCounter');
      const prevPageBtn = document.getElementById('prevPageBtn');
      const nextPageBtn = document.getElementById('nextPageBtn');
      const backBtn = document.getElementById('backBtn');
      const readerBookTitle = document.getElementById('readerBookTitle');

      async function fetchBooks() {
        try {
          const response = await fetch(WEBAPP_URL);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          
          if (data.success && data.books) {
            books = data.books;
            renderLibrary();
          } else {
            throw new Error('Format data tidak valid');
          }
        } catch (error) {
          console.error('Gagal memuat buku:', error);
          bookGrid.innerHTML = '<div style="text-align:center;color:#b33a3a;">⚠️ Gagal memuat koleksi. Pastikan Web App terhubung.</div>';
        }
      }

      function renderLibrary() {
        if (books.length === 0) {
          bookGrid.innerHTML = '<div style="text-align:center;color:#8B5A2B;">📭 Belum ada buku. Tambahkan di spreadsheet.</div>';
          return;
        }

        const emojis = ['📚', '🌍', '🔬', '📖', '🎨', '💡', '🚀', '🧬', '🏛️', '🎵'];
        bookGrid.innerHTML = books.map(function(book, index) {
          return `
            <div class="book-card" onclick="openBook(${index})">
              <div class="book-emoji">${emojis[index % emojis.length]}</div>
              <div class="book-title">${escapeHTML(book.title)}</div>
              <div class="book-url">📎 ${escapeHTML(book.url.substring(0, 40))}...</div>
            </div>
          `;
        }).join('');
      }

      async function openBook(index) {
        currentBook = books[index];
        readerBookTitle.textContent = currentBook.title;
        
        // Tampilkan loading
        pageContent.innerHTML = '<div class="loading-screen"><div class="spinner"></div><span>Membuka buku...</span></div>';
        libraryView.classList.add('hidden');
        readerView.classList.add('active');
        
        try {
          const response = await fetch(WEBAPP_URL + '?book=' + index);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          
          if (data.success && data.pages) {
            pagesData = data.pages;
            totalPages = pagesData.length;
            currentPageIndex = 0;
            renderPage();
          } else {
            throw new Error('Gagal memuat halaman');
          }
        } catch (error) {
          console.error('Error:', error);
          // Fallback ke dummy pages
          generateDummyPages();
          totalPages = pagesData.length;
          currentPageIndex = 0;
          renderPage();
        }
      }

      function generateDummyPages() {
        const dummyContent = [
          { chapter: 'Pendahuluan', title: currentBook.title, content: 'Selamat datang di e-book ini. Konten akan dimuat dari dokumen yang terhubung.', illustration: '📚' },
          { chapter: 'Bab 1', title: 'Memulai Perjalanan', content: 'Setiap pengetahuan dimulai dengan langkah pertama. Mari eksplorasi bersama.', illustration: '🚀' },
          { chapter: 'Bab 2', title: 'Menggali Lebih Dalam', content: 'Semakin dalam kita menggali, semakin banyak yang kita temukan.', illustration: '🔍' },
          { chapter: 'Kesimpulan', title: 'Penutup', content: 'Terima kasih telah membaca. Kembali ke perpustakaan untuk buku lainnya.', illustration: '📖' }
        ];
        pagesData = dummyContent.map(function(item, i) {
          return { ...item, pageNumber: i + 1 };
        });
      }

      function renderPage() {
        if (!pagesData.length) return;
        
        const page = pagesData[currentPageIndex];
        
        pageContent.innerHTML = `
          ${page.chapter ? `<div class="chapter-tag">📌 ${escapeHTML(page.chapter)}</div>` : ''}
          <div class="page-title">${escapeHTML(page.title)}</div>
          ${page.illustration ? `<div class="page-illustration">${escapeHTML(page.illustration)}</div>` : ''}
          <div class="page-text">${escapeHTML(page.content)}</div>
          <div class="page-footer">Halaman ${page.pageNumber || (currentPageIndex + 1)} dari ${totalPages}</div>
        `;
        
        pageCounter.textContent = `${currentPageIndex + 1} / ${totalPages}`;
        prevPageBtn.disabled = currentPageIndex === 0;
        nextPageBtn.disabled = currentPageIndex >= totalPages - 1;
        
        // Reset flip state
        currentPage.classList.remove('flipped');
      }

      function flipPage(direction) {
        if (direction === 'next' && currentPageIndex < totalPages - 1) {
          currentPage.classList.add('flipped');
          setTimeout(function() {
            currentPageIndex++;
            currentPage.classList.remove('flipped');
            renderPage();
          }, 300);
        } else if (direction === 'prev' && currentPageIndex > 0) {
          currentPage.classList.add('flipped');
          setTimeout(function() {
            currentPageIndex--;
            currentPage.classList.remove('flipped');
            renderPage();
          }, 300);
        }
      }

      function goBackToLibrary() {
        readerView.classList.remove('active');
        libraryView.classList.remove('hidden');
        currentBook = null;
        pagesData = [];
      }

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Event Listeners
      prevPageBtn.addEventListener('click', function() { flipPage('prev'); });
      nextPageBtn.addEventListener('click', function() { flipPage('next'); });
      backBtn.addEventListener('click', goBackToLibrary);
      
      // Keyboard navigation
      document.addEventListener('keydown', function(e) {
        if (!currentBook) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); flipPage('prev'); }
        if (e.key === 'ArrowRight') { e.preventDefault(); flipPage('next'); }
        if (e.key === 'Escape') { goBackToLibrary(); }
      });

      // Touch swipe
      let touchStartX = 0;
      document.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
      }, {passive: true});
      
      document.addEventListener('touchend', function(e) {
        if (!currentBook || !touchStartX) return;
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) {
          flipPage(diff > 0 ? 'next' : 'prev');
        }
        touchStartX = 0;
      });

      // Expose openBook ke global scope untuk onclick di HTML
      window.openBook = openBook;

      // PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('data:application/javascript;base64,DQpzZWxmLmFkZEV2ZW50TGlzdGVuZXIoJ2luc3RhbGwnLCBldmVudCA9PiB7DQogIGV2ZW50LndhaXRVbnRpbChzZWxmLnNraXBXYWl0aW5nKCkpOw0KfSk7DQpzZWxmLmFkZEV2ZW50TGlzdGVuZXIoJ2FjdGl2YXRlJywgZXZlbnQgPT4gew0KICBldmVudC53YWl0VW50aWwoc2VsZi5jbGllbnRzLmNsYWltKCkpOw0KfSk7DQpzZWxmLmFkZEV2ZW50TGlzdGVuZXIoJ2ZldGNoJywgZXZlbnQgPT4gew0KICBldmVudC5yZXNwb25kV2l0aChmZXRjaChldmVudC5yZXF1ZXN0KSk7DQp9KTs=')
            .then(function(reg) { console.log('SW registered'); })
            .catch(function(err) { console.log('SW failed', err); });
        });
      }

      // Start
      fetchBooks();
    })();
  </script>
</body>
</html>
