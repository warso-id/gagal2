  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e0d5c5;
      --text-secondary: #8a7a6a;
      --accent: #c9a87c;
      --accent-hover: #d4b896;
      --page-color: #fdf8f2;
      --success: #27ae60;
      --warning: #f39c12;
      --danger: #e74c3c;
      --info: #3498db;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-focus-ring-color: transparent;
    }

    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Georgia', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      width: 100vw;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-overflow-scrolling: touch;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: pan-y pinch-zoom;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-area-top);
      padding-bottom: var(--safe-area-bottom);
    }

    /* ===== HEADER ===== */
    .app-header {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
      padding: clamp(4px, 1vw, 8px) clamp(8px, 2vw, 16px);
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
      flex-shrink: 0;
      min-height: clamp(40px, 6vh, 50px);
      flex-wrap: wrap;
    }

    .logo {
      width: clamp(26px, 4vw, 32px);
      height: clamp(26px, 4vw, 32px);
      border-radius: clamp(4px, 1vw, 6px);
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      flex-shrink: 0;
    }

    .app-title {
      color: var(--text);
      font-size: clamp(0.75rem, 1.5vw, 0.95rem);
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Sync Indicator */
    .sync-container {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: clamp(0.5rem, 1vw, 0.62rem);
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .sync-dot {
      width: clamp(4px, 0.8vw, 6px);
      height: clamp(4px, 0.8vw, 6px);
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .sync-indicator.live {
      background: rgba(39,174,96,0.12);
      border: 1px solid rgba(39,174,96,0.25);
      color: var(--success);
    }
    .sync-indicator.live .sync-dot {
      background: var(--success);
      animation: livePulse 2s infinite;
      box-shadow: 0 0 6px rgba(39,174,96,0.5);
    }

    .sync-indicator.updating {
      background: rgba(241,196,15,0.12);
      border: 1px solid rgba(241,196,15,0.25);
      color: var(--warning);
    }
    .sync-indicator.updating .sync-dot {
      background: var(--warning);
      animation: spin 0.8s linear infinite;
    }

    .sync-indicator.offline {
      background: rgba(231,76,60,0.12);
      border: 1px solid rgba(231,76,60,0.25);
      color: var(--danger);
    }
    .sync-indicator.offline .sync-dot { background: var(--danger); }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .sync-time {
      font-size: clamp(0.45rem, 0.9vw, 0.55rem);
      color: var(--text-secondary);
      white-space: nowrap;
      display: none;
    }

    .auto-refresh-badge {
      font-size: clamp(0.4rem, 0.8vw, 0.5rem);
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(52,152,219,0.15);
      color: var(--info);
      border: 1px solid rgba(52,152,219,0.2);
      white-space: nowrap;
      animation: fadeInOut 3s ease-in-out;
      display: none;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.8); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    .search-wrapper {
      flex: 1;
      position: relative;
      max-width: clamp(200px, 40vw, 350px);
      margin: 0 4px;
    }

    .search-icon {
      position: absolute;
      left: clamp(8px, 1.5vw, 10px);
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(0.7rem, 1.2vw, 0.8rem);
      pointer-events: none;
      z-index: 1;
    }

    .search-input {
      width: 100%;
      padding: clamp(5px, 0.8vh, 7px) clamp(8px, 1.5vw, 12px) clamp(5px, 0.8vh, 7px) clamp(26px, 5vw, 32px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      color: var(--text);
      font-size: clamp(0.68rem, 1.2vw, 0.78rem);
      outline: none;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
    }

    .search-input::placeholder { color: var(--text-secondary); }

    .header-actions {
      display: flex;
      gap: clamp(2px, 0.5vw, 4px);
      flex-shrink: 0;
      overflow-x: auto;
    }

    .year-pill {
      padding: clamp(3px, 0.5vh, 5px) clamp(6px, 1vw, 10px);
      border-radius: 10px;
      background: rgba(201,168,124,0.1);
      color: var(--accent);
      font-size: clamp(0.58rem, 1vw, 0.68rem);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(201,168,124,0.2);
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.2s;
    }

    .year-pill:hover { background: rgba(201,168,124,0.2); }
    .year-pill.active { background: var(--accent); color: #1a1a1a; }

    .refresh-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: clamp(3px, 0.5vh, 5px) clamp(6px, 1vw, 10px);
      border-radius: 8px;
      cursor: pointer;
      font-size: clamp(0.62rem, 1vw, 0.72rem);
      font-family: inherit;
      transition: all 0.2s;
    }

    .refresh-btn:hover { background: rgba(255,255,255,0.12); }
    .refresh-btn.spinning { animation: spin 0.8s linear; }

    /* ===== MAIN ===== */
    .main-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .library-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    .library-view.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .filter-row {
      display: flex;
      gap: clamp(2px, 0.5vw, 4px);
      padding: clamp(4px, 0.8vh, 8px) clamp(8px, 2vw, 14px);
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    .filter-row::-webkit-scrollbar { height: 0; }

    .filter-chip {
      padding: clamp(3px, 0.5vh, 5px) clamp(8px, 1.5vw, 12px);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      color: var(--text-secondary);
      font-size: clamp(0.58rem, 1vw, 0.68rem);
      white-space: nowrap;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .filter-chip:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: #1a1a1a; font-weight: 600; border-color: var(--accent); }

    .book-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 clamp(8px, 2vw, 14px) clamp(8px, 2vw, 14px);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .book-scroll::-webkit-scrollbar { width: 3px; }
    .book-scroll::-webkit-scrollbar-track { background: transparent; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    .year-group { margin-bottom: clamp(10px, 2vh, 16px); }

    .year-group-header {
      color: var(--accent);
      font-size: clamp(0.65rem, 1.2vw, 0.75rem);
      font-weight: 700;
      letter-spacing: 1px;
      padding: clamp(6px, 1vh, 10px) 2px clamp(3px, 0.5vh, 6px);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      margin-bottom: clamp(4px, 1vh, 8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 5;
    }

    .year-group-header .book-count {
      font-size: clamp(0.5rem, 0.9vw, 0.6rem);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(110px, 20vw, 155px), 1fr));
      gap: clamp(4px, 1vw, 8px);
    }

    .book-card {
      background: var(--surface);
      border-radius: clamp(6px, 1vw, 10px);
      padding: clamp(8px, 1.5vw, 12px) clamp(6px, 1vw, 10px);
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
      aspect-ratio: 3/4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(3px, 0.5vh, 6px);
    }

    .book-card:hover {
      border-color: rgba(201,168,124,0.3);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .book-card:active { transform: scale(0.97); }

    .book-card .card-emoji {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      transition: transform 0.2s;
    }

    .book-card:hover .card-emoji { transform: scale(1.1); }

    .book-card .card-title {
      color: var(--text);
      font-size: clamp(0.6rem, 1.1vw, 0.72rem);
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .book-card .card-url {
      color: var(--text-secondary);
      font-size: clamp(0.45rem, 0.8vw, 0.55rem);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .book-card .card-badge {
      position: absolute;
      top: clamp(3px, 0.5vw, 6px);
      right: clamp(3px, 0.5vw, 6px);
      font-size: clamp(0.4rem, 0.7vw, 0.5rem);
      background: rgba(201,168,124,0.2);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 6px;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: clamp(30px, 8vh, 50px);
      color: var(--text-secondary);
    }

    .empty-state .empty-icon { font-size: clamp(2.5rem, 6vw, 4rem); margin-bottom: 10px; }
    .empty-state .empty-text { font-size: clamp(0.8rem, 1.5vw, 1rem); }
    .empty-state .empty-sub { font-size: clamp(0.6rem, 1vw, 0.75rem); margin-top: 4px; }

    /* ===== READER ===== */
    .reader-view {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      z-index: 50;
    }

    .reader-view.active { transform: translateX(0); }

    .reader-topbar {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 8px);
      padding: clamp(4px, 0.8vh, 6px) clamp(8px, 1.5vw, 12px);
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 60;
      flex-shrink: 0;
      min-height: clamp(36px, 5vh, 44px);
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: clamp(3px, 0.5vh, 5px) clamp(8px, 1.5vw, 12px);
      border-radius: 10px;
      cursor: pointer;
      font-size: clamp(0.62rem, 1vw, 0.72rem);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-back:hover { background: rgba(255,255,255,0.12); }

    .reader-title {
      flex: 1;
      color: var(--text);
      font-size: clamp(0.65rem, 1.1vw, 0.75rem);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-logo-sm {
      width: clamp(20px, 3vw, 24px);
      height: clamp(20px, 3vw, 24px);
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      border-radius: 4px;
      flex-shrink: 0;
      opacity: 0.8;
    }

    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .book-spread {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
    }

    .page-left-wrap { width: 50%; height: 100%; position: relative; }

    .page-left-inner {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 0.5vw, 6px);
      overflow: hidden;
    }

    .pdf-canvas-left {
      max-width: 100%;
      max-height: 100%;
      background: #fff;
      border-radius: 1px;
    }

    .page-right-wrap {
      width: 50%;
      height: 100%;
      position: relative;
      perspective: 1500px;
    }

    .page-flip {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
      transform-origin: left center;
    }

    .page-back-face {
      position: absolute;
      inset: 0;
      background: #e8dcc8;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 0.5vw, 6px);
    }

    .page-front-face {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(3px, 0.5vw, 6px);
      overflow: hidden;
    }

    .pdf-canvas-right, .pdf-canvas-back {
      max-width: 100%;
      max-height: 100%;
      background: #fff;
      border-radius: 1px;
    }

    .page-label {
      text-align: center;
      padding: clamp(1px, 0.3vh, 3px);
      font-size: clamp(0.42rem, 0.7vw, 0.52rem);
      color: #aaa;
      flex-shrink: 0;
    }

    .spine-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,0,0,0.15);
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    /* Loading */
    .load-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 80;
      transition: opacity 0.3s;
    }

    .load-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring {
      width: clamp(30px, 5vw, 40px);
      height: clamp(30px, 5vw, 40px);
      border: 2px solid rgba(255,255,255,0.08);
      border-top: 2px solid var(--accent);
      border-radius: 50%;
      animation: spinRing 0.6s linear infinite;
    }

    @keyframes spinRing { to { transform: rotate(360deg); } }

    .load-text {
      color: var(--text-secondary);
      margin-top: clamp(6px, 1vh, 10px);
      font-size: clamp(0.62rem, 1vw, 0.72rem);
      letter-spacing: 0.3px;
    }

    .load-progress {
      width: clamp(140px, 30vw, 200px);
      height: clamp(2px, 0.4vh, 4px);
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: clamp(6px, 1vh, 10px);
      overflow: hidden;
    }

    .load-progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .retry-btn {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: clamp(5px, 0.8vh, 8px) clamp(14px, 3vw, 20px);
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(0.62rem, 1vw, 0.72rem);
      margin-top: clamp(8px, 1.5vh, 12px);
      font-family: inherit;
      transition: all 0.2s;
    }

    .retry-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .retry-btn.hidden { display: none; }

    /* Bottom Bar */
    .reader-bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      padding: clamp(5px, 0.8vh, 8px) clamp(10px, 2vw, 16px);
      background: rgba(0,0,0,0.9);
      flex-shrink: 0;
      z-index: 60;
    }

    .nav-btn {
      width: clamp(30px, 5vw, 38px);
      height: clamp(30px, 5vw, 38px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      border-color: var(--accent);
    }

    .nav-btn:active:not(:disabled) { transform: scale(0.9); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }

    .page-indicator {
      color: var(--text);
      font-size: clamp(0.65rem, 1.1vw, 0.75rem);
      font-weight: 600;
      min-width: clamp(60px, 12vw, 80px);
      text-align: center;
      background: rgba(255,255,255,0.03);
      padding: clamp(3px, 0.5vh, 5px) clamp(8px, 1.5vw, 12px);
      border-radius: 10px;
      letter-spacing: 0.3px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: clamp(12px, 2vh, 20px);
      left: 50%;
      transform: translateX(-50%);
      padding: clamp(6px, 1vh, 10px) clamp(14px, 3vw, 22px);
      border-radius: 16px;
      font-size: clamp(0.62rem, 1vw, 0.75rem);
      z-index: 200;
      display: none;
      animation: slideDown 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .toast.show { display: block; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #fff; }
    .toast.info { background: var(--info); color: #fff; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Install Prompt */
    .install-prompt {
      position: fixed;
      bottom: clamp(10px, 2vh, 20px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: clamp(10px, 2vh, 14px) clamp(14px, 3vw, 20px);
      z-index: 150;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .install-prompt.show { display: flex; }

    .install-prompt .install-text {
      color: var(--text);
      font-size: clamp(0.7rem, 1.2vw, 0.8rem);
      font-weight: 600;
    }

    .install-prompt .install-btn {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(0.65rem, 1vw, 0.72rem);
      font-family: inherit;
      white-space: nowrap;
    }

    .install-prompt .install-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px;
    }

    /* ===== RESPONSIVE BREAKPOINTS ===== */
    @media (min-width: 1024px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .sync-time { display: inline; }
    }

    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 5px; }
      .book-card { padding: 8px 6px; }
      .book-card .card-emoji { font-size: 1.4rem; }
      .book-card .card-title { font-size: 0.65rem; }
      .book-card .card-url { font-size: 0.5rem; }
      .reader-topbar { padding: 4px 6px; }
      .reader-bottombar { padding: 5px 8px; gap: 8px; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
      .app-header { flex-wrap: wrap; gap: 4px; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 2px 0; }
      .header-actions { order: 5; }
      .app-title { font-size: 0.78rem; }
      .book-card { padding: 6px 4px; aspect-ratio: auto; min-height: 100px; }
      .book-card .card-emoji { font-size: 1.2rem; }
      .book-card .card-title { font-size: 0.6rem; }
      .book-card .card-url { font-size: 0.45rem; }
      .page-left-wrap, .page-right-wrap { width: 50%; }
      .pdf-canvas-left, .pdf-canvas-right { max-width: 98%; }
    }

    @media (max-width: 360px) {
      .book-grid { grid-template-columns: 1fr 1fr; gap: 3px; }
      .book-card { padding: 5px 3px; min-height: 80px; }
      .book-card .card-emoji { font-size: 1rem; }
      .book-card .card-title { font-size: 0.55rem; -webkit-line-clamp: 1; }
      .year-pill { font-size: 0.55rem; padding: 2px 5px; }
      .filter-chip { font-size: 0.55rem; padding: 2px 6px; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .app-header { min-height: 36px; padding: 3px 8px; }
      .reader-topbar { min-height: 32px; padding: 3px 6px; }
      .reader-bottombar { padding: 4px 8px; }
      .book-area { padding: 2px; }
      .pdf-area-left, .pdf-area-right { padding: 2px; }
    }

    @media (orientation: landscape) and (min-width: 1024px) {
      .book-spread { max-width: 90%; }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="app-header">
      <div class="logo" title="Digital Library Logo"></div>
      <span class="app-title">Digital Library</span>
      
      <div class="sync-container">
        <div class="sync-indicator live" id="syncIndicator" title="Status sinkronisasi - Klik untuk refresh">
          <span class="sync-dot"></span>
          <span id="syncText">Live</span>
        </div>
        <span class="sync-time" id="syncTime">Just now</span>
        <span class="auto-refresh-badge" id="autoRefreshBadge">Updated!</span>
      </div>
      
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="search" class="search-input" id="searchInput" placeholder="Cari judul, kategori..." autocomplete="off">
      </div>
      
      <div class="header-actions" id="yearBadges"></div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh manual" aria-label="Refresh data">🔄</button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
      <!-- LIBRARY -->
      <div class="library-view" id="libraryView">
        <div class="filter-row" id="filterRow"></div>
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-ring"></div>
            <div class="load-text">Syncing with server...</div>
          </div>
        </div>
      </div>

      <!-- READER -->
      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack" aria-label="Kembali ke perpustakaan">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku untuk membaca</div>
          <div class="reader-logo-sm" title="Logo"></div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area-left" id="pdfAreaLeft">
                  <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
                </div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>

            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face" id="pageBackFace">
                  <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
                </div>
                <div class="page-front-face" id="pageFrontFace">
                  <div class="pdf-area-right" id="pdfAreaRight">
                    <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                  </div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>

          <div class="load-overlay" id="readerLoading">
            <div class="spinner-ring"></div>
            <div class="load-text" id="readerLoadText">Membuka PDF...</div>
            <div class="load-progress"><div class="load-progress-bar" id="loadProgressBar"></div></div>
            <button class="retry-btn hidden" id="retryBtn">🔄 Coba Lagi</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled aria-label="Halaman sebelumnya">◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled aria-label="Halaman berikutnya">▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Install Prompt -->
  <div class="install-prompt" id="installPrompt">
    <span class="install-text">📱 Install aplikasi?</span>
    <button class="install-btn" id="installBtn">Install</button>
    <button class="install-close" id="installClose">✕</button>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================================
      // CONFIG
      // ============================================
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      const CHECK_UPDATE_INTERVAL = 5000;
      const FULL_SYNC_INTERVAL = 30000;
      const CACHE_DURATION = 3000;

      // ============================================
      // STATE
      // ============================================
      const state = {
        allBooks: [], groupedBooks: {}, years: [], categories: [],
        currentBook: null, pdfDoc: null, totalPages: 0, totalSpreads: 0,
        currentSpread: 0, isFlipping: false,
        activeYear: '', activeCategory: '', searchQuery: '',
        lastSync: null, lastModified: null,
        cache: { data: null, time: 0 },
        checkInterval: null, syncInterval: null, isSyncing: false,
        deferredPrompt: null
      };

      // ============================================
      // DOM
      // ============================================
      const $ = (id) => document.getElementById(id);
      const DOM = {
        libraryView: $('libraryView'), bookScroll: $('bookScroll'), libLoading: $('libLoading'),
        filterRow: $('filterRow'), yearBadges: $('yearBadges'),
        searchInput: $('searchInput'), refreshBtn: $('refreshBtn'),
        syncIndicator: $('syncIndicator'), syncText: $('syncText'),
        syncTime: $('syncTime'), autoRefreshBadge: $('autoRefreshBadge'),
        readerView: $('readerView'), readerLoading: $('readerLoading'),
        readerLoadText: $('readerLoadText'), loadProgressBar: $('loadProgressBar'),
        retryBtn: $('retryBtn'), pageFlip: $('pageFlip'), pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'), pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'), pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'), pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'), btnPrev: $('btnPrev'),
        btnNext: $('btnNext'), btnBack: $('btnBack'), toast: $('toast'),
        installPrompt: $('installPrompt'), installBtn: $('installBtn'), installClose: $('installClose'),
      };

      // ============================================
      // UTILS
      // ============================================
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      const escHtml = (s) => s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]) : '';
      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

      function toast(msg, type = 'info', dur = 2500) {
        DOM.toast.textContent = msg;
        DOM.toast.className = 'toast show ' + type;
        clearTimeout(state._tt);
        state._tt = setTimeout(() => DOM.toast.classList.remove('show'), dur);
      }

      function setSyncStatus(status, text) {
        DOM.syncIndicator.className = 'sync-indicator ' + status;
        DOM.syncText.textContent = text || status;
      }

      function updateSyncTime() {
        if (state.lastSync) {
          const diff = Math.floor((Date.now() - new Date(state.lastSync).getTime()) / 1000);
          if (diff < 10) DOM.syncTime.textContent = 'Just now';
          else if (diff < 60) DOM.syncTime.textContent = diff + 's ago';
          else DOM.syncTime.textContent = Math.floor(diff / 60) + 'm ago';
        }
      }

      function showAutoRefreshBadge() {
        DOM.autoRefreshBadge.style.display = 'inline';
        DOM.autoRefreshBadge.style.animation = 'none';
        DOM.autoRefreshBadge.offsetHeight;
        DOM.autoRefreshBadge.style.animation = 'fadeInOut 3s ease-in-out';
        setTimeout(() => { DOM.autoRefreshBadge.style.display = 'none'; }, 3000);
      }

      function showLibLoading(s) { DOM.libLoading.classList.toggle('hidden', !s); }
      
      function showReaderLoading(s, txt = '', prog = 0) {
        DOM.readerLoading.classList.toggle('hidden', !s);
        if (txt) DOM.readerLoadText.textContent = txt;
        DOM.loadProgressBar.style.width = prog + '%';
        if (s) DOM.retryBtn.classList.add('hidden');
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        DOM.pageIndicator.textContent = `${state.currentSpread*2+1}-${Math.min(state.currentSpread*2+2, state.totalPages)} / ${state.totalPages}`;
      }

      function clearCanvas(c) {
        if (!c) return;
        c.width = 1; c.height = 1;
        c.getContext('2d').clearRect(0, 0, 1, 1);
      }

      // ============================================
      // REAL-TIME SYNC
      // ============================================
      async function checkForUpdates() {
        if (state.isSyncing || state.currentBook) return;
        try {
          const lastSync = state.lastModified || state.lastSync || '';
          const url = `${WEBAPP_URL}?action=checkUpdates&lastSync=${encodeURIComponent(lastSync)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.success && data.hasUpdates) {
            setSyncStatus('updating', 'Updating...');
            await fetchBooks(true);
            setSyncStatus('live', 'Live');
            updateSyncTime();
            showAutoRefreshBadge();
          } else {
            setSyncStatus('live', 'Live');
            updateSyncTime();
          }
        } catch (e) {
          setSyncStatus('offline', 'Offline');
        }
      }

      async function fullSync() {
        if (state.isSyncing || state.currentBook) return;
        setSyncStatus('updating', 'Syncing...');
        await fetchBooks(true);
        setSyncStatus('live', 'Live');
        updateSyncTime();
      }

      function startAutoSync() {
        state.checkInterval = setInterval(checkForUpdates, CHECK_UPDATE_INTERVAL);
        state.syncInterval = setInterval(fullSync, FULL_SYNC_INTERVAL);
      }

      function stopAutoSync() {
        if (state.checkInterval) clearInterval(state.checkInterval);
        if (state.syncInterval) clearInterval(state.syncInterval);
      }

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks(force = false) {
        if (state.isSyncing) return;
        if (!force && state.cache.data && (Date.now() - state.cache.time) < CACHE_DURATION) {
          state.allBooks = state.cache.data;
          processBooks();
          return;
        }

        state.isSyncing = true;
        showLibLoading(true);
        
        try {
          const p = new URLSearchParams();
          if (state.searchQuery) p.append('q', state.searchQuery);
          if (state.activeYear) p.append('year', state.activeYear);
          const url = WEBAPP_URL + (p.toString() ? '?' + p.toString() : '');
          const res = await fetch(url);
          const data = await res.json();
          
          if (data.success) {
            state.allBooks = data.books || [];
            state.years = data.years || [];
            state.categories = data.categories || [];
            state.lastSync = data.lastSync || new Date().toISOString();
            state.lastModified = data.lastModified || state.lastSync;
            state.cache = { data: state.allBooks, time: Date.now() };
            processBooks();
            updateSyncTime();
          }
        } catch (e) {
          if (!state.allBooks.length) {
            state.allBooks = [
              { title: '📄 Sample PDF', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi' },
              { title: '🔬 Science Book', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Sains' }
            ];
            state.years = ['2024/2025'];
            state.categories = ['Teknologi', 'Sains'];
            processBooks();
          }
          setSyncStatus('offline', 'Offline');
        }
        
        showLibLoading(false);
        state.isSyncing = false;
      }

      function processBooks() {
        const filtered = state.allBooks.filter(b => {
          if (state.activeYear && b.academicYear !== state.activeYear) return false;
          if (state.activeCategory && b.category !== state.activeCategory) return false;
          return true;
        });
        state.groupedBooks = {};
        filtered.forEach(b => {
          const y = b.academicYear || 'Unknown';
          (state.groupedBooks[y] = state.groupedBooks[y] || []).push(b);
        });
        renderUI();
      }

      function renderUI() {
        DOM.yearBadges.innerHTML = state.years.slice(0, 3).map(y =>
          `<button class="year-pill ${state.activeYear===y?'active':''}" data-year="${escHtml(y)}">📅 ${escHtml(y)}</button>`
        ).join('');
        DOM.yearBadges.querySelectorAll('.year-pill').forEach(p => {
          p.addEventListener('click', function() {
            state.activeYear = state.activeYear === this.getAttribute('data-year') ? '' : this.getAttribute('data-year');
            processBooks();
          });
        });

        const chips = [`<button class="filter-chip ${!state.activeCategory?'active':''}" data-category="">📚 All</button>`];
        state.categories.forEach(c => chips.push(`<button class="filter-chip ${state.activeCategory===c?'active':''}" data-category="${escHtml(c)}">${escHtml(c)}</button>`));
        DOM.filterRow.innerHTML = chips.join('');
        DOM.filterRow.querySelectorAll('.filter-chip').forEach(ch => {
          ch.addEventListener('click', function() {
            state.activeCategory = this.getAttribute('data-category') || '';
            processBooks();
          });
        });

        const years = Object.keys(state.groupedBooks).sort().reverse();
        if (!years.length) {
          DOM.bookScroll.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Tidak ada buku</div><div class="empty-sub">Coba ubah filter</div></div>';
          return;
        }

        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        let html = '';
        years.forEach(y => {
          const books = state.groupedBooks[y];
          html += `<div class="year-group">
            <div class="year-group-header">📅 ${escHtml(y)} <span class="book-count">${books.length} buku</span></div>
            <div class="book-grid">
              ${books.map((b, i) => `
                <div class="book-card" data-fileid="${escHtml(b.fileId)}" data-title="${escHtml(b.title)}" data-url="${escHtml(b.url)}">
                  <div class="card-badge">${escHtml(b.category||'')}</div>
                  <div class="card-emoji">${icons[i%10]}</div>
                  <div class="card-title">${escHtml(b.title)}</div>
                  <div class="card-url">🔗 ${escHtml((b.url||'').substring(0, 35))}...</div>
                </div>
              `).join('')}
            </div>
          </div>`;
        });
        
        DOM.bookScroll.innerHTML = html;
        DOM.bookScroll.querySelectorAll('.book-card').forEach(card => {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'), this.getAttribute('data-url'));
          });
        });
      }

      // ============================================
      // SEARCH
      // ============================================
      const debouncedSearch = debounce((q) => { state.searchQuery = q; fetchBooks(true); }, 350);
      DOM.searchInput.addEventListener('input', function() { debouncedSearch(this.value.trim()); });
      DOM.refreshBtn.addEventListener('click', () => { DOM.refreshBtn.classList.add('spinning'); fetchBooks(true).then(() => setTimeout(() => DOM.refreshBtn.classList.remove('spinning'), 800)); });
      DOM.syncIndicator.addEventListener('click', () => { if (!state.isSyncing) fullSync(); });

      // ============================================
      // OPEN BOOK - BASE64 PDF
      // ============================================
      async function openBook(fileId, title, url) {
        stopAutoSync();
        state.currentBook = { fileId, title, url };
        state.pdfDoc = null; state.totalPages = 0; state.totalSpreads = 0;
        state.currentSpread = 0; state.isFlipping = false;

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
        [DOM.pdfCanvasLeft, DOM.pdfCanvasRight, DOM.pdfCanvasBack].forEach(clearCanvas);
        DOM.pageLabelLeft.textContent = ''; DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0'; updateNav();
        
        showReaderLoading(true, 'Mengunduh PDF...', 10);
        await loadPDFFromBase64(fileId);
      }

      async function loadPDFFromBase64(fileId) {
        try {
          const infoUrl = `${WEBAPP_URL}?action=getPDFInfo&fileId=${fileId}`;
          const infoRes = await fetch(infoUrl);
          const infoData = await infoRes.json();
          if (!infoData.success) throw new Error('Gagal info PDF');
          
          const totalChunks = infoData.totalChunks;
          let fullBase64 = '';
          
          for (let i = 0; i < totalChunks; i++) {
            const chunkUrl = `${WEBAPP_URL}?action=getPDFChunk&fileId=${fileId}&chunk=${i}`;
            const chunkRes = await fetch(chunkUrl);
            const chunkData = await chunkRes.json();
            if (!chunkData.success) throw new Error('Chunk failed');
            fullBase64 += chunkData.data;
            showReaderLoading(true, `Mengunduh ${i+1}/${totalChunks}...`, 10 + Math.round(((i+1)/totalChunks)*40));
          }
          
          if (typeof pdfjsLib !== 'undefined') {
            await renderPDFWithPDFJS(fullBase64);
          } else {
            throw new Error('PDF.js not loaded');
          }
          
          showReaderLoading(false); updateNav();
          toast('✅ PDF berhasil dimuat!', 'success', 2000);
        } catch (e) {
          showReaderLoading(true, 'Gagal', 0); DOM.retryBtn.classList.remove('hidden');
          toast('❌ ' + e.message, 'error', 4000);
        }
      }

      async function renderPDFWithPDFJS(base64Data) {
        const binaryStr = atob(base64Data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
        
        showReaderLoading(true, 'Memproses...', 55);
        const loadingTask = pdfjsLib.getDocument({ data: bytes, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true });
        state.pdfDoc = await loadingTask.promise;
        state.totalPages = state.pdfDoc.numPages;
        state.totalSpreads = Math.ceil(state.totalPages / 2);
        state.currentSpread = 0;
        
        showReaderLoading(true, 'Merender...', 80);
        await renderPDFSpread(0);
      }

      async function renderPDFSpread(idx) {
        if (!state.pdfDoc) return;
        const lp = idx * 2 + 1, rp = lp + 1;
        if (lp <= state.totalPages) { await renderPDFPage(lp, DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = `Hal ${lp}`; }
        else { clearCanvas(DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = ''; }
        if (rp <= state.totalPages) { await renderPDFPage(rp, DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = `Hal ${rp}`; }
        else { clearCanvas(DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = ''; }
        updateNav();
      }

      async function renderPDFPage(num, canvas) {
        if (!state.pdfDoc || num > state.totalPages) return;
        const page = await state.pdfDoc.getPage(num);
        const pw = canvas.parentElement.clientWidth - 8;
        const ph = canvas.parentElement.clientHeight - 8;
        const vp = page.getViewport({ scale: 1 });
        const scale = Math.min(pw/vp.width, ph/vp.height, 2.5);
        const svp = page.getViewport({ scale });
        canvas.height = svp.height; canvas.width = svp.width;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: svp, background: '#fff' }).promise;
      }

      // ============================================
      // FLIP
      // ============================================
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads-1) return;
        state.isFlipping = true; updateNav();
        const nl = (state.currentSpread+1)*2+1;
        if (state.pdfDoc && nl <= state.totalPages) await renderPDFPage(nl, DOM.pdfCanvasBack);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        await sleep(550);
        state.currentSpread++;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
        if (state.pdfDoc) await renderPDFSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        state.isFlipping = false; updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        state.isFlipping = true; updateNav();
        const pr = state.currentSpread*2;
        if (state.pdfDoc && pr <= state.totalPages) await renderPDFPage(pr, DOM.pdfCanvasBack);
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        state.currentSpread--;
        if (state.pdfDoc) await renderPDFSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await sleep(550);
        state.isFlipping = false; updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfDoc = null; state.currentBook = null;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
        startAutoSync(); fetchBooks(true);
      }

      // ============================================
      // EVENTS
      // ============================================
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);
      DOM.retryBtn.addEventListener('click', () => { if(state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title, state.currentBook.url); });

      document.addEventListener('keydown', e => {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight'||e.key==='PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft'||e.key==='PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
      });

      let tx = 0;
      DOM.pageFrontFace.addEventListener('touchstart', e => { if(state.currentBook&&!state.isFlipping) tx=e.touches[0].clientX; }, {passive:true});
      DOM.pageFrontFace.addEventListener('touchend', e => {
        if(!state.currentBook||state.isFlipping||!tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        if(Math.abs(dx)>40) dx>0?flipNext():flipPrev();
        tx=0;
      });
      DOM.pageFrontFace.addEventListener('click', e => {
        if(!state.currentBook||state.isFlipping) return;
        const x = e.clientX - DOM.pageFrontFace.getBoundingClientRect().left;
        if(x < DOM.pageFrontFace.offsetWidth*0.25) flipPrev();
        else if(x > DOM.pageFrontFace.offsetWidth*0.75) flipNext();
      });

      let rt;
      window.addEventListener('resize', () => { clearTimeout(rt); rt=setTimeout(()=>{ if(state.pdfDoc&&state.currentBook) renderPDFSpread(state.currentSpread); }, 300); });

      // ============================================
      // PWA - Service Worker
      // ============================================
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'digital-library-v10';
          const ASSETS = ['/'];
          
          self.addEventListener('install', e => {
            e.waitUntil(self.skipWaiting());
          });
          
          self.addEventListener('activate', e => {
            e.waitUntil(self.clients.claim());
          });
          
          self.addEventListener('fetch', e => {
            e.respondWith(
              caches.match(e.request).then(cached => {
                return cached || fetch(e.request).then(response => {
                  if (response.ok) {
                    const clone = response.clone();
                    caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                  }
                  return response;
                }).catch(() => {
                  if (e.request.mode === 'navigate') {
                    return caches.match('/');
                  }
                  return new Response('Offline', { status: 503 });
                });
              })
            );
          });
        `;
        
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
          .then(reg => console.log('✅ SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      }

      // ============================================
      // PWA - Install Prompt
      // ============================================
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        state.deferredPrompt = e;
        DOM.installPrompt.classList.add('show');
      });

      DOM.installBtn.addEventListener('click', async () => {
        if (state.deferredPrompt) {
          state.deferredPrompt.prompt();
          const result = await state.deferredPrompt.userChoice;
          console.log('Install result:', result.outcome);
          state.deferredPrompt = null;
          DOM.installPrompt.classList.remove('show');
        }
      });

      DOM.installClose.addEventListener('click', () => {
        DOM.installPrompt.classList.remove('show');
      });

      window.addEventListener('appinstalled', () => {
        console.log('✅ App installed!');
        DOM.installPrompt.classList.remove('show');
        toast('✅ Aplikasi berhasil diinstall!', 'success', 3000);
      });

      // ============================================
      // INIT
      // ============================================
      console.log('📖 Digital Library v10 - PWA Complete');
      console.log('✅ PWA: Installable, Offline-ready');
      console.log('✅ Responsive: All devices supported');
      console.log('✅ Base64: PDF content via Base64');
      console.log('✅ Live Sync: Auto-refresh enabled');
      
      fetchBooks().then(() => { setSyncStatus('live', 'Live'); updateSyncTime(); });
      startAutoSync();
      
    })();
  </script>
</body>
</html>
