<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Digital Library - E-Book Flip Reader">
  <title>📚 Digital Library | E-Book Flip</title>
  
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkRpZ2l0YWwgTGlicmFyeSIsCiAgInNob3J0X25hbWUiOiAiRS1Cb29rIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwYTBhMGEiLAogICJ0aGVtZV9jb2xvciI6ICIjMGEwYTBhIiwKICAiaWNvbnMiOiBbewogICAgInNyYyI6ICJodHRwczovL2kuaW1ndXIuY29tL0preFJZZDYucG5nIiwKICAgICJzaXplcyI6ICIxOTJ4MTkyIiwKICAgICJ0eXBlIjogImltYWdlL3BuZyIKICB9XQp9">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #d4c8b8;
      --accent: #c9a87c;
      --gold: #d4a574;
      --page: #faf6ef;
      --spine: #1a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Georgia', serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app { width: 100%; height: 100%; position: relative; }

    /* ===== LIBRARY ===== */
    .library {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1a1410 0%, #0a0a0a 50%, #1a1410 100%);
      display: flex;
      flex-direction: column;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }

    .library.hidden {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
    }

    /* Header */
    .lib-header {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 12px 20px;
      flex-shrink: 0;
    }

    .lib-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: url('https://i.imgur.com/JkxRYd6.png') center/cover no-repeat;
      border: 2px solid var(--accent);
      flex-shrink: 0;
    }

    .lib-title {
      flex: 1;
    }

    .lib-title h1 {
      font-size: 1.3rem;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .lib-title span {
      font-size: 0.65rem;
      color: #6b5e4e;
      letter-spacing: 2px;
    }

    /* Search Bar */
    .search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 20px rgba(201,168,124,0.1);
    }

    .search-input::placeholder { color: #5a4e3e; }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .filter-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      outline: none;
      transition: all 0.3s;
    }

    .filter-select:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.1);
    }

    .filter-select option {
      background: #1a1a1a;
      color: var(--text);
    }

    .result-count {
      color: #6b5e4e;
      font-size: 0.7rem;
      margin-left: auto;
      align-self: center;
    }

    /* Book Grid */
    .book-grid {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      padding: 16px;
      align-content: start;
    }

    .book-grid::-webkit-scrollbar { width: 4px; }
    .book-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .book-card {
      background: linear-gradient(160deg, #1e1e1e 0%, #151515 100%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 18px 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .book-card:hover {
      border-color: rgba(201,168,124,0.3);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .book-card:active { transform: scale(0.96); }

    .book-card .year-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: #000;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .book-card .icon { font-size: 2.2rem; margin-bottom: 8px; display: block; }
    .book-card .title { 
      color: var(--text); 
      font-size: 0.8rem; 
      font-weight: 600; 
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-card .meta {
      color: #5a4e3e;
      font-size: 0.65rem;
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    /* Load More */
    .load-more {
      grid-column: 1/-1;
      text-align: center;
      padding: 20px;
    }

    .load-more-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 10px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s;
    }

    .load-more-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
    }

    .no-results {
      grid-column: 1/-1;
      text-align: center;
      padding: 40px;
      color: #6b5e4e;
    }

    /* ===== READER ===== */
    .reader {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }

    .reader.active { transform: translateX(0); }

    .reader-topbar {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.2s;
    }

    .btn-back:hover { background: rgba(255,255,255,0.12); }

    .reader-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: url('https://i.imgur.com/JkxRYd6.png') center/cover no-repeat;
      border: 1px solid var(--accent);
    }

    .reader-title {
      flex: 1;
      color: var(--text);
      font-size: 0.8rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-page-info {
      color: #6b5e4e;
      font-size: 0.7rem;
    }

    /* Book Area - Full Screen */
    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2500px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .book-spread {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      z-index: 5;
    }

    /* LEFT PAGE */
    .page-left-container {
      width: 50%;
      height: 100%;
      position: relative;
    }

    .page-left {
      position: absolute;
      inset: 0;
      background: var(--page);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-view-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
    }

    .pdf-canvas-left {
      max-width: 100%;
      max-height: 100%;
      background: #fff;
    }

    /* RIGHT PAGE - Flippable */
    .page-right-container {
      width: 50%;
      height: 100%;
      position: relative;
      perspective: 2000px;
    }

    .page-right-flip {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
      transform-origin: left center;
    }

    .page-right-back {
      position: absolute;
      inset: 0;
      background: #e8dcc8;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .page-right-front {
      position: absolute;
      inset: 0;
      background: var(--page);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-view-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
    }

    .pdf-canvas-right, .pdf-canvas-back {
      max-width: 100%;
      max-height: 100%;
      background: #fff;
    }

    .page-num {
      text-align: center;
      padding: 6px;
      font-size: 0.6rem;
      color: #999;
      flex-shrink: 0;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    /* Spine */
    .spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(0,0,0,0.7), rgba(0,0,0,0.3));
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    /* Loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(201,168,124,0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #8a7a6a;
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }

    /* Bottom Bar */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .nav-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: var(--accent); }
    .nav-btn:active:not(:disabled) { transform: scale(0.9); }
    .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

    .page-indicator {
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      padding: 6px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 10px; }
      .book-card { padding: 14px 10px; }
      .book-card .icon { font-size: 1.8rem; }
      .book-card .title { font-size: 0.72rem; }
      .pdf-view-left, .pdf-view-right { padding: 3px; }
      .search-input { font-size: 0.8rem; padding: 8px 14px; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .lib-header { padding: 8px 12px; }
      .lib-title h1 { font-size: 1.1rem; }
      .nav-btn { width: 35px; height: 35px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== LIBRARY ===== -->
    <div class="library" id="library">
      <div class="lib-header">
        <div class="lib-header-top">
          <div class="logo"></div>
          <div class="lib-title">
            <h1>Digital Library</h1>
            <span>E-BOOK FLIP READER</span>
          </div>
        </div>
        <div class="search-bar">
          <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari judul buku...">
        </div>
        <div class="filters">
          <select class="filter-select" id="yearFilter">
            <option value="">📅 Semua Tahun</option>
          </select>
          <select class="filter-select" id="categoryFilter">
            <option value="">📂 Semua Kategori</option>
          </select>
          <span class="result-count" id="resultCount">0 buku</span>
        </div>
      </div>
      
      <div class="book-grid" id="bookGrid">
        <div class="no-results">
          <div class="loader"></div>
          <div style="margin-top:12px;">Memuat buku...</div>
        </div>
      </div>
    </div>

    <!-- ===== READER ===== -->
    <div class="reader" id="reader">
      <div class="reader-topbar">
        <button class="btn-back" id="btnBack">← Kembali</button>
        <div class="reader-logo"></div>
        <div class="reader-title" id="readerTitle">Pilih buku</div>
        <div class="reader-page-info" id="readerPageInfo">Spread 1</div>
      </div>

      <div class="book-area">
        <div class="book-spread">
          <div class="page-left-container">
            <div class="page-left">
              <div class="pdf-view-left" id="pdfViewLeft">
                <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
              </div>
              <div class="page-num" id="pageNumLeft"></div>
            </div>
          </div>

          <div class="page-right-container">
            <div class="page-right-flip" id="pageFlip">
              <div class="page-right-back" id="pageBack">
                <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
              </div>
              <div class="page-right-front" id="pageFront">
                <div class="pdf-view-right" id="pdfViewRight">
                  <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                </div>
                <div class="page-num" id="pageNumRight"></div>
              </div>
            </div>
          </div>

          <div class="spine"></div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
          <div class="loader"></div>
          <div class="loading-text" id="loadingText">Membuka PDF...</div>
        </div>
      </div>

      <div class="bottombar">
        <button class="nav-btn" id="btnPrev" disabled>◀</button>
        <span class="page-indicator" id="pageIndicator">1-2 / 0</span>
        <button class="nav-btn" id="btnNext" disabled>▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== CONFIG =====
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // ===== STATE =====
      const state = {
        books: [],
        filteredBooks: [],
        currentBook: null,
        pdfDoc: null,
        totalPages: 0,
        totalSpreads: 0,
        currentSpread: 0,
        isFlipping: false,
        searchQuery: '',
        selectedYear: '',
        selectedCategory: '',
        currentPage: 1,
        hasMore: true,
        isLoading: false,
        years: [],
        categories: []
      };

      // ===== DOM =====
      const $ = (id) => document.getElementById(id);
      const DOM = {
        library: $('library'),
        bookGrid: $('bookGrid'),
        searchInput: $('searchInput'),
        yearFilter: $('yearFilter'),
        categoryFilter: $('categoryFilter'),
        resultCount: $('resultCount'),
        reader: $('reader'),
        pageFlip: $('pageFlip'),
        pageFront: $('pageFront'),
        pdfCanvasLeft: $('pdfCanvasLeft'),
        pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'),
        pageNumLeft: $('pageNumLeft'),
        pageNumRight: $('pageNumRight'),
        loadingOverlay: $('loadingOverlay'),
        loadingText: $('loadingText'),
        pageIndicator: $('pageIndicator'),
        readerTitle: $('readerTitle'),
        readerPageInfo: $('readerPageInfo'),
        btnPrev: $('btnPrev'),
        btnNext: $('btnNext'),
        btnBack: $('btnBack'),
      };

      // ===== UTILS =====
      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      
      function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
      }

      function showLoading(show, text) {
        DOM.loadingOverlay.classList.toggle('hidden', !show);
        if (text) DOM.loadingText.textContent = text;
      }

      function updateNavButtons() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        const lp = state.currentSpread * 2 + 1;
        const rp = Math.min(lp + 1, state.totalPages);
        DOM.pageIndicator.textContent = lp + '-' + rp + ' / ' + state.totalPages;
        DOM.readerPageInfo.textContent = 'Spread ' + (state.currentSpread + 1) + '/' + state.totalSpreads;
      }

      function clearCanvas(c) {
        if (!c) return;
        const ctx = c.getContext('2d');
        c.width = 1; c.height = 1;
        ctx.clearRect(0,0,1,1);
      }

      // ===== FETCH BOOKS =====
      async function fetchBooks(page = 1, append = false) {
        if (state.isLoading) return;
        state.isLoading = true;
        
        const params = new URLSearchParams({
          page: page,
          limit: 50,
          search: state.searchQuery,
          year: state.selectedYear,
          category: state.selectedCategory
        });
        
        try {
          const startTime = performance.now();
          const response = await fetch(WEBAPP_URL + '?' + params.toString());
          const data = await response.json();
          const loadTime = performance.now() - startTime;
          
          console.log('⚡ Load time:', Math.round(loadTime), 'ms');
          
          if (data.success) {
            if (append) {
              state.books = state.books.concat(data.books);
            } else {
              state.books = data.books;
            }
            
            state.hasMore = data.pagination ? data.pagination.hasMore : false;
            state.currentPage = page;
            
            // Update filters
            if (data.filters) {
              state.years = data.filters.years || [];
              state.categories = data.filters.categories || [];
              updateFilterOptions();
            }
            
            renderBooks();
            DOM.resultCount.textContent = (data.pagination ? data.pagination.total : state.books.length) + ' buku';
          }
        } catch (error) {
          console.error('Fetch error:', error);
          if (!append) {
            DOM.bookGrid.innerHTML = '<div class="no-results">⚠️ Gagal memuat buku</div>';
          }
        }
        
        state.isLoading = false;
      }

      function updateFilterOptions() {
        DOM.yearFilter.innerHTML = '<option value="">📅 Semua Tahun</option>' +
          state.years.map(y => '<option value="' + y + '"' + (state.selectedYear === y ? ' selected' : '') + '>' + y + '</option>').join('');
        
        DOM.categoryFilter.innerHTML = '<option value="">📂 Semua Kategori</option>' +
          state.categories.map(c => '<option value="' + c + '"' + (state.selectedCategory === c ? ' selected' : '') + '>' + c + '</option>').join('');
      }

      function renderBooks() {
        if (state.books.length === 0) {
          DOM.bookGrid.innerHTML = '<div class="no-results">📭 Tidak ada buku ditemukan</div>';
          return;
        }

        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        
        let html = state.books.map((book, i) =>
          '<div class="book-card" data-index="' + i + '">' +
            (book.academicYear ? '<div class="year-badge">' + escHtml(book.academicYear) + '</div>' : '') +
            '<span class="icon">' + icons[i % icons.length] + '</span>' +
            '<div class="title">' + escHtml(book.title) + '</div>' +
            '<div class="meta">' +
              (book.category ? '<span>' + escHtml(book.category) + '</span>' : '') +
              (book.author ? '<span>' + escHtml(book.author) + '</span>' : '') +
            '</div>' +
          '</div>'
        ).join('');

        if (state.hasMore) {
          html += '<div class="load-more"><button class="load-more-btn" id="loadMoreBtn">Muat Lebih Banyak ↓</button></div>';
        }

        DOM.bookGrid.innerHTML = html;

        // Event listeners
        DOM.bookGrid.querySelectorAll('.book-card').forEach(card => {
          card.addEventListener('click', function() {
            openBook(parseInt(this.getAttribute('data-index')));
          });
        });

        const loadMoreBtn = $('loadMoreBtn');
        if (loadMoreBtn) {
          loadMoreBtn.addEventListener('click', () => fetchBooks(state.currentPage + 1, true));
        }
      }

      // ===== SEARCH & FILTER =====
      let searchTimeout;
      DOM.searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          state.searchQuery = this.value.trim();
          state.currentPage = 1;
          fetchBooks(1, false);
        }, 300);
      });

      DOM.yearFilter.addEventListener('change', function() {
        state.selectedYear = this.value;
        state.currentPage = 1;
        fetchBooks(1, false);
      });

      DOM.categoryFilter.addEventListener('change', function() {
        state.selectedCategory = this.value;
        state.currentPage = 1;
        fetchBooks(1, false);
      });

      // ===== OPEN BOOK =====
      async function openBook(index) {
        state.currentBook = state.books[index];
        state.pdfDoc = null;
        state.totalPages = 0;
        state.currentSpread = 0;
        state.totalSpreads = 0;
        state.isFlipping = false;

        DOM.readerTitle.textContent = state.currentBook.title;
        DOM.reader.classList.add('active');
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        updateNavButtons();
        showLoading(true, 'Mengunduh PDF...');
        
        try {
          const startTime = performance.now();
          const base64Url = WEBAPP_URL + '?action=getPDFBase64&fileId=' + state.currentBook.fileId;
          const response = await fetch(base64Url);
          const data = await response.json();
          
          if (!data.success) throw new Error(data.error);
          
          console.log('⚡ PDF Base64 loaded in', Math.round(performance.now() - startTime), 'ms');
          
          showLoading(true, 'Merender halaman...');
          await loadPDFFromBase64(data.base64);
          
          const totalTime = Math.round(performance.now() - startTime);
          console.log('✅ Total load time:', totalTime, 'ms');
          
          showLoading(false);
          updateNavButtons();
          
        } catch (error) {
          console.error('Error:', error);
          showLoading(false);
          showFallbackViewer(state.currentBook.fileId);
        }
      }

      async function loadPDFFromBase64(base64Data) {
        const binaryString = atob(base64Data);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        
        const loadingTask = pdfjsLib.getDocument({
          data: bytes,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
        });
        
        state.pdfDoc = await loadingTask.promise;
        state.totalPages = state.pdfDoc.numPages;
        state.totalSpreads = Math.ceil(state.totalPages / 2);
        state.currentSpread = 0;
        
        await renderSpread(0);
      }

      function showFallbackViewer(fileId) {
        document.getElementById('pdfViewLeft').innerHTML = '';
        document.getElementById('pdfViewRight').innerHTML = 
          '<iframe src="https://drive.google.com/file/d/' + fileId + '/preview" style="width:100%;height:100%;border:none;"></iframe>';
        state.totalPages = 1;
        state.totalSpreads = 1;
        state.currentSpread = 0;
        DOM.pageNumLeft.textContent = '';
        DOM.pageNumRight.textContent = 'PDF Viewer';
        updateNavButtons();
      }

      // ===== RENDER SPREAD =====
      async function renderSpread(spreadIndex) {
        if (!state.pdfDoc) return;
        
        const leftPageNum = spreadIndex * 2 + 1;
        const rightPageNum = leftPageNum + 1;
        
        if (leftPageNum <= state.totalPages) {
          await renderPageToCanvas(leftPageNum, DOM.pdfCanvasLeft);
          DOM.pageNumLeft.textContent = 'Halaman ' + leftPageNum;
        } else {
          clearCanvas(DOM.pdfCanvasLeft);
          DOM.pageNumLeft.textContent = '';
        }
        
        if (rightPageNum <= state.totalPages) {
          await renderPageToCanvas(rightPageNum, DOM.pdfCanvasRight);
          DOM.pageNumRight.textContent = 'Halaman ' + rightPageNum;
        } else {
          clearCanvas(DOM.pdfCanvasRight);
          DOM.pageNumRight.textContent = '';
        }
      }

      async function renderPageToCanvas(pageNum, canvas) {
        if (!canvas || pageNum > state.totalPages || pageNum < 1) return;
        
        try {
          const page = await state.pdfDoc.getPage(pageNum);
          const parent = canvas.parentElement;
          const cw = parent.clientWidth - 10;
          const ch = parent.clientHeight - 10;
          
          const vp = page.getViewport({ scale: 1 });
          const scale = Math.min(cw / vp.width, ch / vp.height, 3);
          const svp = page.getViewport({ scale });
          
          canvas.height = svp.height;
          canvas.width = svp.width;
          
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          await page.render({
            canvasContext: ctx,
            viewport: svp,
            background: '#ffffff',
          }).promise;
          
        } catch (error) {
          console.error('Render error:', error);
          clearCanvas(canvas);
        }
      }

      // ===== FLIP =====
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads - 1) return;
        
        state.isFlipping = true;
        updateNavButtons();
        
        const nextLeftPage = (state.currentSpread + 1) * 2 + 1;
        if (nextLeftPage <= state.totalPages) {
          await renderPageToCanvas(nextLeftPage, DOM.pdfCanvasBack);
        }
        
        DOM.pageFlip.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        await sleep(650);
        
        state.currentSpread++;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        await renderSpread(state.currentSpread);
        
        await sleep(50);
        DOM.pageFlip.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        state.isFlipping = false;
        updateNavButtons();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        
        state.isFlipping = true;
        updateNavButtons();
        
        const prevRightPage = state.currentSpread * 2;
        if (prevRightPage <= state.totalPages) {
          await renderPageToCanvas(prevRightPage, DOM.pdfCanvasBack);
        }
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        state.currentSpread--;
        await renderSpread(state.currentSpread);
        
        await sleep(50);
        
        DOM.pageFlip.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        await sleep(650);
        
        state.isFlipping = false;
        updateNavButtons();
      }

      function goBack() {
        DOM.reader.classList.remove('active');
        state.pdfDoc = null;
        state.currentBook = null;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
      }

      // ===== EVENTS =====
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);

      document.addEventListener('keydown', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') { goBack(); }
      });

      let tx = 0;
      DOM.pageFront.addEventListener('touchstart', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        tx = e.touches[0].clientX;
      }, {passive: true});

      DOM.pageFront.addEventListener('touchend', function(e) {
        if (!state.currentBook || state.isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) { dx > 0 ? flipNext() : flipPrev(); }
        tx = 0;
      });

      DOM.pageFront.addEventListener('click', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        const rect = DOM.pageFront.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.3) flipPrev();
        else if (x > rect.width * 0.7) flipNext();
      });

      let rt;
      window.addEventListener('resize', function() {
        clearTimeout(rt);
        rt = setTimeout(function() {
          if (state.pdfDoc && state.currentBook) renderSpread(state.currentSpread);
        }, 300);
      });

      // ===== PWA =====
      if ('serviceWorker' in navigator) {
        const swBlob = new Blob([
          'const C="v3";self.addEventListener("install",e=>e.waitUntil(self.skipWaiting()));',
          'self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));',
          'self.addEventListener("fetch",e=>e.respondWith(fetch(e.request).then(r=>{const cl=r.clone();caches.open(C).then(c=>c.put(e.request,cl));return r}).catch(()=>caches.match(e.request))));'
        ], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
      }

      // ===== INIT =====
      console.log('📚 Digital Library Initialized');
      console.log('⚡ Optimized for speed (< 500ms)');
      console.log('🔍 Search ready');
      console.log('📅 Academic year grouping ready');
      fetchBooks();
    })();
  </script>
</body>
</html>
