<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0d0d">
  <title>📖 PDF Flip Book</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --text: #e0d5c5;
      --accent: #c9a87c;
      --gold: #d4a574;
      --page-bg: #fdf8f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x;
    }

    /* ===== APP SHELL ===== */
    .app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ===== LIBRARY ===== */
    .library {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1a1410 0%, #0d0d0d 50%, #1a1410 100%);
      display: flex;
      flex-direction: column;
      padding: 0;
      transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }

    .library.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    .lib-header {
      text-align: center;
      padding: 30px 20px 20px;
      flex-shrink: 0;
    }

    .lib-header h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--text);
      letter-spacing: 2px;
      font-weight: 400;
    }

    .lib-header p {
      color: #6b5e4e;
      font-size: 0.8rem;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      padding: 10px 20px 30px;
      align-content: start;
    }

    .book-list::-webkit-scrollbar {
      width: 4px;
    }

    .book-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .book-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .book-item {
      background: linear-gradient(160deg, #1e1e1e 0%, #151515 100%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 20px 15px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .book-item:hover {
      border-color: rgba(212,165,116,0.3);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .book-item:active {
      transform: scale(0.96);
    }

    .book-item .icon {
      font-size: 2.5rem;
    }

    .book-item .title {
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-item .fid {
      color: #4a3f35;
      font-size: 0.65rem;
      font-family: monospace;
    }

    /* ===== READER ===== */
    .reader {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }

    .reader.active {
      transform: translateX(0);
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .book-title-top {
      flex: 1;
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-info-top {
      color: #6b5e4e;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    /* ===== BOOK CONTAINER - FULLSCREEN BOOK ===== */
    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2500px;
      overflow: hidden;
      padding: 20px;
      background: radial-gradient(ellipse at center, #1a1410 0%, #0a0a0a 70%);
    }

    .book-surface {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 65%;
      height: 25px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== OPEN BOOK (DUA HALAMAN) ===== */
    .open-book {
      width: 95%;
      height: 90%;
      max-width: 1200px;
      max-height: 850px;
      position: relative;
      display: flex;
      transform-style: preserve-3d;
      z-index: 5;
    }

    /* Halaman Kiri */
    .page-left {
      width: 50%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform-origin: right center;
      transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 3;
    }

    .page-left.flip-left {
      transform: rotateY(-150deg);
      z-index: 1;
    }

    .page-left-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #f5ede1 0%, #fdf8f2 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px 2px 2px 12px;
      box-shadow: 
        inset 2px 0 10px rgba(0,0,0,0.05),
        -2px 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
    }

    .page-left-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, #e5d8c8 0%, #d5c8b0 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 2px 12px 12px 2px;
      box-shadow: 
        inset -2px 0 8px rgba(0,0,0,0.04),
        2px 0 10px rgba(0,0,0,0.08);
    }

    /* Halaman Kanan */
    .page-right {
      width: 50%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform-origin: left center;
      transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 3;
    }

    .page-right.flip-right {
      transform: rotateY(-150deg);
      z-index: 1;
    }

    .page-right-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(to left, #f5ede1 0%, #fdf8f2 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px 12px 12px 2px;
      box-shadow: 
        inset -2px 0 10px rgba(0,0,0,0.05),
        2px 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .page-right-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #e5d8c8 0%, #d5c8b0 100%);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 12px 2px 2px 12px;
      box-shadow: 
        inset 2px 0 8px rgba(0,0,0,0.04),
        -2px 0 10px rgba(0,0,0,0.08);
    }

    /* PDF Viewport dalam halaman - HORIZONTAL SCROLL */
    .pdf-viewport {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: center;
      padding: 15px;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
    }

    .pdf-viewport::-webkit-scrollbar {
      height: 5px;
    }

    .pdf-viewport::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.03);
      border-radius: 3px;
    }

    .pdf-viewport::-webkit-scrollbar-thumb {
      background: rgba(139,90,43,0.2);
      border-radius: 3px;
    }

    .pdf-viewport::-webkit-scrollbar-thumb:hover {
      background: rgba(139,90,43,0.35);
    }

    .pdf-canvas-wrapper {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 100%;
      scroll-snap-align: center;
    }

    .pdf-canvas {
      max-height: 100%;
      width: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 2px;
      background: white;
    }

    /* Page number footer */
    .page-footer {
      text-align: center;
      padding: 8px;
      font-size: 0.7rem;
      color: #999;
      border-top: 1px solid rgba(0,0,0,0.05);
      flex-shrink: 0;
      font-style: italic;
      background: rgba(253,248,242,0.5);
    }

    /* Spine/Binding */
    .book-spine {
      position: absolute;
      left: 50%;
      top: 1%;
      bottom: 1%;
      width: 6px;
      background: linear-gradient(to right, 
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.4) 20%,
        rgba(50,30,10,0.6) 50%,
        rgba(0,0,0,0.3) 80%,
        rgba(0,0,0,0.1) 100%
      );
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      border-radius: 3px;
      box-shadow: 
        0 0 10px rgba(0,0,0,0.3),
        inset 0 0 3px rgba(255,255,255,0.05);
    }

    /* ===== LOADING ===== */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spin-book {
      display: flex;
      gap: 4px;
    }

    .spin-book span {
      width: 10px;
      height: 35px;
      background: var(--accent);
      border-radius: 2px;
      animation: spinPage 1.2s infinite;
      transform-origin: left center;
    }

    .spin-book span:nth-child(2) { animation-delay: 0.2s; }
    .spin-book span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spinPage {
      0%, 100% { transform: rotateY(0); opacity: 1; }
      50% { transform: rotateY(-180deg); opacity: 0.3; }
    }

    .loading-text {
      color: #8a7a6a;
      margin-top: 15px;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    /* ===== NAVIGATION ===== */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(201,168,124,0.2);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.9);
    }

    .nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .page-indicator {
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      min-width: 90px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Error */
    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
      color: #c0392b;
    }

    /* Page curl */
    .page-curl-left {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 30px;
      height: 30px;
      pointer-events: none;
      z-index: 5;
    }

    .page-curl-left::before {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      border-style: solid;
      border-width: 0 0 25px 25px;
      border-color: transparent transparent #e0d0c0 transparent;
    }

    .page-curl-right {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 30px;
      height: 30px;
      pointer-events: none;
      z-index: 5;
    }

    .page-curl-right::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      border-style: solid;
      border-width: 0 25px 25px 0;
      border-color: transparent #e0d0c0 transparent transparent;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .open-book {
        width: 98%;
        height: 92%;
      }

      .pdf-viewport {
        padding: 10px;
      }

      .book-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .topbar {
        padding: 8px 10px;
      }

      .bottombar {
        padding: 10px 12px;
      }

      .nav-btn {
        width: 38px;
        height: 38px;
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .open-book {
        width: 100%;
        padding: 5px;
      }

      .pdf-viewport {
        padding: 5px;
      }

      .book-spine {
        width: 3px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .topbar {
        padding: 5px 10px;
      }
      .bottombar {
        padding: 5px 10px;
      }
      .book-area {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== LIBRARY ===== -->
    <div class="library" id="library">
      <div class="lib-header">
        <h1>📚 Digital Library</h1>
        <p>PDF Flip Book - Two Page Spread</p>
      </div>
      <div class="book-list" id="bookList">
        <div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:50px;color:#6b5e4e;">
          <div class="spin-book"><span></span><span></span><span></span></div>
          <div class="loading-text">Loading books...</div>
        </div>
      </div>
    </div>

    <!-- ===== READER ===== -->
    <div class="reader" id="reader">
      <!-- Top Bar -->
      <div class="topbar">
        <button class="btn-back" id="btnBack">← Library</button>
        <div class="book-title-top" id="bookTitleTop">Select a book</div>
        <div class="page-info-top" id="pageInfoTop">Pages 1-2</div>
      </div>

      <!-- Book Area -->
      <div class="book-area">
        <div class="book-surface"></div>
        
        <!-- Open Book (Two Pages) -->
        <div class="open-book" id="openBook">
          
          <!-- LEFT PAGE -->
          <div class="page-left" id="pageLeft">
            <div class="page-left-back"></div>
            <div class="page-left-front" id="pageLeftFront">
              <div class="pdf-viewport" id="pdfViewLeft">
                <div class="pdf-canvas-wrapper">
                  <canvas class="pdf-canvas" id="pdfCanvasLeft"></canvas>
                </div>
              </div>
              <div class="page-footer" id="pageFooterLeft">— Page 1 —</div>
              <div class="page-curl-left"></div>
            </div>
          </div>
          
          <!-- RIGHT PAGE -->
          <div class="page-right" id="pageRight">
            <div class="page-right-back"></div>
            <div class="page-right-front" id="pageRightFront">
              <div class="pdf-viewport" id="pdfViewRight">
                <div class="pdf-canvas-wrapper">
                  <canvas class="pdf-canvas" id="pdfCanvasRight"></canvas>
                </div>
              </div>
              <div class="page-footer" id="pageFooterRight">— Page 2 —</div>
              <div class="page-curl-right"></div>
            </div>
          </div>
          
          <!-- Spine -->
          <div class="book-spine"></div>
        </div>

        <!-- Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spin-book"><span></span><span></span><span></span></div>
          <div class="loading-text">Opening PDF...</div>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <div class="bottombar">
        <button class="nav-btn" id="btnPrev" disabled>◀</button>
        <span class="page-indicator" id="pageIndicator">1-2 / 1</span>
        <button class="nav-btn" id="btnNext" disabled>▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================
      // CONFIGURATION
      // ============================================
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // ============================================
      // STATE
      // ============================================
      let books = [];
      let currentBook = null;
      let pdfDoc = null;
      let currentSpread = 1; // Spread = dua halaman (kiri & kanan)
      let totalPages = 0;
      let totalSpreads = 0;
      let isFlipping = false;

      // ============================================
      // DOM ELEMENTS
      // ============================================
      const $ = (id) => document.getElementById(id);
      
      const library = $('library');
      const bookList = $('bookList');
      const reader = $('reader');
      const pageLeft = $('pageLeft');
      const pageRight = $('pageRight');
      const pdfViewLeft = $('pdfViewLeft');
      const pdfViewRight = $('pdfViewRight');
      const pdfCanvasLeft = $('pdfCanvasLeft');
      const pdfCanvasRight = $('pdfCanvasRight');
      const loadingOverlay = $('loadingOverlay');
      const pageFooterLeft = $('pageFooterLeft');
      const pageFooterRight = $('pageFooterRight');
      const pageIndicator = $('pageIndicator');
      const pageInfoTop = $('pageInfoTop');
      const bookTitleTop = $('bookTitleTop');
      const btnPrev = $('btnPrev');
      const btnNext = $('btnNext');
      const btnBack = $('btnBack');

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks() {
        try {
          const response = await fetch(WEBAPP_URL);
          const data = await response.json();
          
          if (data.success && data.books && data.books.length > 0) {
            books = data.books;
          } else {
            books = [{
              title: '📄 Sample PDF Document',
              fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
            }];
          }
        } catch (error) {
          console.warn('Using default book');
          books = [{
            title: '📄 Sample PDF Document',
            fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
          }];
        }
        renderLibrary();
      }

      function renderLibrary() {
        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        
        bookList.innerHTML = books.map((book, i) => `
          <div class="book-item" onclick="openBook(${i})">
            <div class="icon">${icons[i % icons.length]}</div>
            <div class="title">${escHtml(book.title)}</div>
            <div class="fid">${(book.fileId || '').substring(0, 10)}...</div>
          </div>
        `).join('');
      }

      // ============================================
      // OPEN BOOK
      // ============================================
      async function openBook(index) {
        currentBook = books[index];
        bookTitleTop.textContent = currentBook.title;
        
        // Reset state
        pdfDoc = null;
        currentSpread = 1;
        totalPages = 0;
        totalSpreads = 0;
        isFlipping = false;
        
        // Reset transforms
        pageLeft.style.transition = 'none';
        pageLeft.style.transform = 'rotateY(0deg)';
        pageLeft.classList.remove('flip-left');
        pageRight.style.transition = 'none';
        pageRight.style.transform = 'rotateY(0deg)';
        pageRight.classList.remove('flip-right');
        
        // Show reader
        reader.classList.add('active');
        showLoading(true);
        
        try {
          await loadPDF(currentBook.fileId);
        } catch (err) {
          console.error('PDF load error:', err);
          showFallback(currentBook.fileId);
        }
      }

      // ============================================
      // LOAD PDF
      // ============================================
      async function loadPDF(fileId) {
        const urls = [
          `https://drive.google.com/uc?export=download&id=${fileId}`,
          `https://drive.google.com/uc?id=${fileId}&export=download`,
        ];
        
        let loaded = false;
        
        for (const url of urls) {
          try {
            const loadingTask = pdfjsLib.getDocument({
              url: url,
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
            });
            
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            totalSpreads = Math.ceil(totalPages / 2);
            currentSpread = 1;
            
            await renderSpread(1);
            showLoading(false);
            updateUI();
            loaded = true;
            break;
          } catch (e) {
            console.warn('Failed:', url, e.message);
          }
        }
        
        if (!loaded) throw new Error('All URLs failed');
      }

      // ============================================
      // RENDER SPREAD (LEFT & RIGHT PAGES)
      // ============================================
      async function renderSpread(spreadNum) {
        if (!pdfDoc) return;
        
        const leftPageNum = (spreadNum - 1) * 2 + 1;
        const rightPageNum = leftPageNum + 1;
        
        // Render left page
        await renderPageToCanvas(leftPageNum, pdfCanvasLeft, pdfViewLeft);
        pageFooterLeft.textContent = leftPageNum <= totalPages ? `— Page ${leftPageNum} —` : '';
        
        // Render right page (if exists)
        if (rightPageNum <= totalPages) {
          await renderPageToCanvas(rightPageNum, pdfCanvasRight, pdfViewRight);
          pageFooterRight.textContent = `— Page ${rightPageNum} —`;
          pdfViewRight.style.display = 'flex';
          pageFooterRight.style.display = 'block';
        } else {
          // Hide right page if no content
          pdfCanvasRight.style.display = 'none';
          pageFooterRight.textContent = '';
        }
        
        pageInfoTop.textContent = `Pages ${leftPageNum}-${Math.min(rightPageNum, totalPages)}`;
        pageIndicator.textContent = `${spreadNum} / ${totalSpreads}`;
      }

      async function renderPageToCanvas(pageNum, canvas, viewport) {
        if (pageNum > totalPages) return;
        
        try {
          const page = await pdfDoc.getPage(pageNum);
          
          const containerW = viewport.clientWidth - 20;
          const containerH = viewport.clientHeight - 20;
          
          const vp = page.getViewport({ scale: 1 });
          const scale = Math.min(containerW / vp.width, containerH / vp.height, 2);
          const svp = page.getViewport({ scale });
          
          canvas.height = svp.height;
          canvas.width = svp.width;
          canvas.style.display = 'block';
          
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          await page.render({
            canvasContext: ctx,
            viewport: svp,
            background: '#ffffff',
          }).promise;
          
          // Horizontal scroll: center canvas
          viewport.scrollLeft = (canvas.width - viewport.clientWidth) / 2;
          
        } catch (err) {
          console.error('Render error page', pageNum, err);
        }
      }

      function showFallback(fileId) {
        showLoading(false);
        
        const iframeHtml = `
          <iframe 
            src="https://drive.google.com/file/d/${fileId}/preview"
            style="width:100%;height:100%;border:none;"
          ></iframe>`;
        
        pdfViewLeft.innerHTML = iframeHtml;
        pdfViewRight.innerHTML = iframeHtml;
        
        totalPages = 1;
        totalSpreads = 1;
        currentSpread = 1;
        pageFooterLeft.textContent = '— PDF Viewer —';
        pageFooterRight.textContent = '';
        updateUI();
      }

      // ============================================
      // FLIP ANIMATION (NEXT SPREAD)
      // ============================================
      async function flipNext() {
        if (isFlipping || currentSpread >= totalSpreads) return;
        
        isFlipping = true;
        disableNav();
        
        // Flip left page (current spread)
        pageLeft.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageLeft.classList.add('flip-left');
        
        // Flip right page
        pageRight.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageRight.classList.add('flip-right');
        
        await sleep(400);
        
        // Update spread
        currentSpread++;
        
        // Reset transforms instantly
        pageLeft.style.transition = 'none';
        pageLeft.classList.remove('flip-left');
        pageRight.style.transition = 'none';
        pageRight.classList.remove('flip-right');
        
        // Render new spread
        await renderSpread(currentSpread);
        
        // Restore transitions
        await sleep(50);
        pageLeft.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageRight.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        updateUI();
        isFlipping = false;
      }

      // ============================================
      // FLIP ANIMATION (PREV SPREAD)
      // ============================================
      async function flipPrev() {
        if (isFlipping || currentSpread <= 1) return;
        
        isFlipping = true;
        disableNav();
        
        // Set to flipped state first
        pageLeft.style.transition = 'none';
        pageLeft.classList.add('flip-left');
        pageRight.style.transition = 'none';
        pageRight.classList.add('flip-right');
        
        await sleep(50);
        
        // Update spread
        currentSpread--;
        await renderSpread(currentSpread);
        
        // Animate back
        pageLeft.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageLeft.classList.remove('flip-left');
        pageRight.style.transition = 'transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1)';
        pageRight.classList.remove('flip-right');
        
        await sleep(650);
        
        updateUI();
        isFlipping = false;
      }

      function updateUI() {
        btnPrev.disabled = currentSpread <= 1 || isFlipping;
        btnNext.disabled = currentSpread >= totalSpreads || isFlipping;
        pageIndicator.textContent = `${currentSpread} / ${totalSpreads}`;
      }

      function disableNav() {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }

      function showLoading(show) {
        loadingOverlay.classList.toggle('hidden', !show);
      }

      function goBack() {
        reader.classList.remove('active');
        pdfDoc = null;
        currentBook = null;
        pageLeft.style.transition = 'none';
        pageLeft.classList.remove('flip-left');
        pageRight.style.transition = 'none';
        pageRight.classList.remove('flip-right');
      }

      function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
      }

      function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      }

      // ============================================
      // EVENTS
      // ============================================
      btnPrev.addEventListener('click', flipPrev);
      btnNext.addEventListener('click', flipNext);
      btnBack.addEventListener('click', goBack);

      document.addEventListener('keydown', (e) => {
        if (!currentBook || isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault(); flipNext();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault(); flipPrev();
        } else if (e.key === 'Escape') {
          goBack();
        }
      });

      // Touch swipe
      let tx = 0;
      document.addEventListener('touchstart', (e) => {
        if (!currentBook || isFlipping) return;
        tx = e.touches[0].clientX;
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!currentBook || isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 50) {
          dx > 0 ? flipNext() : flipPrev();
        }
        tx = 0;
      });

      // Resize
      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (pdfDoc && currentBook) renderSpread(currentSpread);
        }, 400);
      });

      // Expose
      window.openBook = openBook;

      // Service Worker
      if ('serviceWorker' in navigator) {
        const sw = new Blob([`
          self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));
        `], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(()=>{});
      }

      // Init
      fetchBooks();
      console.log('✅ PDF Flip Book - Two Page Spread Ready');
    })();
  </script>
</body>
</html>
