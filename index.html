<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0d0d0d">
  <title>📖 PDF Flip Book</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --text: #e0d5c5;
      --accent: #c9a87c;
      --gold: #d4a574;
      --page-bg: #fdf8f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    /* ===== APP SHELL ===== */
    .app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ===== LIBRARY ===== */
    .library {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #1a1410 0%, #0d0d0d 50%, #1a1410 100%);
      display: flex;
      flex-direction: column;
      padding: 0;
      transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 10;
    }

    .library.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    .lib-header {
      text-align: center;
      padding: 30px 20px 20px;
      flex-shrink: 0;
    }

    .lib-header h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      color: var(--text);
      letter-spacing: 2px;
      font-weight: 400;
    }

    .lib-header p {
      color: #6b5e4e;
      font-size: 0.8rem;
      margin-top: 5px;
      letter-spacing: 1px;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      padding: 10px 20px 30px;
      align-content: start;
    }

    .book-list::-webkit-scrollbar {
      width: 4px;
    }

    .book-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .book-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }

    .book-item {
      background: linear-gradient(160deg, #1e1e1e 0%, #151515 100%);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 20px 15px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .book-item:hover {
      border-color: rgba(212,165,116,0.3);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .book-item:active {
      transform: scale(0.96);
    }

    .book-item .icon {
      font-size: 2.5rem;
    }

    .book-item .title {
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-item .fid {
      color: #4a3f35;
      font-size: 0.65rem;
      font-family: monospace;
    }

    /* ===== READER ===== */
    .reader {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      z-index: 20;
    }

    .reader.active {
      transform: translateX(0);
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 10px;
      flex-shrink: 0;
      z-index: 100;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-back:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .book-title-top {
      flex: 1;
      color: var(--text);
      font-size: 0.85rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-info-top {
      color: #6b5e4e;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    /* Book container */
    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      overflow: hidden;
      padding: 15px;
    }

    .book-shadow {
      position: absolute;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 70%);
      pointer-events: none;
    }

    .flip-book {
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 750px;
      position: relative;
      z-index: 5;
    }

    /* Page stacks */
    .stack {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #2a2218;
      border-radius: 2px 10px 10px 2px;
      pointer-events: none;
    }
    .stack:nth-child(1) { transform: translateX(3px) translateY(-2px); z-index: 1; opacity: 0.8; }
    .stack:nth-child(2) { transform: translateX(6px) translateY(-4px); z-index: 0; opacity: 0.6; }
    .stack:nth-child(3) { transform: translateX(9px) translateY(-6px); z-index: -1; opacity: 0.4; }

    /* Main page */
    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform-origin: left center;
      z-index: 5;
      transition: transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .page-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #e5d8c8, #d5c8b0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      border-radius: 10px 2px 2px 10px;
      box-shadow: inset -2px 0 8px rgba(0,0,0,0.06);
    }

    .page-front {
      position: absolute;
      inset: 0;
      background: var(--page-bg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-front::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 8px;
      background: linear-gradient(to right, rgba(0,0,0,0.04), transparent);
      pointer-events: none;
      z-index: 2;
    }

    /* PDF viewport */
    .pdf-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      background: repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(139,90,43,0.02) 29px, rgba(139,90,43,0.02) 30px);
    }

    .pdf-view::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .pdf-view::-webkit-scrollbar-track { background: transparent; }
    .pdf-view::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    .pdf-canvas {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 2px;
      background: #fff;
    }

    .page-num {
      text-align: center;
      padding: 8px;
      font-size: 0.7rem;
      color: #999;
      border-top: 1px solid rgba(0,0,0,0.05);
      flex-shrink: 0;
      font-style: italic;
    }

    /* Spine */
    .spine {
      position: absolute;
      left: 50%;
      top: 2%;
      bottom: 2%;
      width: 3px;
      background: linear-gradient(to right, rgba(0,0,0,0.3), rgba(0,0,0,0.5), rgba(0,0,0,0.2));
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      border-radius: 1px;
    }

    /* Loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spin-book {
      display: flex;
      gap: 3px;
    }

    .spin-book span {
      width: 8px;
      height: 30px;
      background: var(--accent);
      border-radius: 2px;
      animation: spinPage 1.2s infinite;
      transform-origin: left center;
    }
    .spin-book span:nth-child(2) { animation-delay: 0.2s; }
    .spin-book span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes spinPage {
      0%, 100% { transform: rotateY(0); opacity: 1; }
      50% { transform: rotateY(-180deg); opacity: 0.3; }
    }

    .loading-text {
      color: #8a7a6a;
      margin-top: 15px;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    /* Bottom bar */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(201,168,124,0.2);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.9);
    }

    .nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .page-indicator {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      min-width: 80px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      padding: 6px 14px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Error */
    .error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      text-align: center;
      color: #c0392b;
    }

    .error-box .icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .book-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px;
      }
      .book-item {
        padding: 15px 10px;
      }
      .book-item .icon {
        font-size: 2rem;
      }
      .book-item .title {
        font-size: 0.75rem;
      }
      .pdf-view {
        padding: 10px;
      }
      .topbar {
        padding: 8px 10px;
      }
      .bottombar {
        padding: 10px 12px;
        gap: 10px;
      }
      .nav-btn {
        width: 36px;
        height: 36px;
      }
    }

    @media (max-width: 380px) {
      .book-list {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .topbar {
        padding: 5px 10px;
      }
      .bottombar {
        padding: 5px 10px;
      }
      .pdf-view {
        padding: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- LIBRARY -->
    <div class="library" id="library">
      <div class="lib-header">
        <h1>📚 Digital Library</h1>
        <p>PDF Flip Book Collection</p>
      </div>
      <div class="book-list" id="bookList">
        <div style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:50px;color:#6b5e4e;">
          <div class="spin-book">
            <span></span><span></span><span></span>
          </div>
          <div class="loading-text">Loading books...</div>
        </div>
      </div>
    </div>

    <!-- READER -->
    <div class="reader" id="reader">
      <div class="topbar">
        <button class="btn-back" id="btnBack">← Library</button>
        <div class="book-title-top" id="bookTitleTop">Select a book</div>
        <div class="page-info-top" id="pageInfoTop">Page 1</div>
      </div>

      <div class="book-area">
        <div class="book-shadow"></div>
        
        <div class="flip-book">
          <div class="stack"></div>
          <div class="stack"></div>
          <div class="stack"></div>
          
          <div class="page" id="mainPage">
            <div class="page-back"></div>
            <div class="page-front" id="pageFront">
              <div class="pdf-view" id="pdfView">
                <canvas class="pdf-canvas" id="pdfCanvas"></canvas>
              </div>
              <div class="page-num" id="pageNum">— Page 1 —</div>
            </div>
          </div>
          
          <div class="spine"></div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
          <div class="spin-book">
            <span></span><span></span><span></span>
          </div>
          <div class="loading-text">Opening PDF...</div>
        </div>
      </div>

      <div class="bottombar">
        <button class="nav-btn" id="btnPrev" disabled>◀</button>
        <span class="page-indicator" id="pageIndicator">1 / 1</span>
        <button class="nav-btn" id="btnNext" disabled>▶</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================
      // CONFIGURATION
      // ============================================
      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      
      // Set PDF.js worker
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      // ============================================
      // STATE
      // ============================================
      let books = [];
      let currentBook = null;
      let pdfDoc = null;
      let currentPage = 1;
      let totalPages = 0;
      let isFlipping = false;
      let isRendering = false;

      // ============================================
      // DOM ELEMENTS
      // ============================================
      const $ = (id) => document.getElementById(id);
      
      const library = $('library');
      const bookList = $('bookList');
      const reader = $('reader');
      const mainPage = $('mainPage');
      const pageFront = $('pageFront');
      const pdfView = $('pdfView');
      const pdfCanvas = $('pdfCanvas');
      const loadingOverlay = $('loadingOverlay');
      const pageNum = $('pageNum');
      const pageIndicator = $('pageIndicator');
      const pageInfoTop = $('pageInfoTop');
      const bookTitleTop = $('bookTitleTop');
      const btnPrev = $('btnPrev');
      const btnNext = $('btnNext');
      const btnBack = $('btnBack');

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks() {
        try {
          const response = await fetch(WEBAPP_URL);
          const data = await response.json();
          
          if (data.success && data.books && data.books.length > 0) {
            books = data.books;
            renderLibrary();
          } else {
            // Fallback: gunakan default book
            books = [{
              title: '📄 Sample PDF Document',
              url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy',
              fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
            }];
            renderLibrary();
          }
        } catch (error) {
          console.warn('Cannot fetch from WebApp, using default book');
          books = [{
            title: '📄 Sample PDF Document',
            url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy',
            fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy'
          }];
          renderLibrary();
        }
      }

      function renderLibrary() {
        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        
        bookList.innerHTML = books.map((book, i) => `
          <div class="book-item" onclick="openBook(${i})">
            <div class="icon">${icons[i % icons.length]}</div>
            <div class="title">${escHtml(book.title)}</div>
            <div class="fid">${(book.fileId || '').substring(0, 10)}...</div>
          </div>
        `).join('');
      }

      // ============================================
      // OPEN BOOK
      // ============================================
      async function openBook(index) {
        currentBook = books[index];
        bookTitleTop.textContent = currentBook.title;
        
        // Reset
        pdfDoc = null;
        currentPage = 1;
        totalPages = 0;
        isFlipping = false;
        
        // Show reader
        reader.classList.add('active');
        
        // Reset page transform
        mainPage.style.transition = 'none';
        mainPage.style.transform = 'rotateY(0deg)';
        
        // Reset canvas
        pdfView.innerHTML = '<canvas class="pdf-canvas" id="pdfCanvas"></canvas>';
        // Update reference
        window._pdfCanvas = pdfView.querySelector('#pdfCanvas');
        
        updateUI();
        showLoading(true);
        
        try {
          await loadPDF(currentBook.fileId);
        } catch (err) {
          console.error('PDF load error:', err);
          showFallback(currentBook.fileId);
        }
      }

      // ============================================
      // LOAD PDF
      // ============================================
      async function loadPDF(fileId) {
        // Try multiple URL patterns
        const urls = [
          `https://drive.google.com/uc?export=download&id=${fileId}`,
          `https://drive.google.com/uc?id=${fileId}&export=download`,
          `https://docs.google.com/file/d/${fileId}/preview`,
        ];
        
        let loaded = false;
        
        for (const url of urls) {
          try {
            const loadingTask = pdfjsLib.getDocument({
              url: url,
              cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
              cMapPacked: true,
              withCredentials: false,
            });
            
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            
            await renderPage(1);
            showLoading(false);
            updateUI();
            loaded = true;
            break;
          } catch (e) {
            console.warn('Failed with URL:', url, e.message);
            continue;
          }
        }
        
        if (!loaded) {
          throw new Error('All URL patterns failed');
        }
      }

      // ============================================
      // RENDER PAGE
      // ============================================
      async function renderPage(pageNum) {
        if (!pdfDoc) return;
        
        isRendering = true;
        const canvas = pdfView.querySelector('#pdfCanvas') || window._pdfCanvas;
        
        if (!canvas) {
          isRendering = false;
          return;
        }
        
        try {
          const page = await pdfDoc.getPage(pageNum);
          
          const containerW = pdfView.clientWidth - 30;
          const containerH = pdfView.clientHeight - 30;
          
          const vp = page.getViewport({ scale: 1 });
          const scale = Math.min(containerW / vp.width, containerH / vp.height, 2.5);
          const svp = page.getViewport({ scale });
          
          canvas.height = svp.height;
          canvas.width = svp.width;
          
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          await page.render({
            canvasContext: ctx,
            viewport: svp,
            background: '#ffffff',
          }).promise;
          
          pageNum.textContent = `— Page ${pageNum} —`;
          pageInfoTop.textContent = `Page ${pageNum}`;
          pageIndicator.textContent = `${pageNum} / ${totalPages}`;
          
        } catch (err) {
          console.error('Render error:', err);
        }
        
        isRendering = false;
      }

      function showFallback(fileId) {
        showLoading(false);
        pdfView.innerHTML = `
          <iframe 
            src="https://drive.google.com/file/d/${fileId}/preview"
            style="width:100%;height:100%;border:none;border-radius:4px;"
            allow="autoplay"
          ></iframe>`;
        totalPages = 1;
        currentPage = 1;
        pageNum.textContent = '— PDF Viewer —';
        updateUI();
      }

      // ============================================
      // FLIP ANIMATION
      // ============================================
      async function flipNext() {
        if (isFlipping || isRendering || currentPage >= totalPages) return;
        
        isFlipping = true;
        disableNav();
        
        // Animate flip
        mainPage.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        mainPage.style.transform = 'rotateY(-180deg)';
        
        await sleep(350);
        
        currentPage++;
        
        // Reset instantly
        mainPage.style.transition = 'none';
        mainPage.style.transform = 'rotateY(0deg)';
        
        await renderPage(currentPage);
        
        await sleep(50);
        mainPage.style.transition = 'transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        updateUI();
        isFlipping = false;
      }

      async function flipPrev() {
        if (isFlipping || isRendering || currentPage <= 1) return;
        
        isFlipping = true;
        disableNav();
        
        currentPage--;
        await renderPage(currentPage);
        
        // Set to flipped position
        mainPage.style.transition = 'none';
        mainPage.style.transform = 'rotateY(-180deg)';
        
        await sleep(50);
        
        // Animate back
        mainPage.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        mainPage.style.transform = 'rotateY(0deg)';
        
        await sleep(600);
        
        updateUI();
        isFlipping = false;
      }

      function updateUI() {
        btnPrev.disabled = currentPage <= 1 || isFlipping;
        btnNext.disabled = currentPage >= totalPages || isFlipping;
        pageIndicator.textContent = `${currentPage} / ${totalPages}`;
      }

      function disableNav() {
        btnPrev.disabled = true;
        btnNext.disabled = true;
      }

      function showLoading(show) {
        loadingOverlay.classList.toggle('hidden', !show);
      }

      function goBack() {
        reader.classList.remove('active');
        pdfDoc = null;
        currentBook = null;
        mainPage.style.transition = 'none';
        mainPage.style.transform = 'rotateY(0deg)';
      }

      function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
      }

      function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      }

      // ============================================
      // EVENTS
      // ============================================
      btnPrev.addEventListener('click', flipPrev);
      btnNext.addEventListener('click', flipNext);
      btnBack.addEventListener('click', goBack);

      document.addEventListener('keydown', (e) => {
        if (!currentBook) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault(); flipNext();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
          e.preventDefault(); flipPrev();
        } else if (e.key === 'Escape') {
          goBack();
        }
      });

      // Touch
      let tx = 0, ty = 0;
      document.addEventListener('touchstart', (e) => {
        if (!currentBook || isFlipping) return;
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
      }, {passive: true});

      document.addEventListener('touchend', (e) => {
        if (!currentBook || isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        const dy = ty - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
          dx > 0 ? flipNext() : flipPrev();
        }
        tx = 0;
      });

      // Click edges
      pageFront.addEventListener('click', (e) => {
        if (!currentBook || isFlipping) return;
        const rect = pageFront.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.25) flipPrev();
        else if (x > rect.width * 0.75) flipNext();
      });

      // Resize
      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (pdfDoc && currentBook) renderPage(currentPage);
        }, 400);
      });

      // Expose
      window.openBook = openBook;

      // Service Worker
      if ('serviceWorker' in navigator) {
        const sw = new Blob([`
          self.addEventListener('install',e=>e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>caches.match(e.request))));
        `], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(sw)).catch(()=>{});
      }

      // Init
      fetchBooks();
      console.log('✅ PDF Flip Book Ready');
    })();
  </script>
</body>
</html>
