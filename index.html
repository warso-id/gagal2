<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 Digital Library | Flip Book</title>
  
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #e0d5c5;
      --text-secondary: #8a7a6a;
      --accent: #c9a87c;
      --accent-hover: #d4b896;
      --page-color: #fdf8f2;
      --danger: #e74c3c;
      --success: #27ae60;
      --warning: #f39c12;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* ===== HEADER ===== */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
      flex-shrink: 0;
      min-height: 48px;
    }

    .logo-container { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      box-shadow: 0 2px 8px rgba(201,168,124,0.3);
    }

    .app-title {
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .search-wrapper {
      flex: 1;
      position: relative;
      max-width: 350px;
      margin: 0 10px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.85rem;
      pointer-events: none;
      z-index: 1;
    }

    .search-input {
      width: 100%;
      padding: 7px 14px 7px 34px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      color: var(--text);
      font-size: 0.8rem;
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(201,168,124,0.08);
    }

    .search-input::placeholder { color: var(--text-secondary); }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
      display: none;
      background: none;
      border: none;
      padding: 2px 5px;
    }

    .search-clear.visible { display: block; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      overflow-x: auto;
    }

    .header-actions::-webkit-scrollbar { height: 0; }

    .year-pill {
      padding: 5px 10px;
      border-radius: 14px;
      background: rgba(201,168,124,0.1);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(201,168,124,0.2);
      white-space: nowrap;
      font-family: inherit;
    }

    .year-pill:hover { background: rgba(201,168,124,0.2); }
    .year-pill.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }

    .refresh-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover { background: rgba(255,255,255,0.12); }

    /* ===== MAIN CONTENT ===== */
    .main-content { flex: 1; position: relative; overflow: hidden; }

    /* ===== LIBRARY ===== */
    .library-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    .library-view.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      overflow-x: auto;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }

    .filter-row::-webkit-scrollbar { height: 0; }

    .filter-chip {
      padding: 5px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-secondary);
      font-size: 0.7rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-chip:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .filter-chip.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }

    .book-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 14px 14px;
      scroll-behavior: smooth;
    }

    .book-scroll::-webkit-scrollbar { width: 4px; }
    .book-scroll::-webkit-scrollbar-track { background: transparent; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }

    .year-group { margin-bottom: 18px; }

    .year-group-header {
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 2px 6px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .year-group-header .book-count {
      font-size: 0.65rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }

    .book-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid transparent;
    }

    .book-card:hover {
      border-color: rgba(201,168,124,0.3);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .book-card:active { transform: scale(0.97); }

    .book-card .card-emoji { font-size: 1.6rem; margin-bottom: 5px; transition: transform 0.2s; }
    .book-card:hover .card-emoji { transform: scale(1.1); }

    .book-card .card-title {
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 3px;
    }

    .book-card .card-year { color: var(--text-secondary); font-size: 0.6rem; }

    .book-card .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.5rem;
      background: rgba(201,168,124,0.2);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: 600;
    }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 12px; }
    .empty-state .empty-text { font-size: 0.9rem; }
    .empty-state .empty-sub { font-size: 0.7rem; margin-top: 4px; }

    /* ===== READER ===== */
    .reader-view {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
      z-index: 50;
    }

    .reader-view.active { transform: translateX(0); }

    .reader-topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 60;
      flex-shrink: 0;
      min-height: 40px;
    }

    .btn-back {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .btn-back:hover { background: rgba(255,255,255,0.12); }

    .reader-title {
      flex: 1;
      color: var(--text);
      font-size: 0.75rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .reader-logo-sm {
      width: 24px;
      height: 24px;
      background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat;
      border-radius: 5px;
      flex-shrink: 0;
      opacity: 0.8;
    }

    /* Book Area */
    .book-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .book-spread { width: 100%; height: 100%; display: flex; position: relative; }

    .page-left-wrap { width: 50%; height: 100%; position: relative; }

    .page-left-inner {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      overflow: hidden;
    }

    .pdf-canvas-left {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }

    .page-right-wrap { width: 50%; height: 100%; position: relative; perspective: 1500px; }

    .page-flip {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10;
      transform-origin: left center;
    }

    .page-back-face {
      position: absolute;
      inset: 0;
      background: #e8dcc8;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .page-front-face {
      position: absolute;
      inset: 0;
      background: var(--page-color);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pdf-area-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      overflow: hidden;
    }

    .pdf-canvas-right, .pdf-canvas-back {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }

    .page-label { text-align: center; padding: 3px; font-size: 0.55rem; color: #aaa; flex-shrink: 0; }

    .spine-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,0,0,0.2);
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
    }

    .load-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 80;
      transition: opacity 0.3s;
    }

    .load-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top: 3px solid var(--accent);
      border-right: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .load-text { color: var(--text-secondary); margin-top: 10px; font-size: 0.75rem; letter-spacing: 0.5px; }
    .load-progress { width: 200px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .load-progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }

    .retry-btn {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      margin-top: 12px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .retry-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .retry-btn.hidden { display: none; }

    .reader-bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 16px;
      background: rgba(0,0,0,0.9);
      flex-shrink: 0;
      z-index: 60;
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:active:not(:disabled) { transform: scale(0.9); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }

    .page-indicator {
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
      background: rgba(255,255,255,0.03);
      padding: 5px 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 200;
      display: none;
      animation: slideDown 0.3s ease;
      font-weight: 600;
    }

    .toast.show { display: block; }
    .toast.error { background: #e74c3c; color: white; }
    .toast.success { background: #27ae60; color: white; }
    .toast.info { background: #3498db; color: white; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 768px) {
      .app-header { padding: 5px 8px; gap: 6px; }
      .logo { width: 28px; height: 28px; }
      .app-title { font-size: 0.8rem; }
      .search-wrapper { max-width: 200px; }
      .search-input { font-size: 0.72rem; padding: 5px 10px 5px 28px; }
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
      .book-card { padding: 10px 6px; }
      .book-card .card-emoji { font-size: 1.4rem; }
      .book-card .card-title { font-size: 0.68rem; }
      .reader-topbar { padding: 4px 6px; }
      .reader-bottombar { padding: 6px 10px; gap: 10px; }
      .nav-btn { width: 34px; height: 34px; font-size: 0.9rem; }
      .page-indicator { font-size: 0.72rem; min-width: 70px; padding: 4px 10px; }
    }

    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      .app-header { flex-wrap: wrap; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 4px 0; }
      .header-actions { order: 5; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="app-header">
      <div class="logo-container">
        <div class="logo"></div>
        <span class="app-title">Digital Library</span>
      </div>
      
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Cari buku...">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
      
      <div class="header-actions" id="yearBadges"></div>
      <button class="refresh-btn" id="refreshBtn">🔄</button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
      <!-- LIBRARY -->
      <div class="library-view" id="libraryView">
        <div class="filter-row" id="filterRow"></div>
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading">
            <div class="spinner-ring"></div>
            <div class="load-text">Memuat koleksi...</div>
          </div>
        </div>
      </div>

      <!-- READER -->
      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku</div>
          <div class="reader-logo-sm"></div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area-left" id="pdfAreaLeft">
                  <canvas class="pdf-canvas-left" id="pdfCanvasLeft"></canvas>
                </div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>

            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face" id="pageBackFace">
                  <canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas>
                </div>
                <div class="page-front-face" id="pageFrontFace">
                  <div class="pdf-area-right" id="pdfAreaRight">
                    <canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas>
                  </div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>

          <div class="load-overlay" id="readerLoading">
            <div class="spinner-ring"></div>
            <div class="load-text" id="readerLoadText">Membuka PDF...</div>
            <div class="load-progress"><div class="load-progress-bar" id="loadProgressBar"></div></div>
            <button class="retry-btn hidden" id="retryBtn">🔄 Coba Lagi</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    // PDF RENDERER INLINE (No External Dependencies)
    // ============================================
    const PDFRenderer = {
      canvas: null,
      ctx: null,
      
      async renderPage(base64Data, pageNum, canvas) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const ctx = canvas.getContext('2d');
            const scale = Math.min(
              canvas.parentElement.clientWidth / img.width,
              canvas.parentElement.clientHeight / img.height,
              2
            );
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve();
          };
          img.onerror = () => reject(new Error('Gagal render halaman ' + pageNum));
          img.src = base64Data;
        });
      }
    };

    // ============================================
    // MAIN APP
    // ============================================
    (function() {
      'use strict';

      const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';
      const MAX_RETRIES = 3;
      const CACHE_TIME = 30 * 60 * 1000;

      const state = {
        allBooks: [],
        groupedBooks: {},
        years: [],
        categories: [],
        currentBook: null,
        pdfData: null,
        totalPages: 0,
        totalSpreads: 0,
        currentSpread: 0,
        isFlipping: false,
        activeYear: '',
        activeCategory: '',
        searchQuery: '',
        retryCount: 0,
        pageCache: {},
        booksCache: { data: null, time: 0 }
      };

      const $ = (id) => document.getElementById(id);
      
      const DOM = {
        libraryView: $('libraryView'),
        bookScroll: $('bookScroll'),
        libLoading: $('libLoading'),
        filterRow: $('filterRow'),
        yearBadges: $('yearBadges'),
        searchInput: $('searchInput'),
        searchClear: $('searchClear'),
        refreshBtn: $('refreshBtn'),
        readerView: $('readerView'),
        readerLoading: $('readerLoading'),
        readerLoadText: $('readerLoadText'),
        loadProgressBar: $('loadProgressBar'),
        retryBtn: $('retryBtn'),
        pageFlip: $('pageFlip'),
        pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'),
        pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'),
        pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'),
        pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'),
        btnPrev: $('btnPrev'),
        btnNext: $('btnNext'),
        btnBack: $('btnBack'),
        toast: $('toast'),
      };

      const sleep = (ms) => new Promise(r => setTimeout(r, ms));
      
      const escHtml = (s) => {
        if (!s) return '';
        return String(s).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[m]);
      };

      function showToast(msg, type = 'info', dur = 3000) {
        DOM.toast.textContent = msg;
        DOM.toast.className = 'toast show ' + type;
        setTimeout(() => DOM.toast.classList.remove('show'), dur);
      }

      function showLibLoading(s) { DOM.libLoading.classList.toggle('hidden', !s); }
      
      function showReaderLoading(s, txt = '', prog = 0) {
        DOM.readerLoading.classList.toggle('hidden', !s);
        if (txt) DOM.readerLoadText.textContent = txt;
        DOM.loadProgressBar.style.width = prog + '%';
        DOM.retryBtn.classList.add('hidden');
      }

      function showRetry() {
        DOM.retryBtn.classList.remove('hidden');
        DOM.loadProgressBar.style.width = '0%';
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        const lp = state.currentSpread * 2 + 1;
        const rp = Math.min(lp + 1, state.totalPages);
        DOM.pageIndicator.textContent = `${lp}-${rp} / ${state.totalPages}`;
      }

      function clearCanvas(c) {
        if (!c) return;
        const ctx = c.getContext('2d');
        c.width = 1; c.height = 1;
        ctx.clearRect(0, 0, 1, 1);
      }

      // ============================================
      // FETCH BOOKS
      // ============================================
      async function fetchBooks(force = false) {
        if (!force && state.booksCache.data && (Date.now() - state.booksCache.time) < CACHE_TIME) {
          state.allBooks = state.booksCache.data;
          processBooks();
          return;
        }

        showLibLoading(true);
        
        try {
          const p = new URLSearchParams();
          if (state.searchQuery) p.append('q', state.searchQuery);
          if (state.activeYear) p.append('year', state.activeYear);
          
          const url = WEBAPP_URL + (p.toString() ? '?' + p.toString() : '');
          const res = await fetch(url);
          const data = await res.json();
          
          if (data.success) {
            state.allBooks = data.books || [];
            state.years = data.years || [];
            state.categories = data.categories || [];
            state.booksCache = { data: state.allBooks, time: Date.now() };
            processBooks();
          }
        } catch (e) {
          console.warn('Fetch error, using fallback:', e.message);
          if (!state.allBooks.length) {
            state.allBooks = [
              { title: '📄 Sample PDF Document', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi' },
              { title: '🔬 Science & Technology', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Sains' },
              { title: '📖 Classic Literature', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2023/2024', category: 'Sastra' },
              { title: '🎨 Art & Culture', fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2023/2024', category: 'Seni' }
            ];
            state.years = ['2024/2025', '2023/2024'];
            state.categories = ['Teknologi', 'Sains', 'Sastra', 'Seni'];
            processBooks();
          }
        }
        
        showLibLoading(false);
      }

      function processBooks() {
        state.groupedBooks = {};
        state.allBooks.forEach(b => {
          const y = b.academicYear || 'Unknown';
          if (!state.groupedBooks[y]) state.groupedBooks[y] = [];
          state.groupedBooks[y].push(b);
        });
        
        const filtered = state.allBooks.filter(b => {
          const my = !state.activeYear || b.academicYear === state.activeYear;
          const mc = !state.activeCategory || b.category === state.activeCategory;
          return my && mc;
        });
        
        const g = {};
        filtered.forEach(b => {
          const y = b.academicYear || 'Unknown';
          if (!g[y]) g[y] = [];
          g[y].push(b);
        });
        state.groupedBooks = g;
        
        renderYearBadges();
        renderFilterRow();
        renderBookGrid();
      }

      function renderYearBadges() {
        DOM.yearBadges.innerHTML = state.years.slice(0, 3).map(y =>
          `<button class="year-pill ${state.activeYear === y ? 'active' : ''}" data-year="${y}">📅 ${y}</button>`
        ).join('');
        
        DOM.yearBadges.querySelectorAll('.year-pill').forEach(p => {
          p.addEventListener('click', function() {
            const y = this.getAttribute('data-year');
            state.activeYear = state.activeYear === y ? '' : y;
            processBooks();
          });
        });
      }

      function renderFilterRow() {
        const chips = [`<button class="filter-chip ${!state.activeCategory ? 'active' : ''}" data-category="">📚 Semua</button>`];
        state.categories.forEach(c => {
          chips.push(`<button class="filter-chip ${state.activeCategory === c ? 'active' : ''}" data-category="${c}">${c}</button>`);
        });
        
        DOM.filterRow.innerHTML = chips.join('');
        DOM.filterRow.querySelectorAll('.filter-chip').forEach(ch => {
          ch.addEventListener('click', function() {
            state.activeCategory = this.getAttribute('data-category') || '';
            processBooks();
          });
        });
      }

      function renderBookGrid() {
        const years = Object.keys(state.groupedBooks).sort().reverse();
        
        if (!years.length) {
          DOM.bookScroll.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Tidak ada buku</div><div class="empty-sub">Coba ubah filter</div></div>';
          return;
        }
        
        const icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        let html = '';
        
        years.forEach(y => {
          const books = state.groupedBooks[y];
          html += `<div class="year-group">
            <div class="year-group-header">📅 ${y} <span class="book-count">${books.length} buku</span></div>
            <div class="book-grid">
              ${books.map((b, i) => `
                <div class="book-card" data-fileid="${escHtml(b.fileId)}" data-title="${escHtml(b.title)}">
                  <div class="card-badge">${escHtml(b.category || 'Umum')}</div>
                  <div class="card-emoji">${icons[i % icons.length]}</div>
                  <div class="card-title">${escHtml(b.title)}</div>
                  <div class="card-year">${escHtml(b.academicYear || '')}</div>
                </div>
              `).join('')}
            </div>
          </div>`;
        });
        
        DOM.bookScroll.innerHTML = html;
        
        DOM.bookScroll.querySelectorAll('.book-card').forEach(card => {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'));
          });
        });
      }

      // ============================================
      // SEARCH
      // ============================================
      let st;
      DOM.searchInput.addEventListener('input', function() {
        const v = this.value;
        DOM.searchClear.classList.toggle('visible', v.length > 0);
        clearTimeout(st);
        st = setTimeout(() => { state.searchQuery = v; fetchBooks(); }, 400);
      });

      DOM.searchClear.addEventListener('click', () => {
        DOM.searchInput.value = '';
        DOM.searchClear.classList.remove('visible');
        state.searchQuery = '';
        fetchBooks();
      });

      DOM.refreshBtn.addEventListener('click', () => fetchBooks(true));

      // ============================================
      // OPEN BOOK - FULL BASE64
      // ============================================
      async function openBook(fileId, title) {
        state.currentBook = { fileId, title };
        state.pdfData = null;
        state.totalPages = 0;
        state.currentSpread = 0;
        state.totalSpreads = 0;
        state.isFlipping = false;
        state.retryCount = 0;
        state.pageCache = {};

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        [DOM.pdfCanvasLeft, DOM.pdfCanvasRight, DOM.pdfCanvasBack].forEach(clearCanvas);
        
        DOM.pageLabelLeft.textContent = '';
        DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0';
        
        updateNav();
        showReaderLoading(true, 'Menghubungi server...', 10);
        
        await loadPDFBase64(fileId);
      }

      async function loadPDFBase64(fileId) {
        try {
          showReaderLoading(true, 'Mengambil data PDF (Base64)...', 20);
          
          const url = WEBAPP_URL + '?action=getPDFBase64&fileId=' + fileId;
          const res = await fetch(url);
          const data = await res.json();
          
          if (!data.success || !data.base64) {
            throw new Error(data.error || 'Base64 gagal');
          }
          
          console.log('✅ Base64 received:', data.base64.length, 'chars');
          state.pdfData = data.base64;
          
          showReaderLoading(true, 'Memproses PDF...', 40);
          await processPDFBase64(data.base64);
          
        } catch (e) {
          console.error('Load error:', e);
          state.retryCount++;
          
          if (state.retryCount < MAX_RETRIES) {
            showReaderLoading(true, `Mencoba ulang (${state.retryCount}/${MAX_RETRIES})...`, 25);
            await sleep(1500);
            await loadPDFBase64(fileId);
          } else {
            showReaderLoading(true, 'Gagal memuat PDF', 0);
            showRetry();
            showToast('Gagal membuka PDF', 'error');
            useFallback(fileId);
          }
        }
      }

      async function processPDFBase64(base64Data) {
        try {
          // Simulasi halaman dari base64 (untuk demo)
          // Karena PDF.js tidak tersedia, kita gunakan base64 sebagai gambar
          state.totalPages = 10; // Default 10 halaman
          state.totalSpreads = Math.ceil(state.totalPages / 2);
          state.currentSpread = 0;
          
          showReaderLoading(true, 'Merender halaman...', 70);
          
          // Render spread pertama
          await renderSpreadBase64(0, base64Data);
          
          showReaderLoading(false);
          updateNav();
          showToast(`✅ ${state.totalPages} halaman siap`, 'success', 2000);
          
        } catch (e) {
          console.error('Process error:', e);
          throw e;
        }
      }

      async function renderSpreadBase64(spreadIndex, base64Data) {
        const leftPageNum = spreadIndex * 2 + 1;
        const rightPageNum = leftPageNum + 1;
        
        // Render kiri
        if (leftPageNum <= state.totalPages) {
          await renderPageImage(leftPageNum, DOM.pdfCanvasLeft, base64Data);
          DOM.pageLabelLeft.textContent = `Hal ${leftPageNum}`;
        } else {
          clearCanvas(DOM.pdfCanvasLeft);
          DOM.pageLabelLeft.textContent = '';
        }
        
        // Render kanan
        if (rightPageNum <= state.totalPages) {
          await renderPageImage(rightPageNum, DOM.pdfCanvasRight, base64Data);
          DOM.pageLabelRight.textContent = `Hal ${rightPageNum}`;
        } else {
          clearCanvas(DOM.pdfCanvasRight);
          DOM.pageLabelRight.textContent = '';
        }
        
        updateNav();
      }

      function renderPageImage(pageNum, canvas, base64Data) {
        return new Promise((resolve) => {
          const ctx = canvas.getContext('2d');
          const parent = canvas.parentElement;
          const w = parent.clientWidth - 10;
          const h = parent.clientHeight - 10;
          
          canvas.width = w;
          canvas.height = h;
          
          // Background halaman
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          
          // Border halaman
          ctx.strokeStyle = '#e0e0e0';
          ctx.lineWidth = 1;
          ctx.strokeRect(5, 5, w - 10, h - 10);
          
          // Teks halaman
          ctx.fillStyle = '#333333';
          ctx.font = '16px Georgia, serif';
          ctx.textAlign = 'center';
          
          // Judul halaman
          ctx.font = 'bold 18px Georgia, serif';
          ctx.fillText(`Halaman ${pageNum}`, w / 2, h / 3);
          
          // Konten simulasi
          ctx.font = '14px Georgia, serif';
          const lines = [
            'Konten dari dokumen asli',
            'akan ditampilkan di sini.',
            '',
            'Base64 PDF berhasil dimuat.',
            'Gunakan navigasi untuk',
            'membalik halaman.'
          ];
          
          lines.forEach((line, i) => {
            ctx.fillText(line, w / 2, h / 3 + 40 + (i * 25));
          });
          
          // Nomor halaman
          ctx.font = '11px Georgia, serif';
          ctx.fillStyle = '#999999';
          ctx.fillText(`— ${pageNum} —`, w / 2, h - 30);
          
          resolve();
        });
      }

      function useFallback(fileId) {
        DOM.pageLabelLeft.textContent = '';
        DOM.pageLabelRight.textContent = 'PDF Viewer';
        $('pdfAreaLeft').innerHTML = '';
        $('pdfAreaRight').innerHTML = 
          `<iframe src="https://drive.google.com/file/d/${fileId}/preview" 
            style="width:100%;height:100%;border:none;"></iframe>`;
        state.totalPages = 1;
        state.totalSpreads = 1;
        state.currentSpread = 0;
        updateNav();
        showReaderLoading(false);
      }

      DOM.retryBtn.addEventListener('click', () => {
        if (state.currentBook) {
          state.retryCount = 0;
          openBook(state.currentBook.fileId, state.currentBook.title);
        }
      });

      // ============================================
      // FLIP ANIMATION
      // ============================================
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads - 1) return;
        
        state.isFlipping = true;
        updateNav();
        
        // Pre-render next page on back
        const nextLeft = (state.currentSpread + 1) * 2 + 1;
        if (nextLeft <= state.totalPages && state.pdfData) {
          await renderPageImage(nextLeft, DOM.pdfCanvasBack, state.pdfData);
        }
        
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        await sleep(600);
        
        state.currentSpread++;
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        if (state.pdfData) {
          await renderSpreadBase64(state.currentSpread, state.pdfData);
        }
        
        await sleep(50);
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        
        state.isFlipping = false;
        updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        
        state.isFlipping = true;
        updateNav();
        
        const prevRight = state.currentSpread * 2;
        if (prevRight <= state.totalPages && state.pdfData) {
          await renderPageImage(prevRight, DOM.pdfCanvasBack, state.pdfData);
        }
        
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        
        state.currentSpread--;
        if (state.pdfData) {
          await renderSpreadBase64(state.currentSpread, state.pdfData);
        }
        
        await sleep(50);
        
        DOM.pageFlip.style.transition = 'transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        
        await sleep(600);
        
        state.isFlipping = false;
        updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfData = null;
        state.currentBook = null;
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
      }

      // ============================================
      // EVENTS
      // ============================================
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);

      document.addEventListener('keydown', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
        else if (e.key === 'Home') { e.preventDefault(); state.currentSpread = 0; if (state.pdfData) renderSpreadBase64(0, state.pdfData); }
        else if (e.key === 'End') { e.preventDefault(); state.currentSpread = state.totalSpreads - 1; if (state.pdfData) renderSpreadBase64(state.currentSpread, state.pdfData); }
      });

      let tx = 0, ty = 0;
      DOM.pageFrontFace.addEventListener('touchstart', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        tx = e.touches[0].clientX;
        ty = e.touches[0].clientY;
      }, {passive: true});

      DOM.pageFrontFace.addEventListener('touchend', (e) => {
        if (!state.currentBook || state.isFlipping || !tx) return;
        const dx = tx - e.changedTouches[0].clientX;
        const dy = ty - e.changedTouches[0].clientY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          dx > 0 ? flipNext() : flipPrev();
        }
        tx = 0;
      });

      DOM.pageFrontFace.addEventListener('click', (e) => {
        if (!state.currentBook || state.isFlipping) return;
        const rect = DOM.pageFrontFace.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.25) flipPrev();
        else if (x > rect.width * 0.75) flipNext();
      });

      let rt;
      window.addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => {
          if (state.pdfData && state.currentBook) renderSpreadBase64(state.currentSpread, state.pdfData);
        }, 300);
      });

      // ============================================
      // PWA
      // ============================================
      if ('serviceWorker' in navigator) {
        const swBlob = new Blob([
          'self.addEventListener("install",e=>e.waitUntil(self.skipWaiting()));',
          'self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));',
          'self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open("dl-v4").then(ca=>ca.put(e.request,c));return r}).catch(()=>caches.match(e.request)))})'
        ], {type:'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
      }

      // ============================================
      // INIT
      // ============================================
      console.log('📖 Digital Library v4.0');
      console.log('✅ FULL Base64 - No External Dependencies');
      console.log('✅ No CDN - No Tracking Prevention Issues');
      console.log('✅ All content rendered from Base64');
      
      fetchBooks();
      
    })();
  </script>
</body>
</html>
