<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>📖 Digital Library</title>
  <link rel="icon" href="https://i.imgur.com/JkxRYd6.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/JkxRYd6.png">
  
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --text: #e0d5c5;
      --text-secondary: #8a7a6a; --accent: #c9a87c; --page-color: #fdf8f2;
      --success: #27ae60; --danger: #e74c3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, system-ui, sans-serif; background: var(--bg);
      width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    
    .app-header {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100; flex-shrink: 0; min-height: 46px;
    }
    .logo { width: 30px; height: 30px; border-radius: 6px; background: url('https://i.imgur.com/JkxRYd6.png') center/contain no-repeat; flex-shrink: 0; }
    .app-title { color: var(--text); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    .search-wrapper { flex: 1; position: relative; max-width: 300px; margin: 0 8px; }
    .search-input {
      width: 100%; padding: 6px 12px 6px 30px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      color: var(--text); font-size: 0.75rem; outline: none; font-family: inherit;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-secondary); }
    .refresh-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: var(--text); padding: 4px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem; }
    .refresh-btn:hover { background: rgba(255,255,255,0.12); }
    
    .main-content { flex: 1; position: relative; overflow: hidden; }
    
    .library-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .book-scroll { flex: 1; overflow-y: auto; padding: 10px 14px; }
    .book-scroll::-webkit-scrollbar { width: 3px; }
    .book-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    
    .book-card {
      background: var(--surface); border-radius: 10px; padding: 16px 12px;
      cursor: pointer; transition: all 0.25s; text-align: center;
      border: 1px solid transparent;
    }
    .book-card:hover { border-color: rgba(201,168,124,0.4); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .book-card:active { transform: scale(0.97); }
    .book-card .emoji { font-size: 2rem; margin-bottom: 8px; }
    .book-card .title {
      color: var(--text); font-size: 0.75rem; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-card .link {
      color: var(--text-secondary); font-size: 0.55rem; margin-top: 4px;
      word-break: break-all; font-family: monospace;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    
    .reader-view {
      position: absolute; inset: 0; background: #000; display: flex;
      flex-direction: column; transform: translateX(105%); transition: transform 0.4s; z-index: 50;
    }
    .reader-view.active { transform: translateX(0); }
    
    .reader-topbar {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      background: rgba(0,0,0,0.9); z-index: 60; flex-shrink: 0;
    }
    .btn-back {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); padding: 5px 12px; border-radius: 14px;
      cursor: pointer; font-size: 0.72rem; font-family: inherit;
    }
    .btn-back:hover { background: rgba(255,255,255,0.14); }
    .reader-title {
      flex: 1; color: var(--text); font-size: 0.74rem; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    
    .book-area {
      flex: 1; position: relative; display: flex; align-items: center;
      justify-content: center; perspective: 2000px; overflow: hidden; background: #0a0a0a;
    }
    .book-spread { width: 100%; height: 100%; display: flex; position: relative; }
    
    .page-left-wrap { width: 50%; height: 100%; position: relative; }
    .page-left-inner {
      position: absolute; inset: 0; background: var(--page-color);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pdf-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px; overflow: hidden; }
    .pdf-canvas { max-width: 100%; max-height: 100%; background: #fff; }
    
    .page-right-wrap { width: 50%; height: 100%; position: relative; perspective: 1500px; }
    .page-flip {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      z-index: 10; transform-origin: left center;
    }
    .page-back-face {
      position: absolute; inset: 0; background: #e8dcc8;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; padding: 6px;
    }
    .page-front-face {
      position: absolute; inset: 0; background: var(--page-color);
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pdf-canvas-right, .pdf-canvas-back { max-width: 100%; max-height: 100%; background: #fff; }
    
    .page-label { text-align: center; padding: 3px; font-size: 0.55rem; color: #aaa; flex-shrink: 0; }
    .spine-line {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
      background: rgba(0,0,0,0.15); transform: translateX(-50%); z-index: 30; pointer-events: none;
    }
    
    .load-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 80;
    }
    .load-overlay.hidden { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.08);
      border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { color: var(--text-secondary); margin-top: 10px; font-size: 0.72rem; }
    .load-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .load-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.3s; }
    .retry-btn { background: var(--accent); color: #1a1a1a; border: none; padding: 7px 18px; border-radius: 18px; cursor: pointer; font-weight: 600; font-size: 0.72rem; margin-top: 12px; font-family: inherit; }
    .retry-btn.hidden { display: none; }
    
    .reader-bottombar {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 8px 16px; background: rgba(0,0,0,0.9); flex-shrink: 0; z-index: 60;
    }
    .nav-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: var(--text); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.15; cursor: not-allowed; }
    .page-indicator {
      color: var(--text); font-size: 0.78rem; font-weight: 600; min-width: 80px;
      text-align: center; background: rgba(255,255,255,0.04); padding: 5px 12px; border-radius: 12px;
    }
    
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 20px; font-size: 0.74rem;
      z-index: 200; display: none; animation: slideDown 0.3s; font-weight: 600;
    }
    .toast.show { display: block; }
    .toast.error { background: var(--danger); color: #fff; }
    .toast.success { background: var(--success); color: #fff; }
    @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    
    @media (max-width: 768px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
      .book-card { padding: 12px 8px; }
      .book-card .emoji { font-size: 1.5rem; }
      .book-card .title { font-size: 0.68rem; }
      .reader-topbar { padding: 4px 8px; }
      .reader-bottombar { padding: 6px 10px; gap: 10px; }
      .nav-btn { width: 34px; height: 34px; font-size: 0.9rem; }
    }
    @media (max-width: 480px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .app-header { flex-wrap: wrap; }
      .search-wrapper { order: 10; max-width: 100%; flex-basis: 100%; margin: 4px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <div class="logo"></div>
      <span class="app-title">Digital Library</span>
      <div class="search-wrapper">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:0.8rem;color:var(--text-secondary);">🔍</span>
        <input type="search" class="search-input" id="searchInput" placeholder="Cari buku..." autocomplete="off">
      </div>
      <button class="refresh-btn" id="refreshBtn">🔄</button>
    </div>

    <div class="main-content">
      <div class="library-view" id="libraryView">
        <div class="book-scroll" id="bookScroll">
          <div class="load-overlay" id="libLoading"><div class="spinner"></div><div class="load-text">Memuat buku...</div></div>
        </div>
      </div>

      <div class="reader-view" id="readerView">
        <div class="reader-topbar">
          <button class="btn-back" id="btnBack">← Kembali</button>
          <div class="reader-title" id="readerBookTitle">Pilih buku</div>
        </div>

        <div class="book-area">
          <div class="book-spread">
            <div class="page-left-wrap">
              <div class="page-left-inner">
                <div class="pdf-area"><canvas class="pdf-canvas" id="pdfCanvasLeft"></canvas></div>
                <div class="page-label" id="pageLabelLeft"></div>
              </div>
            </div>
            <div class="page-right-wrap">
              <div class="page-flip" id="pageFlip">
                <div class="page-back-face"><canvas class="pdf-canvas-back" id="pdfCanvasBack"></canvas></div>
                <div class="page-front-face">
                  <div class="pdf-area"><canvas class="pdf-canvas-right" id="pdfCanvasRight"></canvas></div>
                  <div class="page-label" id="pageLabelRight"></div>
                </div>
              </div>
            </div>
            <div class="spine-line"></div>
          </div>
          <div class="load-overlay" id="readerLoading">
            <div class="spinner"></div>
            <div class="load-text" id="readerLoadText">Membuka PDF...</div>
            <div class="load-bar"><div class="load-bar-fill" id="loadBarFill"></div></div>
            <button class="retry-btn hidden" id="retryBtn">🔄 Coba Lagi</button>
          </div>
        </div>

        <div class="reader-bottombar">
          <button class="nav-btn" id="btnPrev" disabled>◀</button>
          <span class="page-indicator" id="pageIndicator">0 / 0</span>
          <button class="nav-btn" id="btnNext" disabled>▶</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwG0iQUK0-2evTzBfjM3pmEVBHDrlzroyJzdk-9ZfrSaA8l7POsziMHSXjSitUWeZrN/exec';

      var state = {
        books: [], currentBook: null, pdfDoc: null,
        totalPages: 0, totalSpreads: 0, currentSpread: 0, isFlipping: false
      };

      function $(id) { return document.getElementById(id); }
      var DOM = {
        libraryView: $('libraryView'), bookScroll: $('bookScroll'), libLoading: $('libLoading'),
        searchInput: $('searchInput'), refreshBtn: $('refreshBtn'),
        readerView: $('readerView'), readerLoading: $('readerLoading'),
        readerLoadText: $('readerLoadText'), loadBarFill: $('loadBarFill'),
        retryBtn: $('retryBtn'), pageFlip: $('pageFlip'), pageFrontFace: $('pageFrontFace'),
        pdfCanvasLeft: $('pdfCanvasLeft'), pdfCanvasRight: $('pdfCanvasRight'),
        pdfCanvasBack: $('pdfCanvasBack'), pageLabelLeft: $('pageLabelLeft'),
        pageLabelRight: $('pageLabelRight'), pageIndicator: $('pageIndicator'),
        readerBookTitle: $('readerBookTitle'), btnPrev: $('btnPrev'),
        btnNext: $('btnNext'), btnBack: $('btnBack'), toast: $('toast')
      };

      function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
      function escHtml(s) { return s ? String(s).replace(/[&<>"']/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]; }) : ''; }
      
      function toast(msg, type, dur) {
        DOM.toast.textContent = msg; DOM.toast.className = 'toast show ' + (type || 'info');
        clearTimeout(state._tt); state._tt = setTimeout(function() { DOM.toast.classList.remove('show'); }, dur || 2500);
      }

      function showLibLoading(s) { DOM.libLoading.classList.toggle('hidden', !s); }
      function showReaderLoading(s, txt, prog) {
        DOM.readerLoading.classList.toggle('hidden', !s);
        if (txt) DOM.readerLoadText.textContent = txt;
        DOM.loadBarFill.style.width = (prog || 0) + '%';
        if (s) DOM.retryBtn.classList.add('hidden');
      }

      function updateNav() {
        DOM.btnPrev.disabled = state.currentSpread <= 0 || state.isFlipping;
        DOM.btnNext.disabled = state.currentSpread >= state.totalSpreads - 1 || state.isFlipping;
        var lp = state.currentSpread * 2 + 1, rp = Math.min(lp + 1, state.totalPages);
        DOM.pageIndicator.textContent = lp + '-' + rp + ' / ' + state.totalPages;
      }

      function clearCanvas(c) { if (c) { c.width = 1; c.height = 1; c.getContext('2d').clearRect(0, 0, 1, 1); } }

      // ============ FETCH BOOKS FROM B2:B ============
      async function fetchBooks() {
        showLibLoading(true);
        try {
          var res = await fetch(WEBAPP_URL);
          var data = await res.json();
          if (data.success) {
            state.books = data.books || [];
            renderBooks();
          }
        } catch (e) {
          state.books = [{
            title: 'Sample PDF', url: 'https://drive.google.com/open?id=11331lbF_25t8rLm5MPkHiJJlyMeG7uGy',
            fileId: '11331lbF_25t8rLm5MPkHiJJlyMeG7uGy', academicYear: '2024/2025', category: 'Teknologi'
          }];
          renderBooks();
        }
        showLibLoading(false);
      }

      function renderBooks() {
        if (!state.books.length) {
          DOM.bookScroll.innerHTML = '<div style="text-align:center;padding:50px;color:var(--text-secondary);"><div style="font-size:3rem;">📭</div><div>Tidak ada buku di B2:B</div><div style="font-size:0.7rem;">Tambahkan link PDF di spreadsheet</div></div>';
          return;
        }
        var icons = ['📕','📗','📘','📙','📓','📔','📒','📑','📖','📚'];
        var html = '<div class="book-grid">';
        state.books.forEach(function(b, i) {
          html += '<div class="book-card" data-fileid="' + escHtml(b.fileId) + '" data-title="' + escHtml(b.title) + '">';
          html += '<div class="emoji">' + icons[i % 10] + '</div>';
          html += '<div class="title">' + escHtml(b.title) + '</div>';
          html += '<div class="link">📎 ' + escHtml((b.url || '').substring(0, 35)) + '...</div>';
          html += '</div>';
        });
        html += '</div>';
        DOM.bookScroll.innerHTML = html;
        
        DOM.bookScroll.querySelectorAll('.book-card').forEach(function(card) {
          card.addEventListener('click', function() {
            openBook(this.getAttribute('data-fileid'), this.getAttribute('data-title'));
          });
        });
      }

      // ============ SEARCH ============
      var st;
      DOM.searchInput.addEventListener('input', function() {
        clearTimeout(st);
        var self = this;
        st = setTimeout(function() {
          var q = self.value.trim().toLowerCase();
          if (q) {
            var filtered = state.books.filter(function(b) { return b.title.toLowerCase().indexOf(q) !== -1; });
            var all = state.books;
            state.books = filtered;
            renderBooks();
            state.books = all;
          } else {
            renderBooks();
          }
        }, 300);
      });
      DOM.refreshBtn.addEventListener('click', fetchBooks);

      // ============ OPEN BOOK & RENDER PDF ============
      async function openBook(fileId, title) {
        state.currentBook = { fileId: fileId, title: title };
        state.pdfDoc = null; state.totalPages = 0; state.totalSpreads = 0;
        state.currentSpread = 0; state.isFlipping = false;

        DOM.readerBookTitle.textContent = title;
        DOM.readerView.classList.add('active');
        DOM.pageFlip.style.transition = 'none';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        clearCanvas(DOM.pdfCanvasLeft); clearCanvas(DOM.pdfCanvasRight); clearCanvas(DOM.pdfCanvasBack);
        DOM.pageLabelLeft.textContent = ''; DOM.pageLabelRight.textContent = '';
        DOM.pageIndicator.textContent = '0 / 0'; updateNav();
        showReaderLoading(true, 'Menghubungi server...', 5);

        try {
          // Get PDF info
          var infoUrl = WEBAPP_URL + '?action=getPDFInfo&fileId=' + fileId;
          var infoRes = await fetch(infoUrl);
          var infoData = await infoRes.json();
          if (!infoData.success) throw new Error('Gagal info PDF: ' + (infoData.error || 'unknown'));

          // Download chunks
          var totalChunks = infoData.totalChunks;
          var fullBase64 = '';
          for (var i = 0; i < totalChunks; i++) {
            var chunkUrl = WEBAPP_URL + '?action=getPDFChunk&fileId=' + fileId + '&chunk=' + i;
            var chunkRes = await fetch(chunkUrl);
            var chunkData = await chunkRes.json();
            if (!chunkData.success) throw new Error('Chunk ' + i + ' gagal');
            fullBase64 += chunkData.data;
            showReaderLoading(true, 'Mengunduh ' + (i+1) + '/' + totalChunks, 5 + Math.round(((i+1)/totalChunks)*40));
          }
          console.log('✅ Base64 downloaded:', fullBase64.length);

          // Render with PDF.js
          showReaderLoading(true, 'Memproses PDF...', 50);
          await renderPDF(fullBase64);
          
          showReaderLoading(false);
          updateNav();
          toast('✅ PDF siap! ' + state.totalPages + ' halaman', 'success', 2500);

        } catch (e) {
          console.error('Error:', e);
          showReaderLoading(false);
          DOM.retryBtn.classList.remove('hidden');
          toast('❌ ' + e.message, 'error', 4000);
          state.totalPages = 10; state.totalSpreads = 5;
          renderFallbackSpread(0);
          updateNav();
        }
      }

      async function renderPDF(base64Data) {
        try {
          // Convert base64 to binary
          var binaryStr = atob(base64Data);
          var bytes = new Uint8Array(binaryStr.length);
          for (var i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

          // Load with PDF.js
          if (typeof pdfjsLib === 'undefined') {
            await loadPDFJS();
          }

          if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js tidak tersedia');

          var loadingTask = pdfjsLib.getDocument({ data: bytes });
          state.pdfDoc = await loadingTask.promise;
          state.totalPages = state.pdfDoc.numPages;
          state.totalSpreads = Math.ceil(state.totalPages / 2);
          state.currentSpread = 0;
          console.log('✅ PDF loaded:', state.totalPages, 'pages');

          showReaderLoading(true, 'Merender halaman...', 80);
          await renderPDFSpread(0);

        } catch (e) {
          console.warn('PDF.js failed:', e.message);
          state.totalPages = 10; state.totalSpreads = 5;
          renderFallbackSpread(0);
        }
      }

      function loadPDFJS() {
        return new Promise(function(resolve) {
          if (typeof pdfjsLib !== 'undefined') { resolve(); return; }
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload = function() {
            if (typeof pdfjsLib !== 'undefined') {
              pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }
            resolve();
          };
          s.onerror = function() { resolve(); };
          document.head.appendChild(s);
        });
      }

      async function renderPDFSpread(idx) {
        var lp = idx * 2 + 1, rp = lp + 1;
        if (lp <= state.totalPages) {
          await renderPDFPage(lp, DOM.pdfCanvasLeft);
          DOM.pageLabelLeft.textContent = 'Hal ' + lp;
        } else { clearCanvas(DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = ''; }
        if (rp <= state.totalPages) {
          await renderPDFPage(rp, DOM.pdfCanvasRight);
          DOM.pageLabelRight.textContent = 'Hal ' + rp;
        } else { clearCanvas(DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = ''; }
        updateNav();
      }

      async function renderPDFPage(num, canvas) {
        if (!state.pdfDoc || num > state.totalPages) return;
        try {
          var page = await state.pdfDoc.getPage(num);
          var pw = canvas.parentElement.clientWidth - 12;
          var ph = canvas.parentElement.clientHeight - 12;
          var vp = page.getViewport({ scale: 1 });
          var scale = Math.min(pw/vp.width, ph/vp.height, 2.5);
          var svp = page.getViewport({ scale: scale });
          canvas.height = svp.height; canvas.width = svp.width;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport: svp, background: '#fff' }).promise;
        } catch (e) {
          renderFallbackPage(num, canvas);
        }
      }

      function renderFallbackSpread(idx) {
        var lp = idx * 2 + 1, rp = lp + 1;
        if (lp <= state.totalPages) { renderFallbackPage(lp, DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = 'Hal ' + lp; }
        else { clearCanvas(DOM.pdfCanvasLeft); DOM.pageLabelLeft.textContent = ''; }
        if (rp <= state.totalPages) { renderFallbackPage(rp, DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = 'Hal ' + rp; }
        else { clearCanvas(DOM.pdfCanvasRight); DOM.pageLabelRight.textContent = ''; }
        updateNav();
      }

      function renderFallbackPage(num, canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.parentElement.clientWidth - 10;
        var h = canvas.parentElement.clientHeight - 10;
        canvas.width = w; canvas.height = h;
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5; ctx.strokeRect(4, 4, w-8, h-8);
        ctx.fillStyle = '#333'; ctx.textAlign = 'center';
        ctx.font = 'bold 18px Georgia'; ctx.fillText('Halaman ' + num, w/2, h/3);
        if (state.currentBook) {
          ctx.font = '13px Georgia'; ctx.fillStyle = '#666';
          ctx.fillText(state.currentBook.title, w/2, h/3+30);
        }
        ctx.font = '12px Georgia'; ctx.fillStyle = '#999';
        ctx.fillText('Link: ' + (state.currentBook ? state.currentBook.fileId.substring(0, 20) : '') + '...', w/2, h/2+20);
        ctx.font = 'italic 10px Georgia'; ctx.fillText('— ' + num + ' —', w/2, h-20);
      }

      // ============ FLIP ============
      async function flipNext() {
        if (state.isFlipping || state.currentSpread >= state.totalSpreads - 1) return;
        state.isFlipping = true; updateNav();
        var nl = (state.currentSpread + 1) * 2 + 1;
        if (state.pdfDoc && nl <= state.totalPages) await renderPDFPage(nl, DOM.pdfCanvasBack);
        else if (nl <= state.totalPages) renderFallbackPage(nl, DOM.pdfCanvasBack);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        await sleep(550);
        state.currentSpread++;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
        if (state.pdfDoc) await renderPDFSpread(state.currentSpread);
        else renderFallbackSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        state.isFlipping = false; updateNav();
      }

      async function flipPrev() {
        if (state.isFlipping || state.currentSpread <= 0) return;
        state.isFlipping = true; updateNav();
        var pr = state.currentSpread * 2;
        if (state.pdfDoc && pr <= state.totalPages) await renderPDFPage(pr, DOM.pdfCanvasBack);
        else if (pr <= state.totalPages) renderFallbackPage(pr, DOM.pdfCanvasBack);
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(-180deg)';
        state.currentSpread--;
        if (state.pdfDoc) await renderPDFSpread(state.currentSpread);
        else renderFallbackSpread(state.currentSpread);
        await sleep(30);
        DOM.pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1)';
        DOM.pageFlip.style.transform = 'rotateY(0deg)';
        await sleep(550);
        state.isFlipping = false; updateNav();
      }

      function goBack() {
        DOM.readerView.classList.remove('active');
        state.pdfDoc = null; state.currentBook = null;
        DOM.pageFlip.style.transition = 'none'; DOM.pageFlip.style.transform = 'rotateY(0deg)';
      }

      // ============ EVENTS ============
      DOM.btnPrev.addEventListener('click', flipPrev);
      DOM.btnNext.addEventListener('click', flipNext);
      DOM.btnBack.addEventListener('click', goBack);
      DOM.retryBtn.addEventListener('click', function() {
        if (state.currentBook) openBook(state.currentBook.fileId, state.currentBook.title);
      });

      document.addEventListener('keydown', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); flipNext(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); flipPrev(); }
        else if (e.key === 'Escape') goBack();
      });

      var tx = 0;
      DOM.pageFrontFace.addEventListener('touchstart', function(e) {
        if (state.currentBook && !state.isFlipping) tx = e.touches[0].clientX;
      }, { passive: true });
      DOM.pageFrontFace.addEventListener('touchend', function(e) {
        if (!state.currentBook || state.isFlipping || !tx) return;
        var dx = tx - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) dx > 0 ? flipNext() : flipPrev();
        tx = 0;
      });
      DOM.pageFrontFace.addEventListener('click', function(e) {
        if (!state.currentBook || state.isFlipping) return;
        var rect = DOM.pageFrontFace.getBoundingClientRect();
        var x = e.clientX - rect.left;
        if (x < rect.width * 0.25) flipPrev();
        else if (x > rect.width * 0.75) flipNext();
      });

      window.addEventListener('resize', function() {
        clearTimeout(state._rt);
        state._rt = setTimeout(function() {
          if (state.currentBook) {
            if (state.pdfDoc) renderPDFSpread(state.currentSpread);
            else renderFallbackSpread(state.currentSpread);
          }
        }, 300);
      });

      // PWA Service Worker
      if ('serviceWorker' in navigator) {
        var swCode = 'self.addEventListener("install",function(e){e.waitUntil(self.skipWaiting())});self.addEventListener("activate",function(e){e.waitUntil(self.clients.claim())});self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request).then(function(r){var c=r.clone();caches.open("dl-v15").then(function(ca){ca.put(e.request,c)});return r}).catch(function(){return caches.match(e.request)}))});';
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))).catch(function(){});
      }

      // ============ INIT ============
      console.log('📖 Digital Library - B2:B PDF Reader');
      console.log('✅ PWA Ready');
      console.log('✅ Reads PDF links from spreadsheet B2:B');
      console.log('✅ PDF.js + Fallback renderer');

      // Preload PDF.js
      if (typeof pdfjsLib === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = function() {
          if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            console.log('✅ PDF.js loaded');
          }
        };
        document.head.appendChild(s);
      }

      fetchBooks();

    })();
  </script>
</body>
</html>
